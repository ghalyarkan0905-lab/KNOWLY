{id:"b1-r1",t:"Working from Home",topic:"Work & Career",min:2,p:[["More and more people now work from home. Some companies allow their staff to do this a few days a week, while others let them stay at home all the time. For many workers, the biggest advantage is saving time. They do not need to travel to the office, so they can sleep longer and spend more time with their family.","Semakin banyak orang kini bekerja dari rumah. Sebagian perusahaan mengizinkan stafnya melakukannya beberapa hari dalam seminggu, sementara yang lain membolehkan mereka tinggal di rumah sepanjang waktu. Bagi banyak pekerja, keuntungan terbesarnya adalah menghemat waktu. Mereka tidak perlu pergi ke kantor, sehingga bisa tidur lebih lama dan menghabiskan lebih banyak waktu bersama keluarga."],["However, working from home is not always easy. It can be difficult to separate work from personal life. Some people work longer hours because their laptop is always nearby. Others feel lonely because they rarely meet their colleagues in person.","Namun, bekerja dari rumah tidak selalu mudah. Bisa sulit memisahkan pekerjaan dari kehidupan pribadi. Sebagian orang bekerja lebih lama karena laptop mereka selalu ada di dekat mereka. Yang lain merasa kesepian karena jarang bertemu rekan kerja secara langsung."],["To work well at home, experts suggest creating a clear schedule and a quiet workspace. It also helps to take short breaks and to talk with colleagues regularly. With good habits, remote work can be both productive and enjoyable.","Agar bekerja dengan baik di rumah, para ahli menyarankan membuat jadwal yang jelas dan ruang kerja yang tenang. Istirahat singkat dan berbicara dengan rekan kerja secara rutin juga membantu. Dengan kebiasaan yang baik, kerja jarak jauh bisa produktif sekaligus menyenangkan."]],kw:[["advantage","keuntungan"],["separate","memisahkan"],["colleagues","rekan kerja"],["workspace","ruang kerja"],["productive","produktif"]],q:[["What is the biggest advantage for many workers?",["A higher salary","Saving travel time","More holidays"],"Saving travel time","Paragraf 1 menyebut keuntungan terbesarnya adalah menghemat waktu karena tidak perlu ke kantor."],["Some people work longer hours because their laptop is always nearby.",["True","False"],"True","Paragraf 2 menyebut hal ini sebagai salah satu kesulitan."],["Working from home is always easy.",["True","False"],"False","Teks menyatakan bekerja dari rumah tidak selalu mudah."],["What do experts suggest?",["Working at night","A clear schedule and a quiet workspace","Avoiding colleagues"],"A clear schedule and a quiet workspace","Paragraf 3 menyarankan jadwal yang jelas dan ruang kerja yang tenang."]]},
{id:"b1-r2",t:"Why Sleep Matters",topic:"Health",min:2,p:[["Many adults need seven to nine hours of sleep every night, but a lot of people sleep much less. Modern life is busy, and phones and television often keep us awake late at night. As a result, many people feel tired during the day.","Banyak orang dewasa membutuhkan tidur tujuh sampai sembilan jam setiap malam, tetapi banyak orang tidur jauh lebih sedikit. Kehidupan modern sibuk, dan ponsel serta televisi sering membuat kita terjaga sampai larut malam. Akibatnya, banyak orang merasa lelah di siang hari."],["Sleep is important for both the body and the mind. While we sleep, our body repairs itself and our brain stores new information. People who do not sleep enough often find it hard to concentrate, and they may get sick more easily.","Tidur penting bagi tubuh dan pikiran. Saat kita tidur, tubuh memperbaiki dirinya dan otak menyimpan informasi baru. Orang yang kurang tidur sering sulit berkonsentrasi dan bisa lebih mudah sakit."],["You can improve your sleep with a few simple habits. Go to bed at the same time every night, and avoid screens for an hour before bed. A cool, dark room also helps. If you follow these tips, you will probably feel more energetic the next day.","Kamu bisa memperbaiki tidurmu dengan beberapa kebiasaan sederhana. Tidurlah pada jam yang sama setiap malam, dan hindari layar satu jam sebelum tidur. Kamar yang sejuk dan gelap juga membantu. Jika kamu mengikuti tips ini, besok kamu mungkin akan merasa lebih bertenaga."]],kw:[["mind","pikiran"],["repairs","memperbaiki"],["concentrate","berkonsentrasi"],["habits","kebiasaan"],["energetic","bertenaga"]],q:[["How many hours of sleep do many adults need?",["Four to five","Seven to nine","Ten to twelve"],"Seven to nine","Paragraf 1 menyebut tujuh sampai sembilan jam."],["While we sleep, our brain stores new information.",["True","False"],"True","Paragraf 2 menyebut otak menyimpan informasi baru saat kita tidur."],["Why do many people feel tired during the day?",["They sleep too much","They often sleep too little","They exercise too much"],"They often sleep too little","Banyak orang tidur jauh lebih sedikit dari yang dibutuhkan."],["Which tip does the text give?",["Use your phone before bed","Go to bed at the same time every night","Sleep in a bright room"],"Go to bed at the same time every night","Paragraf 3 menyarankan tidur pada jam yang sama setiap malam."]]},
{id:"b1-r3",t:"Saving the Ocean",topic:"Environment",min:2,p:[["Plastic pollution is a serious problem for the ocean. Every year, millions of tons of plastic enter the sea. Much of it comes from bottles, bags, and food packaging that people throw away carelessly.","Polusi plastik adalah masalah serius bagi laut. Setiap tahun, jutaan ton plastik masuk ke laut. Sebagian besar berasal dari botol, kantong, dan kemasan makanan yang dibuang orang sembarangan."],["This waste harms sea animals. Turtles sometimes eat plastic bags because they look like jellyfish, and birds can get trapped in old fishing nets. Over time, plastic breaks into tiny pieces that are almost impossible to remove.","Sampah ini membahayakan hewan laut. Penyu kadang memakan kantong plastik karena terlihat seperti ubur-ubur, dan burung bisa terjerat jaring ikan bekas. Seiring waktu, plastik pecah menjadi potongan kecil yang hampir mustahil dibersihkan."],["Everyone can help. We can bring our own bags, use reusable bottles, and recycle whenever possible. Many communities also organize beach clean-ups. Small actions may seem unimportant, but together they can make a big difference.","Setiap orang bisa membantu. Kita bisa membawa tas sendiri, memakai botol yang bisa dipakai ulang, dan mendaur ulang kapan pun memungkinkan. Banyak komunitas juga mengadakan bersih-bersih pantai. Tindakan kecil mungkin tampak tidak penting, tetapi bersama-sama dapat membawa perubahan besar."]],kw:[["pollution","polusi"],["harms","membahayakan"],["trapped","terjerat"],["reusable","bisa dipakai ulang"],["difference","perubahan; perbedaan"]],q:[["Where does much of the plastic come from?",["Factories only","Bottles, bags and food packaging","Fishing boats only"],"Bottles, bags and food packaging","Paragraf 1 menyebut botol, kantong, dan kemasan makanan."],["Turtles sometimes eat plastic bags because they look like jellyfish.",["True","False"],"True","Paragraf 2 menyebut hal ini."],["Plastic quickly disappears in the sea.",["True","False"],"False","Plastik pecah menjadi potongan kecil dan hampir mustahil dibersihkan, bukan hilang."],["What can individuals do to help?",["Use reusable bottles and recycle","Throw waste in the sea","Stop using the ocean"],"Use reusable bottles and recycle","Paragraf 3 menyarankan botol yang bisa dipakai ulang dan mendaur ulang."]]},
{id:"b1-r4",t:"Street Food in Southeast Asia",topic:"Food & Dining",min:2,p:[["Street food is a big part of life in Southeast Asia. In the evening, small stalls appear along the road, and the smell of grilled meat and spices fills the air. Many locals eat there every day because the food is cheap, fresh, and delicious.","Makanan kaki lima adalah bagian besar kehidupan di Asia Tenggara. Pada sore hari, lapak-lapak kecil muncul di pinggir jalan, dan aroma daging bakar serta rempah memenuhi udara. Banyak warga setempat makan di sana setiap hari karena makanannya murah, segar, dan lezat."],["Tourists also enjoy street food, but they should be careful. It is a good idea to choose stalls that are busy, because the food is usually fresh. Drinking bottled water and washing your hands before eating can also help you avoid stomach problems.","Wisatawan juga menikmati makanan kaki lima, tetapi mereka harus berhati-hati. Sebaiknya pilih lapak yang ramai, karena makanannya biasanya segar. Minum air kemasan dan mencuci tangan sebelum makan juga bisa membantu menghindari masalah perut."],["Street food is not only about eating. Cooks often prepare the meals in front of customers, so people can watch and chat with them. For many travelers, this friendly atmosphere is the best part of the experience.","Makanan kaki lima bukan hanya soal makan. Para juru masak sering menyiapkan hidangan di depan pelanggan, sehingga orang bisa menonton dan mengobrol dengan mereka. Bagi banyak pelancong, suasana ramah ini adalah bagian terbaik dari pengalaman itu."]],kw:[["stalls","lapak"],["fresh","segar"],["locals","warga setempat"],["atmosphere","suasana"],["avoid","menghindari"]],q:[["Why do many locals eat street food every day?",["It is cheap, fresh and delicious","It is only for tourists","It is very expensive"],"It is cheap, fresh and delicious","Paragraf 1 menyebut makanannya murah, segar, dan lezat."],["Tourists should choose stalls that are busy.",["True","False"],"True","Paragraf 2 menyarankan memilih lapak yang ramai karena makanannya biasanya segar."],["Which tip helps avoid stomach problems?",["Drinking bottled water and washing hands","Eating very fast","Avoiding all drinks"],"Drinking bottled water and washing hands","Paragraf 2 menyebut minum air kemasan dan mencuci tangan."],["Cooks never talk to their customers.",["True","False"],"False","Paragraf 3 menyebut orang bisa menonton dan mengobrol dengan juru masak."]]},
{id:"b1-r5",t:"Learning English Online",topic:"Education",min:2,p:[["Learning English online has become very popular. Students can watch videos, join video lessons, and practice with apps at any time. This is helpful for people who have a busy schedule or who live far from a language school.","Belajar bahasa Inggris secara daring menjadi sangat populer. Pelajar bisa menonton video, mengikuti kelas video, dan berlatih dengan aplikasi kapan saja. Ini membantu orang yang jadwalnya padat atau tinggal jauh dari sekolah bahasa."],["However, online learning needs self-discipline. Without a teacher in the room, it is easy to stop studying or to delay lessons until tomorrow. Successful learners usually set small goals, such as learning five new words a day, and they review them regularly.","Namun, belajar daring membutuhkan disiplin diri. Tanpa guru di dalam ruangan, mudah sekali berhenti belajar atau menunda pelajaran sampai besok. Pelajar yang berhasil biasanya menetapkan tujuan kecil, seperti mempelajari lima kata baru sehari, dan mengulangnya secara rutin."],["Speaking is often the hardest skill to practice online. To improve, try talking to a language partner or recording your own voice. Even ten minutes of speaking every day can make you feel more confident.","Berbicara sering menjadi keterampilan tersulit untuk dilatih secara daring. Untuk meningkatkannya, cobalah berbicara dengan teman latihan bahasa atau merekam suaramu sendiri. Bahkan sepuluh menit berbicara setiap hari dapat membuatmu lebih percaya diri."]],kw:[["goals","tujuan"],["regularly","secara rutin"],["confident","percaya diri"],["partner","rekan latihan"],["successful","berhasil"]],q:[["Why is online learning helpful for busy people?",["They can study at any time","They must study at night","They need a school nearby"],"They can study at any time","Paragraf 1 menyebut pelajar bisa berlatih kapan saja."],["Online learning needs self-discipline.",["True","False"],"True","Paragraf 2 membuka dengan pernyataan ini."],["What is an example of a small goal?",["Learning five new words a day","Studying ten hours at once","Stopping lessons"],"Learning five new words a day","Paragraf 2 memberi contoh lima kata baru sehari."],["What can make you feel more confident in speaking?",["Ten minutes of speaking every day","Never speaking","Only reading"],"Ten minutes of speaking every day","Paragraf 3 menyebut sepuluh menit berbicara setiap hari."]]}

{id:"b2-r1",t:"The Gig Economy",topic:"Work & Career",min:3,p:[["In recent years, the gig economy has grown rapidly. Instead of working for one employer, many people now earn money by taking short-term jobs, such as driving for a ride-hailing app or designing logos for online clients. Supporters argue that this system offers freedom, because workers can choose when and where they work.","Dalam beberapa tahun terakhir, ekonomi gig tumbuh dengan pesat. Alih-alih bekerja untuk satu pemberi kerja, kini banyak orang mencari uang dengan mengambil pekerjaan jangka pendek, seperti mengemudi untuk aplikasi transportasi daring atau mendesain logo untuk klien daring. Para pendukungnya berpendapat sistem ini memberi kebebasan, karena pekerja bisa memilih kapan dan di mana mereka bekerja."],["However, critics point out that gig workers often lack job security. They usually do not receive paid holidays, sick pay, or a pension, and their income can change dramatically from one month to the next. As a result, some people feel anxious about the future, even if they enjoy the flexibility.","Namun, para pengkritik menunjukkan bahwa pekerja gig sering tidak memiliki jaminan kerja. Mereka biasanya tidak mendapat cuti berbayar, tunjangan sakit, atau pensiun, dan penghasilan mereka bisa berubah drastis dari satu bulan ke bulan berikutnya. Akibatnya, sebagian orang merasa cemas akan masa depan, meski mereka menikmati fleksibilitasnya."],["Governments are now trying to find a balance. Some countries are considering new rules that would give gig workers basic protection without removing their independence. Whether these changes will succeed remains to be seen, but the debate is likely to continue for years.","Pemerintah kini berusaha mencari keseimbangan. Beberapa negara mempertimbangkan aturan baru yang memberi pekerja gig perlindungan dasar tanpa menghilangkan kemandirian mereka. Apakah perubahan ini akan berhasil masih harus dilihat, tetapi perdebatannya kemungkinan akan berlanjut selama bertahun-tahun."]],kw:[["freedom","kebebasan"],["critics","pengkritik"],["security","keamanan; jaminan"],["income","penghasilan"],["balance","keseimbangan"]],q:[["Why do supporters like the gig economy?",["It offers freedom to choose when and where to work","It gives workers a pension","It guarantees a fixed income"],"It offers freedom to choose when and where to work","Paragraf 1 menyebut kebebasan memilih kapan dan di mana bekerja."],["Gig workers usually receive paid holidays.",["True","False"],"False","Paragraf 2 menyebut mereka biasanya tidak mendapat cuti berbayar."],["What problem do critics mention?",["Gig workers often lack job security","Gig workers earn too much","Gig jobs are too long"],"Gig workers often lack job security","Paragraf 2 menyebut kurangnya jaminan kerja."],["What are some governments trying to do?",["Give gig workers basic protection while keeping independence","Ban all gig jobs","Pay all gig workers the same"],"Give gig workers basic protection while keeping independence","Paragraf 3 menyebut aturan baru untuk perlindungan dasar tanpa menghilangkan kemandirian."]]},
{id:"b2-r2",t:"Cities of the Future",topic:"Technology",min:3,p:[["By 2050, about two thirds of the world’s population is expected to live in cities. This growth creates serious challenges, including traffic, pollution, and a shortage of affordable housing. To deal with these problems, many cities are turning to technology.","Pada 2050, sekitar dua pertiga penduduk dunia diperkirakan tinggal di kota. Pertumbuhan ini menimbulkan tantangan serius, termasuk kemacetan, polusi, dan kekurangan perumahan terjangkau. Untuk mengatasi masalah ini, banyak kota beralih ke teknologi."],["Smart cities use sensors to collect data about everything from air quality to energy use. For example, traffic lights can change automatically to reduce congestion, and street lamps can switch off when nobody is nearby. These measures not only save money but also reduce emissions.","Kota pintar memakai sensor untuk mengumpulkan data tentang segala hal, mulai dari kualitas udara sampai pemakaian energi. Misalnya, lampu lalu lintas dapat berganti otomatis untuk mengurangi kepadatan, dan lampu jalan dapat padam saat tidak ada orang di dekatnya. Langkah-langkah ini tidak hanya menghemat uang tetapi juga mengurangi emisi."],["Nevertheless, some people worry about privacy. If a city tracks the movement of its residents, who will have access to that information? Experts say that clear laws are essential, so that technology serves citizens instead of controlling them.","Meski begitu, sebagian orang mengkhawatirkan privasi. Jika kota melacak pergerakan penduduknya, siapa yang akan punya akses ke informasi itu? Para ahli mengatakan hukum yang jelas sangat penting, agar teknologi melayani warga dan bukan mengendalikan mereka."]],kw:[["shortage","kekurangan"],["sensors","sensor"],["congestion","kemacetan; kepadatan"],["emissions","emisi"],["residents","penduduk"]],q:[["What share of people is expected to live in cities by 2050?",["About two thirds","About one tenth","Exactly half"],"About two thirds","Paragraf 1 menyebut sekitar dua pertiga penduduk dunia."],["Smart traffic lights can reduce congestion.",["True","False"],"True","Paragraf 2 menyebut lampu lalu lintas bisa berganti otomatis untuk mengurangi kepadatan."],["How do sensors help cities?",["They collect data such as air quality and energy use","They build new houses","They replace all drivers"],"They collect data such as air quality and energy use","Paragraf 2 menyebut sensor mengumpulkan data kualitas udara dan pemakaian energi."],["What do experts say is essential?",["Clear laws about how data is used","Fewer sensors","Higher taxes"],"Clear laws about how data is used","Paragraf 3 menyebut hukum yang jelas sangat penting."]]},
{id:"b2-r3",t:"The Science of Habits",topic:"Daily Life",min:3,p:[["Psychologists estimate that around forty percent of our daily actions are not decisions but habits. We brush our teeth, check our phones, and take the same route to work without thinking. Habits save mental energy, which allows the brain to focus on more complicated tasks.","Psikolog memperkirakan sekitar empat puluh persen tindakan harian kita bukan keputusan, melainkan kebiasaan. Kita menyikat gigi, mengecek ponsel, dan mengambil rute yang sama ke tempat kerja tanpa berpikir. Kebiasaan menghemat energi mental, sehingga otak bisa fokus pada tugas yang lebih rumit."],["Every habit follows a simple loop: a cue triggers a routine, and the routine leads to a reward. For example, feeling stressed may trigger snacking, which gives temporary comfort. Because the reward feels good, the brain wants to repeat the loop, and the habit becomes stronger over time.","Setiap kebiasaan mengikuti lingkaran sederhana: sebuah pemicu mengaktifkan rutinitas, dan rutinitas itu menghasilkan hadiah. Misalnya, merasa stres bisa memicu ngemil, yang memberi kenyamanan sementara. Karena hadiahnya terasa menyenangkan, otak ingin mengulang lingkaran itu, dan kebiasaan itu makin kuat seiring waktu."],["Breaking a bad habit is difficult, but it is not impossible. Experts recommend replacing the routine rather than simply removing it. If you usually snack when you are stressed, you could go for a short walk instead. With patience and repetition, the new behavior can eventually become automatic.","Menghentikan kebiasaan buruk itu sulit, tetapi bukan mustahil. Para ahli menyarankan mengganti rutinitasnya, bukan sekadar menghilangkannya. Jika biasanya kamu ngemil saat stres, kamu bisa berjalan kaki sebentar sebagai gantinya. Dengan kesabaran dan pengulangan, perilaku baru itu akhirnya bisa menjadi otomatis."]],kw:[["psychologists","psikolog"],["trigger","memicu"],["reward","hadiah; imbalan"],["replacing","mengganti"],["automatic","otomatis"]],q:[["About how many of our daily actions are habits?",["Around forty percent","Around ten percent","Almost all of them"],"Around forty percent","Paragraf 1 menyebut sekitar empat puluh persen."],["What are the three parts of the habit loop?",["Cue, routine and reward","Goal, plan and test","Sleep, food and exercise"],"Cue, routine and reward","Paragraf 2 menjelaskan pemicu, rutinitas, dan hadiah."],["Why does a habit become stronger?",["The reward feels good, so the brain repeats the loop","Because it is difficult","Because other people see it"],"The reward feels good, so the brain repeats the loop","Paragraf 2 menyebut hadiah yang menyenangkan membuat otak mengulang lingkaran itu."],["Experts say the best way to break a bad habit is to simply remove the routine.",["True","False"],"False","Paragraf 3 menyarankan mengganti rutinitas, bukan sekadar menghilangkannya."]]},
{id:"b2-r4",t:"Studying Abroad",topic:"Education",min:3,p:[["Every year, thousands of students decide to spend a semester or even a whole year studying abroad. They hope to improve their language skills, experience a different culture, and make their CV more attractive to future employers.","Setiap tahun, ribuan mahasiswa memutuskan menghabiskan satu semester atau bahkan satu tahun penuh untuk kuliah di luar negeri. Mereka berharap meningkatkan kemampuan bahasa, merasakan budaya yang berbeda, dan membuat CV mereka lebih menarik bagi calon pemberi kerja."],["However, living in a foreign country is not always easy. Many students suffer from culture shock during the first weeks, feeling confused by unfamiliar customs and homesick for their families. Some also struggle with the cost of living, particularly in big cities.","Namun, tinggal di negara asing tidak selalu mudah. Banyak mahasiswa mengalami kejutan budaya pada minggu-minggu pertama, merasa bingung dengan kebiasaan yang asing dan rindu keluarga. Sebagian juga kesulitan dengan biaya hidup, terutama di kota besar."],["Those who adapt successfully usually describe the experience as life-changing. They become more independent, more confident, and more open-minded. Many also build friendships that last for decades, and some even decide to settle permanently in the country where they studied.","Mereka yang berhasil beradaptasi biasanya menggambarkan pengalaman itu mengubah hidup. Mereka menjadi lebih mandiri, lebih percaya diri, dan lebih berpikiran terbuka. Banyak juga yang membangun persahabatan yang bertahan puluhan tahun, dan sebagian bahkan memutuskan menetap di negara tempat mereka kuliah."]],kw:[["customs","kebiasaan; adat"],["homesick","rindu rumah"],["struggle","berjuang; kesulitan"],["independent","mandiri"],["permanently","secara tetap"]],q:[["Why do students study abroad?",["To improve language skills and gain experience","To avoid exams","To find a cheaper course only"],"To improve language skills and gain experience","Paragraf 1 menyebut meningkatkan kemampuan bahasa dan merasakan budaya baru."],["Culture shock usually happens during the first weeks.",["True","False"],"True","Paragraf 2 menyebut kejutan budaya pada minggu-minggu pertama."],["What difficulty is mentioned besides culture shock?",["The cost of living","The weather only","Too many holidays"],"The cost of living","Paragraf 2 menyebut biaya hidup, terutama di kota besar."],["What do successful students often become?",["More independent and more confident","Less open-minded","Less confident"],"More independent and more confident","Paragraf 3 menyebut mereka menjadi lebih mandiri dan percaya diri."]]}

{id:"a1-r1",t:"My Daily Routine",topic:"Daily Life",min:1,p:[["I get up at six o’clock. I wash my face and eat breakfast. I usually eat rice and an egg. Then I go to school by bus.","Saya bangun jam enam. Saya mencuci muka dan sarapan. Saya biasanya makan nasi dan telur. Lalu saya pergi ke sekolah naik bus."],["School starts at seven. I study English and math. My teacher is very kind. After school, I play football with my friends.","Sekolah mulai jam tujuh. Saya belajar bahasa Inggris dan matematika. Guru saya sangat baik. Setelah sekolah, saya bermain sepak bola dengan teman-teman."],["In the evening, I eat dinner with my family. I read a book for half an hour. I go to bed at ten o’clock.","Pada malam hari, saya makan malam bersama keluarga. Saya membaca buku selama setengah jam. Saya tidur jam sepuluh."]],kw:[["breakfast","sarapan"],["usually","biasanya"],["kind","baik hati"],["dinner","makan malam"],["evening","malam hari"]],q:[["What does the writer usually eat for breakfast?",["Rice and an egg","Bread and milk","Noodles"],"Rice and an egg","Paragraf 1 menyebut nasi dan telur."],["How does the writer go to school?",["By bus","By car","On foot"],"By bus","Paragraf 1 menyebut naik bus."],["School starts at seven.",["True","False"],"True","Paragraf 2 menyebut sekolah mulai jam tujuh."],["The writer goes to bed at nine o’clock.",["True","False"],"False","Paragraf 3 menyebut tidur jam sepuluh."]]},
{id:"a1-r2",t:"My Family",topic:"Relationships",min:1,p:[["I have a small family. There are four people in my family: my father, my mother, my sister, and me. We live in a house near the market.","Saya punya keluarga kecil. Ada empat orang di keluarga saya: ayah, ibu, kakak perempuan, dan saya. Kami tinggal di rumah dekat pasar."],["My father is a driver. He works hard every day. My mother is a nurse. She helps sick people at the hospital. My older sister is fifteen years old. She likes music.","Ayah saya seorang sopir. Dia bekerja keras setiap hari. Ibu saya seorang perawat. Dia membantu orang sakit di rumah sakit. Kakak perempuan saya berusia lima belas tahun. Dia suka musik."],["On Sundays, we do not work. We eat lunch together and watch television. I love my family very much.","Pada hari Minggu, kami tidak bekerja. Kami makan siang bersama dan menonton televisi. Saya sangat menyayangi keluarga saya."]],kw:[["family","keluarga"],["driver","sopir"],["nurse","perawat"],["hospital","rumah sakit"],["together","bersama"]],q:[["How many people are there in the family?",["Four","Three","Five"],"Four","Paragraf 1 menyebut ada empat orang."],["What does the writer’s father do?",["He is a driver","He is a nurse","He is a teacher"],"He is a driver","Paragraf 2 menyebut ayahnya seorang sopir."],["The mother helps sick people at the hospital.",["True","False"],"True","Paragraf 2 menyebut ibunya perawat yang membantu orang sakit."],["What does the family do on Sundays?",["They eat lunch together and watch television","They go to work","They study English"],"They eat lunch together and watch television","Paragraf 3 menyebut makan siang bersama dan menonton televisi."]]},
{id:"a1-r3",t:"At the Market",topic:"Shopping",min:1,p:[["Today is Saturday. My mother and I go to the market. The market is big and busy. There are many shops. We buy vegetables, fruit, and fish.","Hari ini hari Sabtu. Ibu saya dan saya pergi ke pasar. Pasarnya besar dan ramai. Ada banyak toko. Kami membeli sayuran, buah, dan ikan."],["The vegetables are fresh and cheap. A kilo of tomatoes is five thousand rupiah. My mother talks to the seller. He is friendly and gives us a small bag of chili for free.","Sayurannya segar dan murah. Satu kilo tomat harganya lima ribu rupiah. Ibu saya berbicara dengan penjualnya. Dia ramah dan memberi kami sekantong kecil cabai gratis."],["After shopping, we go home by motorbike. We cook lunch together. I like going to the market with my mother.","Setelah berbelanja, kami pulang naik sepeda motor. Kami memasak makan siang bersama. Saya suka pergi ke pasar bersama ibu saya."]],kw:[["market","pasar"],["vegetables","sayuran"],["fresh","segar"],["seller","penjual"],["friendly","ramah"]],q:[["When do they go to the market?",["On Saturday","On Monday","On Sunday"],"On Saturday","Paragraf 1 menyebut hari Sabtu."],["What do they buy?",["Vegetables, fruit and fish","Shoes and bags","Books and pens"],"Vegetables, fruit and fish","Paragraf 1 menyebut sayuran, buah, dan ikan."],["The vegetables are expensive.",["True","False"],"False","Paragraf 2 menyebut sayurannya segar dan murah."],["How do they go home?",["By motorbike","By bus","On foot"],"By motorbike","Paragraf 3 menyebut pulang naik sepeda motor."]]},
{id:"a1-r4",t:"My Best Friend",topic:"Relationships",min:1,p:[["My best friend is Dina. She is fourteen years old. She has long black hair and a big smile. We are in the same class at school.","Sahabat saya adalah Dina. Dia berumur empat belas tahun. Dia berambut hitam panjang dan senyumnya lebar. Kami satu kelas di sekolah."],["Dina is funny and kind. She likes music and drawing. She can play the guitar very well. On weekends, we go to the park and talk for hours.","Dina lucu dan baik hati. Dia suka musik dan menggambar. Dia bisa bermain gitar dengan sangat baik. Pada akhir pekan, kami pergi ke taman dan mengobrol berjam-jam."],["Dina is always there when I need help. I am lucky to have a friend like her.","Dina selalu ada saat saya butuh bantuan. Saya beruntung punya teman seperti dia."]],kw:[["funny","lucu"],["drawing","menggambar"],["weekends","akhir pekan"],["park","taman"],["lucky","beruntung"]],q:[["How old is Dina?",["Fourteen","Fifteen","Twelve"],"Fourteen","Paragraf 1 menyebut empat belas tahun."],["What can Dina play?",["The guitar","The piano","Football"],"The guitar","Paragraf 2 menyebut Dina bisa bermain gitar."],["They go to the park on weekends.",["True","False"],"True","Paragraf 2 menyebut mereka pergi ke taman pada akhir pekan."],["Why is the writer lucky?",["Dina is always there to help","Dina has a lot of money","Dina is tall"],"Dina is always there to help","Paragraf 3 menyebut Dina selalu ada saat dibutuhkan."]]},
{id:"a1-r5",t:"My Room",topic:"Daily Life",min:1,p:[["This is my room. It is small, but it is clean. There is a bed next to the window. There is a desk and a chair near the door.","Ini kamar saya. Kamarnya kecil, tetapi bersih. Ada tempat tidur di sebelah jendela. Ada meja dan kursi dekat pintu."],["On the desk, there is a lamp, a laptop, and some books. My phone is on the bed. There are two pictures on the wall. They are photos of my family.","Di atas meja, ada lampu, laptop, dan beberapa buku. Ponsel saya ada di atas tempat tidur. Ada dua gambar di dinding. Itu foto keluarga saya."],["I study and sleep in this room. I like it very much. It is my favorite place in the house.","Saya belajar dan tidur di kamar ini. Saya sangat menyukainya. Ini tempat favorit saya di rumah."]],kw:[["room","kamar"],["window","jendela"],["lamp","lampu"],["wall","dinding"],["favorite","favorit"]],q:[["Is the room big?",["No, it is small","Yes, it is very big","It is not clean"],"No, it is small","Paragraf 1 menyebut kamarnya kecil tetapi bersih."],["Where is the bed?",["Next to the window","Under the desk","Near the door"],"Next to the window","Paragraf 1 menyebut tempat tidur di sebelah jendela."],["There are three pictures on the wall.",["True","False"],"False","Paragraf 2 menyebut ada dua gambar."],["What is the writer’s favorite place in the house?",["The room","The kitchen","The garden"],"The room","Paragraf 3 menyebut kamar itu tempat favoritnya."]]},
{id:"a1-r6",t:"A Rainy Day",topic:"Environment",min:1,p:[["It is a rainy Sunday. The sky is grey and the wind is cold. I do not go out. I stay at home with my brother.","Hari Minggu ini hujan. Langit berwarna abu-abu dan anginnya dingin. Saya tidak keluar rumah. Saya tinggal di rumah bersama saudara laki-laki saya."],["We play games and watch a film. My mother makes hot tea and fried bananas. The tea is sweet and the bananas are very good.","Kami bermain gim dan menonton film. Ibu saya membuat teh hangat dan pisang goreng. Tehnya manis dan pisang gorengnya sangat enak."],["In the evening, the rain stops. The sun comes out and there is a rainbow in the sky. We go outside and look at it together.","Pada sore hari, hujan berhenti. Matahari muncul dan ada pelangi di langit. Kami keluar dan melihatnya bersama-sama."]],kw:[["rainy","hujan; berhujan"],["wind","angin"],["tea","teh"],["rainbow","pelangi"],["together","bersama-sama"]],q:[["What is the weather like in the morning?",["Rainy and cold","Hot and sunny","Windy and dry"],"Rainy and cold","Paragraf 1 menyebut hari hujan dengan angin dingin."],["What does the mother make?",["Hot tea and fried bananas","Fried rice and eggs","Soup and bread"],"Hot tea and fried bananas","Paragraf 2 menyebut teh hangat dan pisang goreng."],["The family goes to school in the rain.",["True","False"],"False","Paragraf 1 menyebut mereka tinggal di rumah."],["What is in the sky in the evening?",["A rainbow","A plane","A kite"],"A rainbow","Paragraf 3 menyebut ada pelangi di langit."]]}

{id:"a2-r1",t:"A Weekend in Bali",topic:"Travel",min:2,p:[["Last weekend, my family and I visited Bali. We left Jakarta on Friday evening and arrived at the hotel at night. The room was clean and the beds were comfortable.","Akhir pekan lalu, keluarga saya dan saya mengunjungi Bali. Kami berangkat dari Jakarta pada Jumat sore dan tiba di hotel pada malam hari. Kamarnya bersih dan tempat tidurnya nyaman."],["On Saturday, we went to the beach and swam in the sea. The weather was hot and sunny. In the afternoon, we ate fresh fish and drank coconut water. Later, we bought some gifts for our friends.","Pada hari Sabtu, kami pergi ke pantai dan berenang di laut. Cuacanya panas dan cerah. Pada sore hari, kami makan ikan segar dan minum air kelapa. Setelah itu, kami membeli oleh-oleh untuk teman-teman."],["On Sunday, we visited an old temple. It was very beautiful. We took many photos. We were tired when we came home, but we were also very happy.","Pada hari Minggu, kami mengunjungi sebuah pura tua. Pura itu sangat indah. Kami mengambil banyak foto. Kami lelah saat pulang, tetapi kami juga sangat senang."]],kw:[["arrived","tiba"],["comfortable","nyaman"],["swam","berenang (lampau)"],["temple","pura; kuil"],["gifts","oleh-oleh; hadiah"]],q:[["When did they leave Jakarta?",["On Friday evening","On Saturday morning","On Sunday"],"On Friday evening","Paragraf 1 menyebut mereka berangkat pada Jumat sore."],["What was the weather like on Saturday?",["Hot and sunny","Cold and rainy","Windy"],"Hot and sunny","Paragraf 2 menyebut cuacanya panas dan cerah."],["They visited a temple on Sunday.",["True","False"],"True","Paragraf 3 menyebut mereka mengunjungi pura tua."],["How did they feel when they came home?",["Tired but happy","Sad and angry","Bored"],"Tired but happy","Paragraf 3 menyebut mereka lelah tetapi senang."]]},
{id:"a2-r2",t:"A Visit to the Doctor",topic:"Health",min:2,p:[["Last Monday, I felt sick. I had a fever and a bad cough. My head hurt too. I did not go to work, and I stayed in bed all morning.","Senin lalu, saya merasa sakit. Saya demam dan batuk parah. Kepala saya juga sakit. Saya tidak pergi bekerja, dan saya berbaring di tempat tidur sepanjang pagi."],["In the afternoon, my sister took me to the doctor. The doctor looked at my throat and checked my temperature. She said I had the flu. She gave me some medicine and told me to rest.","Pada sore hari, kakak saya mengantar saya ke dokter. Dokter memeriksa tenggorokan saya dan mengukur suhu badan saya. Dia bilang saya terkena flu. Dia memberi saya obat dan menyuruh saya istirahat."],["I took the medicine and drank a lot of water. After three days, I felt much better. Now I know that rest is important when you are sick.","Saya minum obat itu dan banyak minum air. Setelah tiga hari, saya merasa jauh lebih baik. Sekarang saya tahu bahwa istirahat itu penting saat kita sakit."]],kw:[["fever","demam"],["cough","batuk"],["throat","tenggorokan"],["flu","flu"],["rest","istirahat"]],q:[["What symptoms did the writer have?",["A fever and a bad cough","A broken leg","A toothache"],"A fever and a bad cough","Paragraf 1 menyebut demam dan batuk parah."],["Who took the writer to the doctor?",["The writer’s sister","The writer’s mother","A friend"],"The writer’s sister","Paragraf 2 menyebut kakaknya yang mengantar."],["The doctor said the writer had the flu.",["True","False"],"True","Paragraf 2 menyebut dokter berkata penulis terkena flu."],["How long did it take to feel better?",["Three days","One month","One hour"],"Three days","Paragraf 3 menyebut setelah tiga hari merasa lebih baik."]]},
{id:"a2-r3",t:"My New Phone",topic:"Technology",min:2,p:[["Last week, I bought a new phone. My old phone was very slow, and the battery was always empty. The new one is faster and the camera is much better.","Minggu lalu, saya membeli ponsel baru. Ponsel lama saya sangat lambat, dan baterainya selalu habis. Yang baru lebih cepat dan kameranya jauh lebih bagus."],["The phone was not cheap, but it was on sale. I paid two million rupiah. The shop assistant was very helpful. She showed me how to download apps and send messages.","Ponselnya tidak murah, tetapi sedang diobral. Saya membayar dua juta rupiah. Pegawai tokonya sangat membantu. Dia menunjukkan cara mengunduh aplikasi dan mengirim pesan."],["Now I use my phone every day. I take photos, listen to music, and talk to my friends. But my mother says I look at it too much. Maybe she is right!","Sekarang saya memakai ponsel saya setiap hari. Saya memotret, mendengarkan musik, dan berbicara dengan teman-teman. Tetapi ibu saya bilang saya terlalu sering melihatnya. Mungkin dia benar!"]],kw:[["battery","baterai"],["camera","kamera"],["sale","obral"],["helpful","membantu"],["download","mengunduh"]],q:[["Why did the writer buy a new phone?",["The old phone was slow and the battery was always empty","The old phone was lost","A friend gave a gift"],"The old phone was slow and the battery was always empty","Paragraf 1 menyebut ponsel lama lambat dan baterainya selalu habis."],["The phone was on sale.",["True","False"],"True","Paragraf 2 menyebut ponselnya sedang diobral."],["How much did the writer pay?",["Two million rupiah","Five million rupiah","One million rupiah"],"Two million rupiah","Paragraf 2 menyebut dua juta rupiah."],["What does the writer’s mother say?",["The writer looks at the phone too much","The phone is too cheap","The phone is too big"],"The writer looks at the phone too much","Paragraf 3 menyebut ibunya bilang penulis terlalu sering melihat ponsel."]]},
{id:"a2-r4",t:"Cooking with Grandma",topic:"Food & Dining",min:2,p:[["Every Sunday, I visit my grandmother. She lives in a small house with a big garden. We always cook lunch together. Today, we are making fried rice.","Setiap hari Minggu, saya mengunjungi nenek saya. Dia tinggal di rumah kecil dengan kebun yang besar. Kami selalu memasak makan siang bersama. Hari ini, kami membuat nasi goreng."],["First, my grandmother cuts the vegetables. I wash the rice and fry two eggs. Then she adds garlic, chili, and a little sugar. The kitchen smells wonderful.","Pertama, nenek saya memotong sayuran. Saya mencuci nasi dan menggoreng dua telur. Lalu dia menambahkan bawang putih, cabai, dan sedikit gula. Dapurnya berbau sedap sekali."],["When the food is ready, we sit in the garden and eat. My grandmother says that cooking is a way to show love. I think she is right, because her food always makes me happy.","Saat makanannya siap, kami duduk di kebun dan makan. Nenek saya bilang bahwa memasak adalah cara menunjukkan kasih sayang. Saya rasa dia benar, karena masakannya selalu membuat saya bahagia."]],kw:[["grandmother","nenek"],["garden","kebun"],["vegetables","sayuran"],["garlic","bawang putih"],["sugar","gula"]],q:[["When does the writer visit the grandmother?",["Every Sunday","Every Friday","Every day"],"Every Sunday","Paragraf 1 menyebut setiap hari Minggu."],["What are they cooking today?",["Fried rice","Chicken soup","Noodles"],"Fried rice","Paragraf 1 menyebut nasi goreng."],["The grandmother adds garlic, chili and a little sugar.",["True","False"],"True","Paragraf 2 menyebut bawang putih, cabai, dan sedikit gula."],["What does the grandmother say about cooking?",["It is a way to show love","It is a hard job","It is boring"],"It is a way to show love","Paragraf 3 menyebut memasak adalah cara menunjukkan kasih sayang."]]},
{id:"a2-r5",t:"My First Day at a New School",topic:"Education",min:2,p:[["Last Monday was my first day at a new school. I woke up early because I was nervous. My mother made breakfast, and my father drove me to school. When I arrived, I felt very small in the big building.","Senin lalu adalah hari pertama saya di sekolah baru. Saya bangun pagi karena gugup. Ibu saya membuat sarapan, dan ayah saya mengantar saya ke sekolah. Saat tiba, saya merasa sangat kecil di gedung yang besar itu."],["A teacher named Mrs. Sari showed me my classroom. The other students were friendly. A girl called Lina invited me to sit next to her. During the break, we ate lunch together and talked about music and sports.","Seorang guru bernama Bu Sari menunjukkan kelas saya. Siswa-siswa lain ramah. Seorang gadis bernama Lina mengajak saya duduk di sebelahnya. Saat istirahat, kami makan siang bersama dan berbicara tentang musik dan olahraga."],["In the afternoon, we had a difficult math test, but I tried my best. When I went home, I was tired but happy. I think I am going to like my new school.","Pada sore hari, kami mengikuti tes matematika yang sulit, tetapi saya berusaha sebaik mungkin. Saat pulang, saya lelah tetapi senang. Saya rasa saya akan menyukai sekolah baru saya."]],kw:[["nervous","gugup"],["classroom","ruang kelas"],["invited","mengundang (lampau)"],["break","istirahat"],["tried","mencoba (lampau)"]],q:[["Why did the writer wake up early?",["The writer was nervous","School started at five","There was a lot of noise"],"The writer was nervous","Paragraf 1 menyebut penulis gugup, jadi bangun lebih pagi."],["Who drove the writer to school?",["The father","The mother","A teacher"],"The father","Paragraf 1 menyebut ayahnya yang mengantar."],["Lina invited the writer to sit next to her.",["True","False"],"True","Paragraf 2 menyebut Lina mengajak penulis duduk di sebelahnya."],["How did the writer feel when going home?",["Tired but happy","Angry","Bored"],"Tired but happy","Paragraf 3 menyebut lelah tetapi senang."]]},
{id:"a2-r6",t:"Shopping for a Birthday Gift",topic:"Shopping",min:2,p:[["Next week is my brother’s birthday, so I went shopping yesterday. I wanted to buy a nice gift, but I did not have much money. I visited three shops in the mall and looked at many things.","Minggu depan adalah ulang tahun saudara laki-laki saya, jadi kemarin saya pergi berbelanja. Saya ingin membeli hadiah yang bagus, tetapi saya tidak punya banyak uang. Saya mengunjungi tiga toko di mal dan melihat banyak barang."],["First, I saw a leather wallet, but it was too expensive. Then I found a cheap watch, but it was ugly. Finally, in a small bookshop, I bought a book about football. It was on sale, so I paid only forty thousand rupiah.","Pertama, saya melihat dompet kulit, tetapi terlalu mahal. Lalu saya menemukan jam tangan murah, tetapi jelek. Akhirnya, di toko buku kecil, saya membeli buku tentang sepak bola. Buku itu sedang diobral, jadi saya hanya membayar empat puluh ribu rupiah."],["The cashier wrapped the gift for me. I think my brother will love it because he is crazy about football. I hope he likes my present!","Kasirnya membungkus hadiah itu untuk saya. Saya rasa saudara saya akan menyukainya karena dia sangat gila sepak bola. Semoga dia suka hadiahku!"]],kw:[["wallet","dompet"],["expensive","mahal"],["cheap","murah"],["wrapped","membungkus (lampau)"],["present","hadiah"]],q:[["Why did the writer go shopping?",["To buy a birthday gift","To buy shoes","To meet a friend"],"To buy a birthday gift","Paragraf 1 menyebut ulang tahun saudara laki-lakinya."],["The leather wallet was cheap.",["True","False"],"False","Paragraf 2 menyebut dompet kulit itu terlalu mahal."],["What did the writer buy?",["A book about football","A watch","A wallet"],"A book about football","Paragraf 2 menyebut buku tentang sepak bola."],["How much did the writer pay?",["Forty thousand rupiah","Four hundred thousand rupiah","Ten thousand rupiah"],"Forty thousand rupiah","Paragraf 2 menyebut empat puluh ribu rupiah."]]},
{id:"a2-r7",t:"A Healthy Routine",topic:"Health",min:2,p:[["Last month, my doctor told me to change my lifestyle. I was often tired, and I did not exercise at all. So I decided to start a healthy routine. Now I get up at six every day and walk for thirty minutes in the park.","Bulan lalu, dokter saya menyuruh saya mengubah gaya hidup. Saya sering lelah, dan saya sama sekali tidak berolahraga. Jadi saya memutuskan memulai rutinitas sehat. Sekarang saya bangun jam enam setiap hari dan berjalan kaki tiga puluh menit di taman."],["I also changed my diet. I eat more vegetables and fruit, and I drink a lot of water. I do not eat fast food or sweets very often. At first it was difficult because I loved fried chicken, but now I feel much better.","Saya juga mengubah pola makan. Saya makan lebih banyak sayur dan buah, dan banyak minum air. Saya tidak terlalu sering makan makanan cepat saji atau manis. Awalnya sulit karena saya suka ayam goreng, tetapi sekarang saya merasa jauh lebih baik."],["Sleep is important too. I go to bed at ten o’clock and I do not use my phone before sleeping. After one month, I have more energy and I can work better. My doctor says that I should continue these habits.","Tidur juga penting. Saya tidur jam sepuluh dan tidak memakai ponsel sebelum tidur. Setelah satu bulan, saya lebih bertenaga dan bisa bekerja lebih baik. Dokter saya bilang saya sebaiknya melanjutkan kebiasaan ini."]],kw:[["lifestyle","gaya hidup"],["exercise","berolahraga"],["routine","rutinitas"],["diet","pola makan"],["energy","tenaga"]],q:[["Why did the writer start a healthy routine?",["The doctor told the writer to change","A friend gave a gift","The writer lost a job"],"The doctor told the writer to change","Paragraf 1 menyebut dokter menyuruh mengubah gaya hidup."],["What does the writer do every morning?",["Walks for thirty minutes in the park","Plays football","Swims in the sea"],"Walks for thirty minutes in the park","Paragraf 1 menyebut berjalan kaki tiga puluh menit di taman."],["The writer eats fast food very often now.",["True","False"],"False","Paragraf 2 menyebut tidak terlalu sering makan makanan cepat saji."],["What does the doctor say?",["The writer should continue the habits","The writer should stop exercising","The writer should eat more sweets"],"The writer should continue the habits","Paragraf 3 menyebut dokter menyarankan melanjutkan kebiasaan itu."]]},
{id:"a2-r8",t:"A Day at the Zoo",topic:"Environment",min:2,p:[["On Sunday, my family went to the zoo. It was a sunny day, so there were many visitors. We bought tickets at the gate and took a map. My little sister was very excited because she wanted to see the elephants.","Pada hari Minggu, keluarga saya pergi ke kebun binatang. Hari itu cerah, jadi ada banyak pengunjung. Kami membeli tiket di gerbang dan mengambil peta. Adik perempuan saya sangat bersemangat karena ingin melihat gajah."],["First, we saw the monkeys. They were jumping from tree to tree and making funny noises. Then we visited the elephants. They were enormous! A zookeeper was giving them bananas and water. After that, we had lunch near the lake.","Pertama, kami melihat monyet. Mereka melompat dari pohon ke pohon dan membuat suara lucu. Lalu kami mengunjungi gajah. Gajah-gajah itu sangat besar! Seorang penjaga kebun binatang sedang memberi mereka pisang dan air. Setelah itu, kami makan siang di dekat danau."],["In the afternoon, we watched a short show about birds. I learned that many animals are in danger because people destroy their homes. We must protect nature. Before we left, we bought a small gift for our grandmother.","Pada sore hari, kami menonton pertunjukan singkat tentang burung. Saya belajar bahwa banyak hewan terancam karena manusia merusak rumah mereka. Kita harus melindungi alam. Sebelum pulang, kami membeli hadiah kecil untuk nenek kami."]],kw:[["visitors","pengunjung"],["excited","bersemangat"],["enormous","sangat besar"],["zookeeper","penjaga kebun binatang"],["protect","melindungi"]],q:[["Why were there many visitors?",["It was a sunny day","It was free","It was a holiday for animals"],"It was a sunny day","Paragraf 1 menyebut hari itu cerah, jadi banyak pengunjung."],["What did the little sister want to see?",["The elephants","The birds","The monkeys"],"The elephants","Paragraf 1 menyebut dia ingin melihat gajah."],["The monkeys were sleeping.",["True","False"],"False","Paragraf 2 menyebut monyet sedang melompat dari pohon ke pohon."],["What did the writer learn from the bird show?",["Many animals are in danger because people destroy their homes","Birds cannot fly","Zoos are closed on Sundays"],"Many animals are in danger because people destroy their homes","Paragraf 3 menyebut banyak hewan terancam karena rumah mereka dirusak."]]}

function kState(){
 if(!S.knowlyPath||typeof S.knowlyPath!=='object')S.knowlyPath={placed:false,start:null,passed:[],exams:{}};
 const k=S.knowlyPath;
 if(!Array.isArray(k.passed))k.passed=[];

function kExamReady(){
 const lv=S.p.level, ws=words(),g=G[lv]||[],r=RD[lv]||[],li=KLIST_DATA[lv]||[];
 const wdone=ws.filter(w=>(S.wp[w.id]||{}).s==='mastered').length;
 const gdone=g.filter(l=>(S.gl||{})[l.id]?.s==='done').length;
 const rdone=r.filter(x=>(S.rd||{})[x.id]?.s==='done').length;
 const ldone=Object.values((S.listening||{})[lv]||{}).filter(x=>x&&((x.best||0)>=1||x.done||x.correct)).length;
 const ready=ws.length>0&&g.length>=5&&r.length>=3&&li.length>=3&&wdone>=Math.ceil(ws.length*.3)&&gdone>=Math.ceil(g.length*.7)&&rdone>=Math.ceil(r.length*.5)&&ldone>=Math.ceil(li.length*.5);
 return {lv,w:wdone,wt:ws.length,g:gdone,gt:g.length,r:rdone,rt:r.length,l:ldone,lt:li.length,ready};
}
function kQuestion(l,level){
 const qs=(l.q||[]).filter(q=>Array.isArray(q[1])&&q[1].length>=3&&q[1].includes(q[2]));
 if(!qs.length)return null;
 const q=qs[Math.floor(Math.random()*qs.length)];
 return {level,topic:l.t,prompt:q[0],opts:shuffle(q[1]),answer:q[2],explain:q[3]||''};
}
function kPool(level,count){
 const lessons=shuffle(G[level]||[]),qs=[];
 for(const l of lessons){const q=kQuestion(l,level);if(q)qs.push(q);if(qs.length===count)break;}
 return qs;
}
function kStartPlacement(){
 KTEST={stage:0,index:0,answers:[],questions:kPool('A1',4),passed:[]};
 if(KTEST.questions.length<4)throw Error('Placement questions unavailable');

}
function kStartExam(){
 document.getElementById('knowly-overlay')?.removeAttribute('data-result');const ready=kExamReady();if((!KDEV&&!ready.ready)||!kAvailable(ready.lv))return;
 const lv=ready.lv,qs=[],grammar=kPool(lv,5);
 grammar.forEach(q=>qs.push({...q,section:'Grammar'}));
 const vv=shuffle((D[lv]||{}).v||[]).slice(0,5);
 const all=(D[lv]||{}).v||[];
 vv.forEach(v=>{const wrong=shuffle(all.filter(x=>x[0]!==v[0]&&x[3]!==v[3])).slice(0,3).map(x=>x[3]);if(wrong.length===3)qs.push({level:lv,topic:'Vocabulary',section:'Vocabulary',prompt:'What is the meaning of “'+v[0]+'”?',opts:shuffle([v[3],...wrong]),answer:v[3],explain:'Vocabulary: '+v[0]+' — '+v[3]});});
 const passages=shuffle(RD[lv]||[]).slice(0,5);
 passages.forEach(p=>{const q=(p.q||[]).find(x=>Array.isArray(x[1])&&x[1].includes(x[2]));if(q)qs.push({level:lv,topic:p.t,section:'Reading',passage:(p.p||[]).map(x=>x[0]).join(' '),prompt:q[0],opts:shuffle(q[1]),answer:q[2],explain:q[3]||''});});
 const listens=shuffle(KLIST_DATA[lv]||[]).filter(x=>Array.isArray(x.options)&&Number.isInteger(x.answer)).slice(0,5);
 listens.forEach(q=>qs.push({level:lv,topic:q.topic,section:'Listening',audio:kListText(q),prompt:q.question,opts:shuffle(q.options),answer:q.options[q.answer],explain:q.explain||''}));
 if(qs.length<16){alert('Not enough exam questions for '+lv);return;}
 KEXAM={questions:qs,index:0,answers:[],started:Date.now()};kShow();
}

}

}
function kExamHtml(){

}
function kPathHtml(){

function kShow(){

 k.exams[lv]={score:percent,best:Math.max(prev.best||0,percent),date:new Date().toISOString(),passed:!!prev.passed||percent>=80,breakdown};

ivate cars."],"Poor access and inadequate maintenance.","Rujuk isi teks untuk menemukan bukti."]]},{"id":"c1-r3","t":"Technology and Trust","topic":"Critical Reading","min":3,"p":[["Automated systems can improve efficiency, but their decisions are not necessarily neutral. Training data may reproduce existing inequalities. Transparent explanations and independent oversight are therefore essential when such systems influence important opportunities.","Ringkasan: teks membahas penilaian kritis terhadap suatu persoalan."]],"kw":[],"q":[["What is the central recommendation?",["Remove all automated systems.","Use transparency and independent oversight.","Keep decisions secret."],"Use transparency and independent oversight.","Jawaban didukung oleh gagasan utama teks."],["What is the central recommendation?",["Remove all automated systems.","Use transparency and independent oversight.","Keep decisions secret."],"Use transparency and independent oversight.","Rujuk isi teks untuk menemukan bukti."],["What is the central recommendation?",["Remove all automated systems.","Use transparency and independent oversight.","Keep decisions secret."],"Use transparency and independent oversight.","Rujuk isi teks untuk menemukan bukti."],["What is the central recommendation?",["Remove all automated systems.","Use transparency and independent oversight.","Keep decisions secret."],"Use transparency and independent oversight.","Rujuk isi teks untuk menemukan bukti."]]}],"C2":[{"id":"c2-r1","t":"The Limits of Certainty","topic":"Critical Reading","min":3,"p":[["Public debate often rewards categorical claims, whereas rigorous inquiry demands an appreciation of uncertainty. A proposition can be well supported without being beyond revision. Indeed, the willingness to modify a position when stronger evidence emerges is a hallmark of intellectual integrity.","Ringkasan: teks membahas penilaian kritis terhadap suatu persoalan."]],"kw":[],"q":[["What does the author regard as intellectual integrity? uses the term 'watershed' in a discussion of evidence and interpretation.","Laporan menggunakan istilah 'watershed' dalam pembahasan bukti dan interpretasi.","Advanced vocabulary","hard"]]},"reading":{"C1":[{"id":"c1-r4","t":"The Economics of Attention","topic":"Advanced Reading","min":4,"p":[["In an environment saturated with information, attention has become a scarce resource. Platforms compete not simply to inform users but to keep them engaged. This creates an incentive to promote material that triggers immediate reactions, even when more measured analysis would be useful. Policymakers consequently face a dilemma: protecting free expression while reducing manipulative design. Neither unrestricted engagement nor sweeping censorship offers an adequate solution.","Read the passage critically and identify the central claim."]],"kw":[],"q":[["What incentive can encourage sensational material?",["Keeping users engaged","Reducing internet access","Eliminating advertising entirely"],"Keeping users engaged","The passage directly supports this interpretation."]]},{"id":"c1-r5","t":"Food Systems and Resilience","topic":"Advanced Reading","min":4,"p":[["Global supply chains can deliver affordable food across enormous distances. Yet efficiency sometimes comes at the expense of resilience. A system dependent on a handful of suppliers may struggle when extreme weather or political conflict interrupts trade. Diversification, local capacity and transparent reserves can reduce vulnerability, although each involves costs that must be weighed against potential benefits.","Read the passage critically and identify the central claim."]],"kw":[],"q":[["What makes a food system vulnerable?",["Dependence on a small number of suppliers","Having several independent suppliers","Keeping transparent reserves"],"Dependence on a small number of suppliers","The passage directly supports this interpretation."]]},{"id":"c1-r6","t":"Education Beyond Examinations","topic":"Advanced Reading","min":4,"p":[["Standardised examinations provide a convenient way to compare achievement, but they measure only selected dimensions of learning. Skills such as collaboration, intellectual curiosity and sustained inquiry are harder to capture in timed assessments. Abandoning examinations altogether, however, could introduce inconsistency. A balanced approach combines reliable tests with meaningful projects and feedback.","Read the passage critically and identify the central claim."]],"kw":[],"q":[["What solution does the author support?",["Removing all assessment","Combining tests with projects and feedback","Using timed tests exclusively"],"Combining tests with projects and feedback","The passage directly supports this interpretation."]]},{"id":"c1-r7","t":"The Future of Public Transport","topic":"Advanced Reading","min":4,"p":[["Expanding rail and bus networks is frequently presented as a straightforward environmental intervention. In practice, ridership depends on reliability, safety, cost and connections between services. A new line that does not reach employment centres may attract fewer passengers than expected. Transport policy therefore requires attention to everyday travel patterns rather than infrastructure alone.","Read the passage critically and identify the central claim."]],"kw":[],"q":[["Why might a new transit line attract few passengers?",["It may not connect useful destinations","It uses modern trains","It has a published timetable"],"It may not connect useful destinations","The passage directly supports this interpretation."]]},{"id":"c1-r8","t":"Scientific Replication","topic":"Advanced Reading","min":4,"p":[["A scientific result becomes more persuasive when independent researchers can reproduce it. Failed replication does not automatically imply dishonesty; differences in methods, populations or random variation may explain the outcome. Nonetheless, transparent data and clearly documented procedures allow disagreements to be investigated rather than merely asserted. Replication is thus part of scientific self-correction.","Read the passage critically and identify the central claim."]],"kw":[],"q":[["What is the main role of replication?",["Guaranteeing every result is true","Testing the reliability of findings","Replacing original research"],"Testing the reliability of findings","The passage directly supports this interpretation."]]}],"C2":[{"id":"c2-r4","t":"The Paradox of Transparency","topic":"Advanced Reading","min":4,"p":[["Transparency is often treated as an unqualified public good. Yet the indiscriminate publication of information can obscure rather than illuminate: an overwhelming volume of poorly organised data may render scrutiny practically impossible. Genuine accountability requires intelligibility, context and mechanisms through which disclosures can be challenged. In this sense, transparency is not an endpoint but a condition whose value depends on institutional design.","Read the passage critically and identify the central claim."]],"kw":[],"q":[["Why can publishing more data fail to improve accountability?",["Information may be inaccessible in practice","All public data is misleading","Context always reduces transparency"],"Information may be inaccessible in practice","The passage directly supports this interpretation."]]},{"id":"c2-r5","t":"The Politics of Measurement","topic":"Advanced Reading","min":4,"p":[["Indicators transform complex realities into comparable figures, enabling institutions to allocate resources and evaluate progress. Their apparent precision, however, can conceal normative choices about what deserves to be counted. When an indicator becomes a target, behaviour may adapt to improve the metric without improving the underlying condition. Critical evaluation therefore asks not only whether a measure is accurate but what incentives it creates.","Read the passage critically and identify the central claim."]],"kw":[],"q":[["What problem arises when a metric becomes a target?",["People may optimise the number rather than the underlying goal","Measurement becomes mathematically impossible","All institutions stop collecting data"],"People may optimise the number rather than the underlying goal","The passage directly supports this interpretation."]]},{"id":"c2-r6","t":"Memory and Collective Identity","topic":"Advanced Reading","min":4,"p":[["Communities often narrate their past through commemorations, monuments and shared stories. Such practices can foster solidarity, but they also select which experiences deserve prominence. A historical narrative that appears cohesive may rest on exclusions that remain invisible to those it represents. Reconsidering inherited accounts need not entail rejecting communal identity; it can instead make that identity more capacious and self-aware.","Read the passage critically and identify the central claim."]],"kw":[],"q":[["What does the author suggest about revising historical narratives?",["It necessarily destroys solidarity","It can broaden collective identity","It eliminates all disagreement"],"It can broaden collective identity","The passage directly supports this interpretation."]]},{"id":"c2-r7","t":"The Ambivalence of Innovation","topic":"Advanced Reading","min":4,"p":[["Innovation is commonly equated with progress, as though novelty were sufficient evidence of improvement. Yet technologies redistribute benefits and burdens in ways that are not immediately apparent. An efficient tool may save time for one group while imposing new obligations on another. Assessing innovation responsibly therefore requires examining who gains, who bears the costs and which alternatives were overlooked.","Read the passage critically and identify the central claim."]],"kw":[],"q":[["What is the author's criticism of equating innovation with progress?",["Novelty does not guarantee fair or beneficial outcomes","Innovation never improves efficiency","New technologies have no social effects"],"Novelty does not guarantee fair or beneficial outcomes","The passage directly supports this interpretation."]]},{"id":"c2-r8","t":"The Value of Disagreement","topic":"Advanced Reading","min":4,"p":[["Consensus can facilitate collective action, but premature agreement may suppress uncertainties that deserve examination. Productive disagreement differs from reflexive opposition: it demands reasons, a willingness to revise one's position and an effort to represent competing arguments fairly. Institutions that protect such exchange may reach decisions more slowly, yet they can also become more resilient to error.","Read the passage critically and identify the central claim."]],"kw":[],"q":[["What distinguishes productive disagreement?",["Constant refusal to compromise","Reasoned engagement and openness to revision","Avoiding opposing arguments"],"Reasoned engagement and openness to revision","The passage directly supports this interpretation."]]}]}};

function art(section,title,level){
 const h=hash(title),palette=['#b8d7ff','#d9c6ff','#bfece5','#ffe3c3','#f7cfe6','#c7dcff'];
 const bg=palette[h%palette.length],emoji=scenes[section]||scenes.reading,sign=emoji[h%emoji.length];
 return `<div class="zeli-art zeli-lesson-character" role="group" aria-label="ZELI ${esc(S.p.level)} accompanying ${esc(title)}" style="--zeli-lesson-bg:${bg}">
 <div class="zeli-lesson-figure">${zeli(S.p.level)}</div>
 <div class="zeli-lesson-info"><span class="zeli-lesson-symbol" aria-hidden="true">${sign}</span><span class="zeli-lesson-label">${esc(section.toUpperCase())}</span><strong>ZELI · ${esc(S.p.level)}</strong><span class="zeli-lesson-sub">Let's learn together!</span></div>

}
function banner(){const lv=typeof S!=='undefined'?S.p.level:'A1';return `<section class="zeli-intro" aria-label="Meet ZELI"><div class="zeli-live zeli-live-intro"><span class="zeli-glow"></span>${zeli(lv)}<span class="zeli-spark zeli-spark-one">✦</span></div><div><b>Meet ZELI ✨</b><p>Your crystal learning companion! Explore English through stories, pictures, and challenges. ZELI evolves with your selected level. Current form: <strong>${lv}</strong>.</p><div class="zeli-evolution">${["A1","A2","B1","B2","C1","C2"].map(x=>`<span style="${x===lv?"outline:2px solid #807ce5;font-weight:800":""}">${x} · ${["Seed","Seedling","Sprout","Crystal Bud","Bloom","Master Bloom"][["A1","A2","B1","B2","C1","C2"].indexOf(x)]}</span>`).join("")}</div></div></section>`}

 const head=main.querySelector('h1');if(head){const el=document.createElement('div');el.innerHTML=banner();el.firstElementChild.dataset.level=String(S.p.level);head.insertAdjacentElement('afterend',el.firstElementChild)}

  rose:{label:'Rose',primary:'#f4afd5',shade:'#b55fa6'},

 function syncMenu(){
  const open=document.body.classList.contains('nav'),mobile=matchMedia('(max-width:820px)').matches;
  const menu=document.querySelector('[data-a="menu"]');
  if(menu){menu.setAttribute('aria-expanded',String(open));menu.setAttribute('aria-controls','side');}
  const side=document.getElementById('side');side.inert=mobile&&!open;
 }
 document.addEventListener('click',e=>{
  if(e.target.closest('[data-recover-progress]')){document.getElementById('bk').value=kStorage.getItem(KEY+':recovery')||'';document.getElementById('bkm').textContent='Recovery copy displayed. Copy and keep it before attempting repairs.';}
  if(e.target.closest('[data-a="menu"]')||!document.body.classList.contains('nav'))syncMenu();
 });
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('nav')){document.body.classList.remove('nav');syncMenu();document.querySelector('[data-a="menu"]')?.focus();}});
 addEventListener('resize',syncMenu);
 function rollover(){if(T()===lastDay)return;lastDay=T();roll();save();if(['dashboard','missions','progress','zeli-shop'].includes((location.hash||'#dashboard').slice(1)))render();}
 document.addEventListener('visibilitychange',()=>{document.body.classList.toggle('knowly-paused',document.hidden);if(document.hidden){kSpeakStop();kListStop();save()}else rollover()});
 addEventListener('focus',rollover);
 setInterval(rollover,30000);
 render();
})();

</script>
</body>
</html>
