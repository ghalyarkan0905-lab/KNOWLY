{id:"a2-pa",tb:{t:"Aturan membentuk past simple",h:["Aturan","Contoh"],r:[["Kebanyakan: + ed","work menjadi worked, play menjadi played"],["Berakhir e: + d","like menjadi liked, live menjadi lived"],["Konsonan + y: ied","study menjadi studied, try menjadi tried"],["1 suku kata (konsonan-vokal-konsonan): gandakan","stop menjadi stopped, plan menjadi planned"],["Tidak beraturan","go menjadi went, eat menjadi ate, see menjadi saw, buy menjadi bought, have menjadi had"]]},det:[["Kapan dipakai?","Past simple dipakai untuk kejadian yang <b>sudah selesai</b> di masa lalu. Biasanya ada waktu yang jelas: <i>yesterday, last week, two days ago, in 2020, when I was a child</i>. Bahasa Indonesia tidak mengubah kata kerja, tetapi bahasa Inggris wajib memakai bentuk lampau."],["Kata kerja beraturan dan tidak beraturan","Kata kerja beraturan ditambah -ed. Kata kerja tidak beraturan berubah bentuk dan harus dihafal. Yang paling sering muncul: go-went, have-had, do-did, see-saw, eat-ate, buy-bought, come-came, take-took, dan get-got. Cara belajar yang baik: hafalkan 5 kata per hari dalam kalimat."],["Negatif dan pertanyaan","Pakai did. Karena did sudah menunjukkan masa lalu, kata kerja utama kembali ke bentuk dasar: <i>I didn’t go</i> (bukan <i>didn’t went</i>) dan <i>Did you go?</i> (bukan <i>Did you went?</i>). Untuk to be, bentuk lampaunya was atau were: <i>I was tired</i> dan <i>They were at home</i>."]],dl:[["Ayu:","Where did you go last weekend?","Kamu pergi ke mana akhir pekan lalu?"],["Bagas:","I went to Bandung with my family.","Saya pergi ke Bandung bersama keluarga."],["Ayu:","Did you visit the farm?","Apakah kamu mengunjungi peternakan?"],["Bagas:","No, we didn’t. We visited my aunt and ate fried chicken.","Tidak. Kami mengunjungi bibi saya dan makan ayam goreng."]],nu:["Jangan pakai V2 setelah did: <i>Did you went?</i> salah.","Jangan pakai kata kerja dasar untuk masa lalu: <i>I go yesterday</i> salah.","Jangan pakai past simple untuk kebiasaan yang berlangsung sekarang: pakai present simple.","Jangan memakai past simple bersama now atau tomorrow: pakai present atau bentuk masa depan."],rec:["Past simple: kejadian selesai di masa lalu dengan waktu yang jelas.","Beraturan: + ed. Tidak beraturan: hafalkan bentuknya.","Negatif: did not (didn’t) + kata kerja dasar.","Pertanyaan: Did + subjek + kata kerja dasar.","To be: was untuk I/he/she/it, were untuk you/we/they."],eg2:[["I was at home last night.","Saya ada di rumah tadi malam."],["They played football two days ago.","Mereka bermain sepak bola dua hari yang lalu."],["She bought a new bag yesterday.","Dia membeli tas baru kemarin."],["Did you see the film?","Apakah kamu menonton filmnya?"]],q2:[["She ___ a new bag yesterday. (buy)",null,"bought","Buy tidak beraturan: bought."],["We ___ at home last night. (to be)",null,"were","We memakai were di masa lalu."],["He ___ to school yesterday. (not/go)",null,"didn't go","Negatif: didn’t + kata kerja dasar.",["did not go"]]],t:"Past Simple",o:"Menceritakan kejadian yang sudah selesai di masa lalu.",ex:"Past simple dipakai untuk kejadian yang sudah selesai di masa lalu pada waktu yang jelas (yesterday, last week, in 2020). Kata kerja beraturan ditambah -ed (work menjadi worked). Kata kerja tidak beraturan berubah bentuk (go menjadi went, eat menjadi ate). Bentuk negatif memakai did not + kata kerja dasar. Bentuk tanya: Did + subjek + kata kerja dasar.",f:"V2 (worked / went) | did not + V1 | Did + subject + V1?",ok:"I visited my grandmother yesterday. / She didn’t go to school.",no:"I visit my grandmother yesterday. / She didn’t went to school.",mist:"Memakai kata kerja dasar untuk masa lalu karena bahasa Indonesia tidak berubah, dan memakai V2 setelah did (didn’t went). Setelah did atau didn’t, kata kerja kembali ke bentuk dasar.",eg:[["We watched a film last night.","Kami menonton film tadi malam."],["He went to Bali in June.","Dia pergi ke Bali bulan Juni."],["Did you eat breakfast?","Apakah kamu sudah sarapan?"]],q:[["I ___ to the market yesterday.",["go","went","goed"],"went","Yesterday menunjukkan masa lalu. V2 dari go adalah went."],["She ___ her homework last night.",["does","did","do"],"did","Last night menunjukkan masa lalu: did."],["We ___ (watch) a movie last Friday.",null,"watched","Kata kerja beraturan ditambah -ed."],["He didn’t ___ (go) to school yesterday.",null,"go","Setelah didn’t, kata kerja kembali ke bentuk dasar."],["Which sentence is correct?",["Did you went there?","Did you go there?","Do you went there?"],"Did you go there?","Setelah Did, kata kerja bentuk dasar."]]},
{id:"a2-mm",tb:{t:"Many, much, a lot of, a few, a little",h:["Kata","Dipakai dengan","Contoh"],r:[["many","benda jamak (bisa dihitung)","many books"],["much","benda tak terhitung","much water"],["a lot of","keduanya (positif)","a lot of friends / a lot of money"],["a few","jamak, 'beberapa' (cukup)","a few eggs"],["a little","tak terhitung, 'sedikit' (cukup)","a little milk"]]},det:[["Bisa dihitung atau tidak?","Benda yang bisa dihitung satu per satu punya bentuk jamak: <i>one book, two books</i>. Benda tak terhitung tidak punya jamak dan dilihat sebagai satu massa: <i>water, rice, money, time, sugar</i>. Inilah dasar memilih many atau much."],["Di kalimat apa dipakai?","Many dan much paling sering dipakai di kalimat <b>negatif dan pertanyaan</b>: <i>I don’t have much time. How many people came?</i> Di kalimat positif biasa, lebih natural memakai <b>a lot of</b>: <i>I have a lot of work.</i>"],["A few dan a little","<b>A few</b> (jamak) dan <b>a little</b> (tak terhitung) berarti 'sedikit tetapi cukup': <i>I have a few friends here.</i> Tanpa a, <b>few</b> dan <b>little</b> berarti 'hampir tidak ada': <i>I have few friends here</i> (kurang teman)."]],dl:[["Penjual:","How many apples do you want?","Anda mau berapa apel?"],["Mira:","Just a few, please. How much is the rice?","Beberapa saja. Berapa harga berasnya?"],["Penjual:","Twenty thousand a kilo. We have a lot of rice today.","Dua puluh ribu per kilo. Hari ini kami punya banyak beras."],["Mira:","OK, I’ll take a little. I don’t have much money.","Baik, saya ambil sedikit. Saya tidak punya banyak uang."]],nu:["Jangan pakai much dengan benda yang bisa dihitung: <i>much books</i> salah.","Jangan pakai many dengan benda tak terhitung: <i>many water</i> salah.","Di kalimat positif, hindari much dan many sendirian: <i>I have much money</i> terdengar kaku; pakai <i>a lot of money</i>.","Jangan menukar a few dengan few: artinya berbeda (cukup versus hampir tidak ada)."],rec:["Many + jamak, much + tak terhitung.","A lot of cocok untuk keduanya, terutama di kalimat positif.","How many + jamak? How much + tak terhitung?","A few (jamak) dan a little (tak terhitung): sedikit tetapi cukup.","Few dan little tanpa a: hampir tidak ada."],eg2:[["How many students are there?","Ada berapa siswa?"],["I don’t drink much coffee.","Saya tidak banyak minum kopi."],["She has a lot of homework.","Dia punya banyak PR."],["There is a little milk in the glass.","Ada sedikit susu di gelas."]],q2:[["I have ___ friends in this city. (a small number, enough)",["a few","a little","much"],"a few","Teman bisa dihitung, jadi a few."],["There is ___ sugar in the jar.",["a little","a few","many"],"a little","Sugar tak terhitung, jadi a little."],["How ___ time do you have? (many/much)",null,"much","Time tak terhitung: how much."]],t:"Much, Many, A lot of",o:"Menyatakan jumlah benda yang bisa dan tidak bisa dihitung.",ex:"Many dipakai untuk benda yang bisa dihitung (many books). Much dipakai untuk benda tak terhitung (much water), terutama di kalimat negatif dan pertanyaan. A lot of bisa dipakai untuk keduanya, terutama di kalimat positif. Untuk bertanya jumlah: How many + benda jamak? How much + benda tak terhitung?",f:"many + benda jamak | much + benda tak terhitung | a lot of + keduanya",ok:"How many books do you have? / I don’t have much time.",no:"How much books do you have?",mist:"Memakai much untuk benda yang bisa dihitung (much books). Cek dulu: bisa dihitung satu, dua, tiga? Pakai many. Tidak bisa dihitung seperti water, time, atau money? Pakai much.",eg:[["There are many students in the hall.","Ada banyak pelajar di aula."],["I don’t drink much coffee.","Saya tidak banyak minum kopi."],["She has a lot of friends.","Dia punya banyak teman."]],q:[["How ___ water do you drink every day?",["many","much","a"],"much","Water tidak bisa dihitung, jadi much."],["There are ___ people at the party.",["much","many","a little"],"many","People bisa dihitung, jadi many."],["I don’t have ___ money.",["many","much","a few"],"much","Money tidak bisa dihitung, jadi much."],["How ___ brothers do you have? (many/much)",null,"many","Brothers bisa dihitung, jadi How many."],["She has a lot ___ friends.",null,"of","Bentuknya a lot of."]]},
{id:"a2-af",tb:{t:"Skala frekuensi",h:["Adverb","Artinya","Kira-kira","Contoh"],r:[["always","selalu","100%","I always brush my teeth."],["usually","biasanya","90%","She usually walks to school."],["often","sering","70%","We often eat out."],["sometimes","kadang-kadang","50%","He sometimes plays games."],["rarely","jarang","10%","They rarely watch TV."],["never","tidak pernah","0%","I never drink coffee."]]},det:[["Posisi dalam kalimat","Adverb of frequency biasanya diletakkan <b>sebelum kata kerja biasa</b> (<i>I usually get up at six</i>) dan <b>setelah to be</b> (<i>She is always late</i>). Dengan kata kerja bantu atau modal, letaknya setelah kata bantu: <i>I can never find my keys.</i>"],["Di awal atau akhir kalimat","Sometimes, usually, dan often boleh dipakai di awal kalimat: <i>Sometimes I walk to school.</i> Sometimes juga bisa di akhir. Tetapi always dan never tidak diletakkan di awal kalimat biasa."],["Menanyakan frekuensi dengan how often","Pertanyaan: <i>How often do you exercise?</i> Jawaban: <i>Twice a week</i> (dua kali seminggu), <i>every day</i>, <i>once a month</i>. Ungkapan seperti <i>every day, once a week, twice a year</i> biasanya di akhir kalimat."]],dl:[["Rika:","How often do you exercise?","Seberapa sering kamu berolahraga?"],["Dimas:","I usually run on Saturdays, and sometimes I swim.","Saya biasanya berlari hari Sabtu, dan kadang-kadang berenang."],["Rika:","Do you ever eat fast food?","Apakah kamu pernah makan makanan cepat saji?"],["Dimas:","Rarely. I never drink soda, but I always have fruit for breakfast.","Jarang. Saya tidak pernah minum soda, tetapi saya selalu makan buah untuk sarapan."]],nu:["Jangan letakkan adverb setelah kata kerja biasa: <i>I get up usually</i> kurang tepat.","Jangan pakai never dengan negatif lain: <i>I don’t never eat meat</i> salah (negatif ganda).","Jangan letakkan adverb sebelum to be: <i>She always is late</i> salah, yang benar <i>She is always late</i>.","Jangan menaruh always atau never di awal kalimat biasa."],rec:["Skala: always, usually, often, sometimes, rarely, never.","Sebelum kata kerja biasa, setelah to be.","Tanyakan dengan How often...?","Hindari negatif ganda dengan never.","Ungkapan seperti once a week biasanya di akhir kalimat."],eg2:[["My father is usually at home on Sundays.","Ayah saya biasanya di rumah pada hari Minggu."],["I never eat breakfast.","Saya tidak pernah sarapan."],["She sometimes visits her grandmother.","Dia kadang-kadang mengunjungi neneknya."],["How often do you go to the gym? Twice a week.","Seberapa sering kamu ke gym? Dua kali seminggu."]],q2:[["She ___ late for class. (never)",["is never","never is","never"],"is never","Adverb setelah to be."],["I ___ tea at night.",["always drink","drink always","am always drink"],"always drink","Adverb sebelum kata kerja biasa."],["___ often do you go to the cinema? (how)",null,"how","Menanyakan frekuensi: how often."]],t:"Adverbs of Frequency",o:"Menyatakan seberapa sering sesuatu dilakukan.",ex:"Adverb of frequency menyatakan seberapa sering sesuatu terjadi: always (selalu), usually (biasanya), often (sering), sometimes (kadang-kadang), rarely (jarang), dan never (tidak pernah). Letaknya sebelum kata kerja biasa (I often eat rice), tetapi setelah to be (She is always late).",f:"Subject + adverb + V1 | Subject + be + adverb",ok:"I usually get up at six. / He is never late.",no:"I get up usually at six. / He never is late.",mist:"Meletakkan adverb di akhir kalimat atau setelah kata kerja biasa (I get up usually). Letakkan sebelum kata kerja biasa, dan setelah am, is, atau are.",eg:[["She always drinks tea in the morning.","Dia selalu minum teh di pagi hari."],["We sometimes go to the beach.","Kami kadang-kadang pergi ke pantai."],["He is never late for class.","Dia tidak pernah terlambat ke kelas."]],q:[["She ___ to school by bus.",["usually goes","goes usually","usually go"],"usually goes","Adverb sebelum kata kerja biasa, dan she memakai goes."],["He ___ late for work.",["always is","is always","always"],"is always","Adverb setelah to be."],["Which sentence is correct?",["I often eat fish.","I eat often fish.","I eat fish often are."],"I often eat fish.","Adverb of frequency sebelum kata kerja biasa."],["I ___ eat breakfast. (0% of the time)",null,"never","Never berarti tidak pernah."],["We ___ go to the beach on weekends. (100% of the time)",null,"always","Always berarti selalu."]]},
{id:"a2-pt",tb:{t:"At, on, in untuk waktu",h:["Preposisi","Dipakai untuk","Contoh"],r:[["at","jam, waktu tertentu","at six o’clock, at noon, at night"],["on","hari dan tanggal","on Monday, on 5 May, on my birthday"],["in","bulan, tahun, musim, bagian hari","in June, in 2024, in summer, in the morning"],["for","lamanya","for two hours"],["since","sejak (titik awal)","since 2020"],["before / after","sebelum / sesudah","before dinner, after school"]]},det:[["Pola dari besar ke kecil","Cara mudah mengingatnya: <b>in</b> untuk waktu yang panjang (tahun, bulan, musim), <b>on</b> untuk hari dan tanggal, <b>at</b> untuk waktu yang tepat (jam, saat tertentu). Seperti menyempitkan: in 2024, in June, on 5 June, at 6 p.m."],["Pengecualian yang sering muncul","Bagian hari memakai in (<i>in the morning, in the afternoon, in the evening</i>), tetapi malam memakai at (<i>at night</i>). Akhir pekan: <i>at the weekend</i> (Inggris Britania) atau <i>on the weekend</i> (Amerika). Hari tertentu dengan bagian hari memakai on: <i>on Monday morning</i>."],["Tanpa preposisi","Jangan tambahkan at, on, atau in sebelum <i>every, next, last, this, tomorrow, yesterday</i>: <i>I will see you next Monday</i> (bukan <i>on next Monday</i>)."]],dl:[["Ayah:","What time does your class start on Monday?","Jam berapa kelasmu mulai hari Senin?"],["Nia:","It starts at eight in the morning.","Mulai jam delapan pagi."],["Ayah:","And when is your exam?","Dan kapan ujianmu?"],["Nia:","It’s on 15 June. I’m studying every night, so I’m not afraid.","Tanggal 15 Juni. Saya belajar setiap malam, jadi tidak takut."]],nu:["Jangan pakai in untuk jam atau hari: <i>in six o’clock, in Monday</i> salah.","Jangan pakai on dengan every, next, atau last: <i>on next week</i> salah.","Jangan pakai at untuk bulan atau tahun: <i>at June</i> salah, yang benar <i>in June</i>.","Jangan pakai in the night: yang benar <i>at night</i>."],rec:["At: jam dan waktu tepat. On: hari dan tanggal. In: bulan, tahun, musim.","In the morning, in the afternoon, in the evening, tetapi at night.","Tanpa preposisi sebelum every, next, last, this, tomorrow, yesterday.","For menunjukkan lama, since menunjukkan titik awal.","Pola: in (besar), on (hari), at (tepat)."],eg2:[["The film starts at 7 p.m.","Filmnya mulai jam 7 malam."],["I was born on 12 March.","Saya lahir tanggal 12 Maret."],["It is cold in December.","Bulan Desember itu dingin."],["I study at night.","Saya belajar malam hari."]],q2:[["We have lunch ___ noon.",["on","in","at"],"at","Waktu tertentu: at noon."],["I will see you ___ next Monday.",["on","in","(no preposition)"],"(no preposition)","Sebelum next tidak memakai preposisi."],["She goes to bed ___ night. (at/in)",null,"at","Malam hari memakai at night."]],t:"Prepositions of Time: in, on, at",o:"Memilih in, on, atau at untuk menyatakan waktu.",ex:"In, on, dan at dipakai untuk menyatakan waktu. At dipakai untuk jam dan waktu tertentu (at six o’clock, at night). On dipakai untuk hari dan tanggal (on Monday, on 5 May). In dipakai untuk bulan, tahun, musim, dan bagian hari (in June, in 2024, in the morning).",f:"at + jam | on + hari/tanggal | in + bulan/tahun/musim",ok:"I get up at six. / We meet on Monday. / She was born in 2005.",no:"I get up in six. / We meet in Monday.",mist:"Bahasa Indonesia memakai 'pada' atau 'di' untuk semuanya, jadi sering tertukar. Hafalkan polanya: jam memakai at, hari memakai on, bulan atau tahun memakai in.",eg:[["The class starts at nine.","Kelasnya mulai jam sembilan."],["I go to the market on Saturday.","Saya pergi ke pasar pada hari Sabtu."],["It is hot in July.","Bulan Juli itu panas."]],q:[["I wake up ___ six o’clock.",["in","on","at"],"at","Jam memakai at."],["We have a test ___ Friday.",["on","in","at"],"on","Hari memakai on."],["My birthday is ___ March.",["on","at","in"],"in","Bulan memakai in."],["The shop opens ___ nine o’clock.",null,"at","Jam memakai at."],["She was born ___ 2005.",null,"in","Tahun memakai in."]]},
{id:"a2-gt",tb:{t:"Bentuk be going to",h:["Bentuk","Rumus","Contoh"],r:[["Positif","am/is/are + going to + V1","I am going to study."],["Negatif","am/is/are + not + going to + V1","She isn’t going to come."],["Pertanyaan","Am/Is/Are + subject + going to + V1?","Are you going to eat?"],["Jawaban singkat","Yes, I am. / No, he isn’t.","Is it going to rain? Yes, it is."]]},det:[["Dua pemakaian utama","1) <b>Rencana atau niat</b> yang sudah dibuat sebelum bicara: <i>I’m going to visit my aunt on Sunday.</i> 2) <b>Prediksi dari bukti yang terlihat</b>: <i>Look at those clouds. It’s going to rain.</i> Penanda waktunya: tomorrow, next week, tonight, soon, dan in two days."],["Going to dan present continuous","Keduanya bisa dipakai untuk rencana dekat. <i>I’m going to see a film tonight</i> dan <i>I’m seeing a film tonight</i> hampir sama. Going to lebih menekankan niat, present continuous lebih menekankan bahwa sudah diatur (ada tiket atau janji)."],["Gaya bicara sehari-hari","Dalam percakapan, going to sering dilafalkan seperti 'gonna': <i>I’m gonna call you later.</i> Dalam tulisan formal, tetap tulis going to."]],dl:[["Lina:","What are you going to do this weekend?","Kamu akan melakukan apa akhir pekan ini?"],["Ben:","I’m going to visit my grandparents in Bogor.","Saya akan mengunjungi kakek-nenek saya di Bogor."],["Lina:","Are you going to take the train?","Apakah kamu akan naik kereta?"],["Ben:","No, I’m not. My father is going to drive us.","Tidak. Ayah saya yang akan mengantar kami."]],nu:["Jangan pakai going to untuk keputusan mendadak saat bicara: <i>The phone is ringing. I’m going to answer</i> kurang tepat, pakai <i>I’ll answer</i>.","Jangan lupa to be: <i>I going to</i> salah.","Jangan pakai kata kerja ber-ing atau V2 setelah going to: <i>going to studying</i> salah.","Jangan pakai going to untuk jadwal tetap: <i>The train leaves at six</i> memakai present simple."],rec:["Rumus: am/is/are + going to + kata kerja dasar.","Untuk rencana dan prediksi dengan bukti terlihat.","Penanda: tomorrow, tonight, next week, soon.","Keputusan mendadak memakai will, bukan going to.","Dalam percakapan sering terdengar gonna."],eg2:[["We are going to have a test tomorrow.","Kami akan ada ujian besok."],["It’s going to be a hot day.","Hari ini akan panas."],["I’m not going to buy that phone.","Saya tidak akan membeli ponsel itu."],["Are they going to move to Bali?","Apakah mereka akan pindah ke Bali?"]],q2:[["Look at the sky. It ___ rain. (going to)",null,"is going to","Prediksi dari bukti: is going to."],["She ___ to study tonight. (not)",["isn’t going","doesn’t going","not going"],"isn’t going","Negatif: is not (isn’t) going to."],["___ they going to come? (to be)",null,"are","Pertanyaan dengan they: Are they going to...?"]],t:"Going to (Future Plans)",o:"Membicarakan rencana dan hal yang akan terjadi.",ex:"Be going to dipakai untuk rencana atau niat di masa depan, dan untuk prediksi berdasarkan bukti yang terlihat sekarang. Bentuknya am/is/are + going to + kata kerja dasar. Negatif: tambahkan not setelah to be. Tanya: pindahkan to be ke depan (Are you going to study?).",f:"am/is/are + going to + V1",ok:"I am going to visit my aunt tomorrow.",no:"I going to visit my aunt tomorrow.",mist:"Lupa to be (I going to) atau memakai kata kerja ber-ing atau V2 setelah going to. Setelah going to, selalu kata kerja dasar.",eg:[["We are going to watch a film tonight.","Kami akan menonton film malam ini."],["She is going to buy a new phone.","Dia akan membeli ponsel baru."],["Look at the clouds. It is going to rain.","Lihat awan itu. Sepertinya akan hujan."]],q:[["I ___ study tonight.",["am going to","going to","am go to"],"am going to","Subjek I memakai am going to."],["They ___ visit Bali next month.",["is going to","are going to","going to"],"are going to","Subjek they memakai are going to."],["She is going to ___ (buy) a new bag.",null,"buy","Setelah going to, kata kerja dasar."],["___ you going to come to the party? (to be)",null,"are","Pertanyaan dengan you: Are you going to...?"],["Which sentence is correct?",["He going to cook dinner.","He is going to cook dinner.","He is going to cooks dinner."],"He is going to cook dinner.","Is going to + kata kerja dasar."]]},
{id:"a2-cm",tb:{t:"Aturan comparative",h:["Jenis kata sifat","Aturan","Contoh"],r:[["1 suku kata","+ er + than","tall menjadi taller than"],["Berakhir e","+ r","nice menjadi nicer"],["Pendek (konsonan-vokal-konsonan)","gandakan konsonan + er","big menjadi bigger, hot menjadi hotter"],["Berakhir y","y menjadi ier","easy menjadi easier, happy menjadi happier"],["2+ suku kata","more + adjective + than","more expensive than"],["Tidak beraturan","good menjadi better, bad menjadi worse","Today is better than yesterday."]]},det:[["Membandingkan dua hal","Comparative dipakai membandingkan <b>dua</b> hal atau orang. Setelah comparative biasanya ada <b>than</b> (daripada): <i>My bag is heavier than your bag.</i> Untuk persamaan, pakai <b>as ... as</b>: <i>She is as tall as her brother.</i>"],["Memilih -er atau more","Kata sifat pendek memakai -er; kata sifat panjang memakai more. Kalau berakhir -y, ubah menjadi -ier. Pegangan sederhananya: satu suku kata memakai -er; dua suku kata berakhir -y juga memakai -er; selebihnya memakai more."],["Menambah penekanan","Gunakan <b>much</b> atau <b>a lot</b> untuk 'jauh lebih': <i>This phone is much cheaper.</i> Gunakan <b>a little</b> atau <b>a bit</b> untuk 'sedikit lebih': <i>It’s a bit colder today.</i> Jangan pakai very: <i>very cheaper</i> salah."]],dl:[["Penjual:","This phone is cheaper, but that one is better.","Ponsel ini lebih murah, tetapi yang itu lebih bagus."],["Sinta:","Is it much more expensive?","Apakah jauh lebih mahal?"],["Penjual:","Yes, it’s a lot more expensive, but the camera is bigger and the battery is longer.","Ya, jauh lebih mahal, tetapi kameranya lebih besar dan baterainya lebih tahan lama."],["Sinta:","I think I’ll take the cheaper one.","Saya pikir saya ambil yang lebih murah."]],nu:["Jangan pakai more dengan kata sifat pendek: <i>more cheap</i> salah.","Jangan pakai -er dengan kata sifat panjang: <i>expensiver</i> salah.","Jangan pakai very dengan comparative: <i>very cheaper</i> salah, yang benar <i>much cheaper</i>.","Jangan pakai comparative untuk lebih dari dua hal: untuk 'paling', pakai superlative (the biggest)."],rec:["Pendek: -er + than; panjang: more + than.","-y menjadi -ier; konsonan-vokal-konsonan: gandakan konsonan.","Tidak beraturan: better, worse.","Penekanan: much, a lot, a little, a bit.","Persamaan: as ... as."],eg2:[["This road is longer than that road.","Jalan ini lebih panjang daripada jalan itu."],["My sister is happier now.","Saudara perempuan saya lebih bahagia sekarang."],["The train is faster than the bus.","Kereta lebih cepat daripada bus."],["She is as tall as her brother.","Dia setinggi kakaknya."]],q2:[["The weather is ___ today. (cold, only slightly)",["a bit colder","a bit more cold","very colder"],"a bit colder","Cold pendek: colder, dengan a bit."],["This exam is ___ than the last one. (difficult)",null,"more difficult","Kata sifat panjang memakai more."],["He is ___ than his brother. (happy)",null,"happier","Berakhir y menjadi -ier."]],t:"Comparatives",o:"Membandingkan dua orang atau benda.",ex:"Comparative dipakai untuk membandingkan dua hal. Kata sifat pendek (satu suku kata) ditambah -er lalu than (taller than). Kata sifat panjang memakai more + kata sifat + than (more expensive than). Kata sifat yang berakhir -y berubah menjadi -ier (easy menjadi easier). Bentuk tidak beraturan: good menjadi better, bad menjadi worse.",f:"adj + -er + than | more + adj + than | good: better, bad: worse",ok:"This phone is cheaper than that one.",no:"This phone is more cheap than that one.",mist:"Memakai more bersama kata sifat pendek (more cheap), atau lupa than. Juga salah memakai gooder atau more good; bentuknya better.",eg:[["My bag is heavier than your bag.","Tas saya lebih berat daripada tasmu."],["This book is more interesting than that one.","Buku ini lebih menarik daripada yang itu."],["Today is better than yesterday.","Hari ini lebih baik daripada kemarin."]],q:[["My house is ___ than your house.",["small","smaller","more small"],"smaller","Kata sifat pendek + -er + than."],["This film is ___ than that one.",["more interesting","interestinger","most interesting"],"more interesting","Kata sifat panjang memakai more."],["English is ___ (easy) than Chinese for me.",null,"easier","Easy berakhir -y, jadi easier."],["Today is ___ (hot) than yesterday.",null,"hotter","Hot menjadi hotter (konsonan digandakan)."],["Which sentence is correct?",["She is more tall than me.","She is taller than me.","She is tall than me."],"She is taller than me.","Tall adalah kata sifat pendek: taller than."]]},
{id:"a2-su",tb:{t:"Aturan superlative",h:["Jenis kata sifat","Aturan","Contoh"],r:[["1 suku kata","the + -est","tall menjadi the tallest"],["Berakhir e","the + -st","nice menjadi the nicest"],["Konsonan-vokal-konsonan","gandakan + est","big menjadi the biggest"],["Berakhir y","the + -iest","easy menjadi the easiest"],["2+ suku kata","the most + adj","the most interesting"],["Tidak beraturan","good: the best, bad: the worst","This is the best day."]]},det:[["Kapan dipakai?","Superlative membandingkan satu hal dengan <b>semua yang lain dalam satu kelompok</b> (tiga atau lebih). Biasanya diikuti kelompoknya dengan <i>in</i> atau <i>of</i>: <i>the tallest in the class</i> dan <i>the best of all</i>."],["Selalu pakai the","Superlative hampir selalu didahului <b>the</b>: <i>the oldest</i>, <i>the most beautiful</i>. Tanpa the terdengar janggal, kecuali setelah kata milik: <i>my best friend</i>, <i>her oldest brother</i>."],["Superlative dengan ever","Sering dipasangkan dengan <i>ever</i> untuk pengalaman: <i>It is the best film I have ever seen.</i>"]],dl:[["Guide:","This is the oldest temple in the city.","Ini kuil tertua di kota ini."],["Turis:","Wow! Is it also the biggest?","Wah! Apakah juga yang terbesar?"],["Guide:","No, the biggest is near the river. It is the most famous place here.","Bukan, yang terbesar ada dekat sungai. Itu tempat paling terkenal di sini."]],nu:["Jangan lupa the: <i>She is tallest girl</i> salah.","Jangan pakai most dengan kata sifat pendek: <i>the most tall</i> salah.","Jangan pakai superlative untuk dua hal: pakai comparative (<i>taller than</i>).","Jangan campur: <i>the most easiest</i> salah, cukup <i>the easiest</i>."],rec:["Pendek: the + -est; panjang: the most + kata sifat.","Tidak beraturan: the best, the worst.","Selalu pakai the (kecuali setelah kata milik).","Dipakai untuk tiga hal atau lebih.","Diikuti in atau of: the best in the class."],eg2:[["He is the funniest person I know.","Dia orang paling lucu yang saya kenal."],["This is the cheapest restaurant here.","Ini restoran termurah di sini."],["Which is the longest river in Indonesia?","Sungai mana yang terpanjang di Indonesia?"],["It was the best day of my life.","Itu hari terbaik dalam hidup saya."]],q2:[["She is ___ student in the school. (smart)",null,"the smartest","Kata sifat pendek: the + -est."],["That was ___ film I have ever seen. (bad)",null,"the worst","Bad tidak beraturan: the worst."],["It is the ___ dangerous road in this city.",["most","more","much"],"most","Kata sifat panjang: the most."]],t:"Superlatives",o:"Menyatakan yang paling di antara tiga hal atau lebih.",ex:"Superlative dipakai untuk menyatakan yang paling di antara tiga hal atau lebih. Kata sifat pendek memakai the + -est (the tallest). Kata sifat panjang memakai the most + kata sifat (the most expensive). Bentuk tidak beraturan: good menjadi the best, bad menjadi the worst, dan far menjadi the farthest.",f:"the + adj-est | the most + adj | the best / the worst",ok:"This is the cheapest bag in the shop.",no:"This is the most cheap bag in the shop.",mist:"Lupa memakai the sebelum superlative, memakai most pada kata sifat pendek (most cheap), atau memakai more dan most berbarengan (most easiest).",eg:[["Mount Everest is the highest mountain in the world.","Gunung Everest adalah gunung tertinggi di dunia."],["She is the most intelligent student in the class.","Dia siswa paling cerdas di kelas."],["This is the worst film I have ever seen.","Ini film terburuk yang pernah saya tonton."]],q:[["Mount Everest is the ___ mountain in the world.",["high","higher","highest"],"highest","Satu suku kata: the + -est."],["This is the ___ expensive hotel in the city.",["most","more","much"],"most","Kata sifat panjang: the most."],["Today is the ___ (hot) day of the year.",null,"hottest","Hot menjadi the hottest (konsonan digandakan)."],["She is the ___ (good) student in my class.",null,"best","Good tidak beraturan: the best."],["Which sentence is correct?",["She is the most tall girl.","She is the tallest girl.","She is tallest girl."],"She is the tallest girl.","Kata sifat pendek: the tallest."]]},
{id:"a2-ht",tb:{t:"Have to dan must",h:["Bentuk","Have to","Must"],r:[["Positif","I have to go. / She has to go.","I must go."],["Negatif (tidak perlu)","I don’t have to go.","tidak dipakai"],["Larangan","tidak dipakai","You mustn’t go."],["Pertanyaan","Do I have to go?","Must I go? (formal)"],["Masa lalu","I had to go.","pakai had to"]]},det:[["Dari mana kewajibannya?","<b>Have to</b> menyatakan kewajiban dari luar: aturan, hukum, atau keadaan (<i>I have to wear a uniform</i>). <b>Must</b> menyatakan kewajiban dari pembicara sendiri atau yang kuat (<i>I must study harder</i>). Dalam percakapan sehari-hari, have to jauh lebih sering dipakai."],["Jebakan: don’t have to dan mustn’t","<i>You don’t have to come</i> berarti kamu tidak perlu datang (boleh datang, boleh tidak). <i>You mustn’t come</i> berarti kamu dilarang datang. Arti keduanya sangat berbeda, jadi hati-hati memilih."],["Cara memakainya","Have to berubah mengikuti subjek (<i>has to</i> untuk he/she/it) dan bisa dipakai di semua tense (<i>had to, will have to</i>). Must tidak berubah dan tidak punya bentuk lampau. Untuk masa lalu, pakai had to."]],dl:[["Guru:","You mustn’t use your phone in the exam.","Kamu dilarang memakai ponsel di ujian."],["Murid:","Do we have to bring a pen?","Apakah kami harus membawa pulpen?"],["Guru:","Yes, you do. But you don’t have to bring paper. I’ll give you some.","Ya, harus. Tetapi kalian tidak perlu membawa kertas. Saya akan memberi."]],nu:["Jangan tukar mustn’t dengan don’t have to.","Jangan tambah to setelah must: <i>must to go</i> salah.","Jangan lupa has to untuk he/she/it: <i>She have to</i> salah.","Jangan pakai must untuk masa lalu: <i>I must go yesterday</i> salah, pakai <i>I had to go</i>."],rec:["Have to: kewajiban dari aturan atau keadaan; must: dari pembicara.","Don’t have to = tidak perlu; mustn’t = dilarang.","He/she/it memakai has to.","Setelah must dan have to, kata kerja dasar.","Masa lalu: had to."],eg2:[["We have to wear helmets.","Kita harus memakai helm."],["I must call my mother tonight.","Saya harus menelepon ibu saya malam ini."],["You don’t have to pay. It’s free.","Kamu tidak perlu membayar. Gratis."],["Children mustn’t play with fire.","Anak-anak dilarang bermain api."]],q2:[["I ___ stay at home yesterday.",["had to","have to","must"],"had to","Masa lalu: had to."],["You ___ drive fast here. It is dangerous. (not allowed)",null,"mustn't","Larangan: mustn’t.",["must not"]],["He ___ work on Saturdays. It is optional. (negative)",null,"doesn't have to","Tidak wajib: doesn’t have to.",["does not have to"]]],t:"Have to and Must",o:"Menyatakan kewajiban dan larangan.",ex:"Have to dan must dipakai untuk kewajiban. Have to berarti harus karena aturan atau keadaan dari luar (I have to wear a uniform). Must berarti harus karena keputusan atau perasaan pembicara sendiri (I must call my mother). Bentuk negatifnya tidak sama: don’t have to berarti tidak perlu, sedangkan mustn’t berarti dilarang.",f:"have/has to + V1 | must + V1 | don’t have to = tidak perlu | mustn’t = dilarang",ok:"I have to wear a uniform. / You mustn’t smoke here.",no:"I must to go. / She have to work.",mist:"Menukar mustn’t dengan don’t have to. Keduanya berbeda: mustn’t berarti dilarang, don’t have to berarti tidak wajib. Juga lupa has to untuk he/she/it dan menambah to setelah must.",eg:[["I have to get up at five every day.","Saya harus bangun jam lima setiap hari."],["You mustn’t park here.","Kamu dilarang parkir di sini."],["He doesn’t have to work on Sunday.","Dia tidak harus bekerja hari Minggu."]],q:[["She ___ wear a uniform at school.",["have to","has to","must to"],"has to","She memakai has to."],["You ___ smoke in the hospital. (not allowed)",["don’t have to","mustn’t","haven’t to"],"mustn’t","Larangan: mustn’t."],["Tomorrow is a holiday. We ___ go to school.",["don’t have to","mustn’t","must"],"don’t have to","Tidak wajib: don’t have to."],["I ___ to finish my homework tonight. (have/has)",null,"have","I memakai have to."],["Do you ___ to wake up early? (have to)",null,"have","Pertanyaan: Do you have to...?"]]},
{id:"a2-wl",tb:{t:"Bentuk will",h:["Bentuk","Rumus","Contoh"],r:[["Positif","will + V1 (’ll)","I’ll call you."],["Negatif","will not (won’t) + V1","He won’t come."],["Pertanyaan","Will + subject + V1?","Will you help me?"],["Jawaban singkat","Yes, I will. / No, I won’t.","Will it rain? Yes, it will."]]},det:[["Tiga pemakaian will","1) <b>Keputusan spontan</b> saat bicara: <i>It’s hot. I’ll open the window.</i> 2) <b>Prediksi atau perkiraan</b> tanpa bukti kuat: <i>I think it will rain.</i> 3) <b>Janji, tawaran, dan permintaan</b>: <i>I’ll help you. Will you open the door?</i>"],["Will dan going to","Will untuk keputusan saat itu juga dan prediksi pendapat. Going to untuk rencana yang sudah dibuat dan prediksi dari bukti yang terlihat. Bandingkan: <i>I’m going to visit my aunt</i> (sudah direncanakan) dan <i>I’ll visit her tomorrow</i> (baru memutuskan)."],["Kata yang sering menyertai will","Setelah <i>I think, I hope, I’m sure, probably, maybe</i> kita sering memakai will: <i>I think she will win.</i> Singkatan: I will menjadi I’ll, dan will not menjadi won’t."]],dl:[["Rani:","Oh no, I forgot my wallet!","Aduh, saya lupa dompet saya!"],["Ali:","Don’t worry. I’ll pay for lunch today.","Tenang saja. Saya yang bayar makan siang hari ini."],["Rani:","Thanks! I’ll pay next time. I promise.","Terima kasih! Saya yang bayar lain kali. Janji."],["Ali:","OK. I think it will be a great lunch.","Baik. Saya rasa makan siangnya akan enak."]],nu:["Jangan pakai will untuk rencana yang sudah dibuat: pakai going to atau present continuous.","Jangan tambah -s pada will: <i>she wills</i> salah.","Jangan pakai to setelah will: <i>will to go</i> salah.","Jangan pakai will setelah if atau when untuk waktu: <i>If it will rain</i> salah; pakai <i>If it rains</i>."],rec:["Will + kata kerja dasar untuk semua subjek.","Untuk keputusan spontan, prediksi, janji, dan tawaran.","Negatif: won’t. Singkatan: I’ll, you’ll, he’ll.","Rencana yang sudah dibuat: going to.","Setelah if atau when, pakai present simple, bukan will."],eg2:[["I’ll have tea, please.","Saya pesan teh, ya."],["Do you think it will rain?","Menurutmu akan hujan?"],["She’ll be late. The bus is delayed.","Dia akan terlambat. Busnya terlambat."],["I promise I won’t tell anyone.","Saya janji tidak akan memberi tahu siapa pun."]],q2:[["It is cold. I ___ close the window.",null,"will","Keputusan spontan: will.",["'ll"]],["I am sure she ___ come to the party. (negative)",null,"won't","Negatif will adalah won’t.",["will not"]],["He ___ pass the exam. He studies hard every night. (will/won't)",null,"will","Prediksi positif: will."]],t:"Will",o:"Menyatakan keputusan spontan, prediksi, dan janji.",ex:"Will dipakai untuk keputusan yang diambil saat berbicara (I’ll open the window), prediksi atau perkiraan (It will rain tomorrow), serta janji dan tawaran (I will help you). Bentuknya will + kata kerja dasar untuk semua subjek. Negatif: will not (won’t). Tanya: Will + subjek + kata kerja dasar?",f:"will + V1 | will not (won’t) + V1 | Will + subject + V1?",ok:"I’ll help you. / It won’t rain tomorrow.",no:"I will helping you. / She wills come.",mist:"Menambah -s pada will (she wills), memakai to setelah will (will to go), atau memakai kata kerja ber-ing setelah will. Will bentuknya tetap, diikuti kata kerja dasar.",eg:[["I’ll carry your bag.","Biar saya yang bawakan tasmu."],["It will be sunny tomorrow.","Besok akan cerah."],["I won’t forget your birthday.","Saya tidak akan lupa ulang tahunmu."]],q:[["The phone is ringing. I ___ answer it.",["will","am going","go"],"will","Keputusan spontan: will."],["She ___ come tomorrow. (negative)",["won’t","doesn’t","isn’t"],"won’t","Negatif will: won’t."],["Which is correct?",["She wills help us.","She will help us.","She will to help us."],"She will help us.","Will + kata kerja dasar."],["I think it ___ rain tomorrow.",null,"will","Prediksi opini: will."],["___ you help me with this bag?",null,"will","Permintaan: Will you...?"]]},
{id:"a2-pf",tb:{t:"Bentuk present perfect",h:["Bentuk","Rumus","Contoh"],r:[["Positif","have/has + V3","I have finished."],["Negatif","have/has + not + V3","She hasn’t called."],["Pertanyaan","Have/Has + subject + V3?","Have you eaten?"],["Jawaban singkat","Yes, I have. / No, she hasn’t.","Has he left? Yes, he has."]]},det:[["Tiga pemakaian utama","1) <b>Pengalaman hidup</b> (waktu tidak disebut): <i>I have visited Bali.</i> 2) <b>Kejadian baru saja selesai</b>: <i>I have just finished.</i> 3) <b>Hasil sekarang</b>: <i>I have lost my keys</i> (sekarang kunci hilang)."],["Past participle (V3)","Kata kerja beraturan: V3 sama dengan V2 (worked, played). Kata kerja tidak beraturan harus dihafal: go-gone, see-seen, eat-eaten, do-done, write-written, take-taken, be-been, have-had."],["Ever, never, already, yet, just","<b>Ever</b> (pernah, di pertanyaan): <i>Have you ever been to Japan?</i> <b>Never</b> (belum pernah): <i>I have never eaten sushi.</i> <b>Already</b> (sudah): <i>She has already left.</i> <b>Yet</b> (belum, di negatif dan tanya): <i>I haven’t finished yet.</i> <b>Just</b> (baru saja): <i>He has just arrived.</i>"]],dl:[["Fira:","Have you ever been to Bali?","Pernahkah kamu ke Bali?"],["Gani:","Yes, I have. I’ve been there twice. What about you?","Ya, pernah. Saya sudah dua kali ke sana. Kamu?"],["Fira:","No, I haven’t. But I’ve already bought a ticket for next month.","Belum. Tetapi saya sudah membeli tiket untuk bulan depan."]],nu:["Jangan pakai present perfect dengan waktu yang jelas: <i>I have seen him yesterday</i> salah, pakai <i>I saw him yesterday</i>.","Jangan pakai V2 setelah have: <i>has ate</i> salah, yang benar <i>has eaten</i>.","Jangan lupa has untuk he/she/it: <i>She have finished</i> salah.","Jangan pakai present perfect untuk kejadian yang sudah punya waktu pasti di masa lalu."],rec:["Rumus: have/has + V3.","Untuk pengalaman, kejadian baru selesai, dan hasil sekarang.","Penanda: ever, never, already, yet, just.","Waktu jelas (yesterday, last week): pakai past simple.","V3 tidak beraturan harus dihafal."],eg2:[["I haven’t eaten breakfast yet.","Saya belum sarapan."],["He has just arrived at the airport.","Dia baru saja tiba di bandara."],["We have lived here for five years.","Kami sudah tinggal di sini selama lima tahun."],["Has she finished her homework?","Apakah dia sudah menyelesaikan PR-nya?"]],q2:[["I haven’t finished my homework ___.",["yet","already","ever"],"yet","Di kalimat negatif, ‘belum’ memakai yet."],["He has ___ (eat) here twice.",null,"eaten","V3 dari eat adalah eaten."],["She has ___ (write) three letters.",null,"written","V3 dari write adalah written."]],t:"Present Perfect (Basic)",o:"Menyatakan pengalaman dan hasil dari masa lalu yang masih berhubungan dengan sekarang.",ex:"Present perfect dipakai untuk pengalaman hidup (I have visited Bali), kejadian yang baru selesai (She has just left), dan hasil sekarang dari kejadian masa lalu (I have lost my keys). Bentuknya have/has + kata kerja bentuk ketiga (V3). Dipakai bersama ever, never, already, yet, dan just. Tidak dipakai bersama waktu yang jelas seperti yesterday.",f:"have/has + V3",ok:"I have visited Bali. / She has already eaten.",no:"I have visited Bali yesterday. / She has ate.",mist:"Memakai present perfect dengan waktu yang jelas (yesterday, last week), lupa has untuk he/she/it, atau memakai V2 bukan V3 (has ate). Untuk waktu yang jelas pakai past simple.",eg:[["I have never eaten durian.","Saya belum pernah makan durian."],["She has just finished her homework.","Dia baru saja menyelesaikan PR-nya."],["Have you ever been to Japan?","Pernahkah kamu ke Jepang?"]],q:[["I ___ never visited Bali.",["has","have","am"],"have","I memakai have + V3."],["She ___ already eaten lunch.",["have","has","is"],"has","She memakai has + V3."],["Which is correct?",["I have seen him yesterday.","I saw him yesterday.","I have saw him yesterday."],"I saw him yesterday.","Waktu jelas (yesterday) memakai past simple."],["They have ___ (see) that film three times.",null,"seen","V3 dari see adalah seen."],["___ you ever eaten durian? (have)",null,"have","Pertanyaan: Have you ever...?"]]},
{id:"a2-am",tb:{t:"Membentuk adverb dari kata sifat",h:["Kata sifat","Adverb","Contoh"],r:[["slow","slowly (+ ly)","She walks slowly."],["quick","quickly","He runs quickly."],["easy","easily (y menjadi ily)","I passed easily."],["good","well (tidak beraturan)","She sings well."],["fast","fast (sama)","He drives fast."],["hard","hard (sama)","They work hard."]]},det:[["Apa itu adverb of manner?","Adverb of manner menjelaskan <b>bagaimana</b> suatu kegiatan dilakukan: <i>She speaks slowly. He drives carefully.</i> Kata sifat menjelaskan benda atau orang (<i>a slow car</i>), sedangkan adverb menjelaskan kata kerja (<i>He drives slowly</i>). Kebanyakan adverb dibentuk dengan menambah -ly pada kata sifat."],["Posisi dalam kalimat","Adverb of manner biasanya diletakkan <b>setelah kata kerja</b> atau setelah objeknya: <i>She sings beautifully. He opened the door quietly.</i> Jangan letakkan di antara kata kerja dan objek: <i>He opened quietly the door</i> kurang tepat."],["Good dan well, fast dan hard","<b>Good</b> adalah kata sifat (<i>a good singer</i>), <b>well</b> adalah adverb (<i>She sings well</i>). Fast dan hard bentuk kata sifat dan adverb-nya sama: <i>a fast car, He drives fast</i>. Hati-hati: <i>hardly</i> berarti hampir tidak, bukan 'dengan keras'."]],dl:[["Guru:","You speak English very well, Dina.","Bahasa Inggrismu bagus sekali, Dina."],["Dina:","Thank you. I practice carefully every day.","Terima kasih. Saya berlatih dengan hati-hati setiap hari."],["Guru:","And you write quickly too!","Dan kamu menulis dengan cepat juga!"],["Dina:","Yes, but I always check my answers slowly.","Ya, tetapi saya selalu memeriksa jawaban dengan pelan."]],nu:["Jangan pakai kata sifat untuk menjelaskan kata kerja: <i>She sings beautiful</i> salah, yang benar <i>She sings beautifully</i>.","Jangan pakai good sebagai adverb: <i>She sings good</i> salah, yang benar <i>She sings well</i>.","Jangan letakkan adverb di antara kata kerja dan objeknya: <i>He opened quietly the door</i> kurang tepat.","Jangan tambah -ly pada fast dan hard: <i>fastly</i> salah."],rec:["Adverb of manner: menjelaskan bagaimana kegiatan dilakukan.","Kebanyakan: kata sifat + -ly; y menjadi -ily.","Good menjadi well; fast dan hard tidak berubah.","Letakkan setelah kata kerja atau objeknya.","Hardly berarti hampir tidak, bukan 'dengan keras'."],eg2:[["He drives carefully.","Dia mengemudi dengan hati-hati."],["The children are playing happily.","Anak-anak bermain dengan gembira."],["She answered the question correctly.","Dia menjawab pertanyaan itu dengan benar."],["You must work hard.","Kamu harus bekerja keras."]],q2:[["She sings ___. (beautiful)",null,"beautifully","Adverb dari beautiful: beautifully."],["He is a ___ driver, so he drives ___.",["good / well","well / good","good / good"],"good / well","Good (kata sifat) untuk driver, well (adverb) untuk drives."],["They work very ___ every day. (hard)",null,"hard","Hard bentuknya sama sebagai adverb."]],t:"Adverbs of Manner",o:"Menjelaskan bagaimana sesuatu dilakukan.",ex:"Adverb of manner menjelaskan bagaimana suatu kegiatan dilakukan, misalnya slowly, carefully, dan well. Kebanyakan adverb dibentuk dengan menambah -ly pada kata sifat (slow menjadi slowly). Beberapa tidak beraturan: good menjadi well, sedangkan fast dan hard bentuknya tetap sama.",f:"adjective + -ly | good: well | fast: fast | hard: hard",ok:"She sings beautifully. / He drives carefully.",no:"She sings beautiful. / He drives careful.",mist:"Memakai kata sifat untuk menjelaskan kata kerja (She sings beautiful). Dalam bahasa Indonesia 'dengan indah' dan 'indah' sering sama bentuknya, tetapi bahasa Inggris membedakan adjective dan adverb.",eg:[["She walks slowly.","Dia berjalan dengan pelan."],["He speaks English very well.","Dia berbicara bahasa Inggris dengan sangat baik."],["They worked hard.","Mereka bekerja keras."]],q:[["She speaks English ___.",["good","well","goodly"],"well","Adverb dari good adalah well."],["He walked ___ into the room. (quiet)",["quiet","quietly","quietness"],"quietly","Adverb: kata sifat + -ly."],["The baby sleeps ___. (peaceful)",null,"peacefully","Peaceful menjadi peacefully."],["My brother runs very ___. (fast)",null,"fast","Fast bentuknya sama sebagai adverb."],["Which is correct?",["He drives careful.","He drives carefully.","He carefully drives the car slow."],"He drives carefully.","Adverb: carefully."]]},
{id:"a2-sh",tb:{t:"Bentuk should",h:["Bentuk","Rumus","Contoh"],r:[["Positif","should + V1","You should rest."],["Negatif","shouldn’t + V1","You shouldn’t eat too much."],["Pertanyaan","Should + subject + V1?","Should I call him?"],["Meminta saran","What should I do?","What should we buy?"]]},det:[["Untuk memberi saran","Should dipakai untuk memberi <b>saran</b> atau mengatakan bahwa sesuatu baik dilakukan: <i>You should drink more water.</i> Shouldn’t untuk saran agar tidak melakukan: <i>You shouldn’t stay up late.</i> Dalam bahasa Indonesia: 'sebaiknya' dan 'sebaiknya jangan'."],["Should vs must","<b>Should</b> hanya saran, tidak memaksa. <b>Must</b> atau <b>have to</b> berarti harus (kewajiban). Bandingkan: <i>You should see a doctor</i> (disarankan) dan <i>You must wear a seat belt</i> (wajib)."],["Cara memintanya","Untuk meminta saran: <i>What should I do?</i> dan <i>Should I take the bus?</i> Untuk memberi saran yang lebih halus, tambahkan <i>I think</i>: <i>I think you should talk to her.</i>"]],dl:[["Ayu:","I have a bad cough. What should I do?","Saya batuk parah. Apa yang sebaiknya saya lakukan?"],["Dr. Budi:","You should drink warm water and rest at home.","Sebaiknya Anda minum air hangat dan beristirahat di rumah."],["Ayu:","Should I take any medicine?","Apakah saya sebaiknya minum obat?"],["Dr. Budi:","Yes, but you shouldn’t take too much. And you shouldn’t go to work tomorrow.","Ya, tetapi jangan terlalu banyak. Dan sebaiknya Anda tidak masuk kerja besok."]],nu:["Jangan tambah -s atau to setelah should: <i>She shoulds go</i> dan <i>should to go</i> salah.","Jangan pakai should untuk kewajiban hukum atau aturan: pakai must atau have to.","Jangan pakai do atau does dengan should: <i>Do I should go?</i> salah.","Jangan pakai should untuk fakta yang pasti: itu hanya saran atau harapan."],rec:["Should + kata kerja dasar = sebaiknya.","Shouldn’t + kata kerja dasar = sebaiknya tidak.","Tanya: Should + subjek + kata kerja dasar?","Should = saran; must atau have to = kewajiban.","I think you should... membuat saran lebih halus."],eg2:[["You should study for the exam.","Kamu sebaiknya belajar untuk ujian."],["He shouldn’t drive so fast.","Dia sebaiknya tidak mengemudi secepat itu."],["Should we bring an umbrella?","Perlukah kita membawa payung?"],["I think you should talk to your teacher.","Saya rasa sebaiknya kamu bicara dengan gurumu."]],q2:[["You look tired. You ___ go to bed early. (should)",null,"should","Memberi saran: should."],["He ___ eat so much sugar. (negative advice)",null,"shouldn't","Saran untuk tidak: shouldn’t.",["should not"]],["___ I take the bus or the train?",["Should","Must","Do"],"Should","Meminta saran: Should I...?"]],t:"Should and Shouldn’t",o:"Memberi dan meminta saran.",ex:"Should dipakai untuk memberi saran atau mengatakan bahwa sesuatu baik dilakukan. Bentuknya should + kata kerja dasar untuk semua subjek. Negatif: shouldn’t. Tanya: Should + subjek + kata kerja dasar? Should lebih lembut daripada must karena hanya saran, bukan kewajiban.",f:"should + V1 | shouldn’t + V1 | Should + subject + V1?",ok:"You should rest. / You shouldn’t eat too much sugar.",no:"You should to rest. / She shoulds go.",mist:"Menambah to atau -s setelah should (should to rest, shoulds go). Should adalah modal verb, jadi bentuknya tetap dan diikuti kata kerja dasar.",eg:[["You should drink more water.","Kamu sebaiknya minum lebih banyak air."],["She shouldn’t stay up late.","Dia sebaiknya tidak begadang."],["Should I call the doctor?","Perlukah saya menelepon dokter?"]],q:[["You have a headache. You ___ rest.",["should","shoulds","should to"],"should","Saran: should + kata kerja dasar."],["Which is correct?",["She should to go.","She should go.","She shoulds go."],"She should go.","Should + kata kerja dasar."],["You ___ eat too much fast food.",["should","shouldn’t","mustn’t to"],"shouldn’t","Saran untuk tidak: shouldn’t."],["___ I call the doctor? (should)",null,"should","Meminta saran: Should I...?"],["You ___ smoke. It is bad for you. (negative advice)",null,"shouldn't","Saran untuk tidak: shouldn’t.",["should not"]]]},
{id:"a2-co",tb:{t:"Fungsi could",h:["Fungsi","Contoh","Artinya"],r:[["Kemampuan masa lalu","I could swim when I was five.","Saya bisa berenang waktu berumur lima."],["Tidak mampu di masa lalu","I couldn’t open the door.","Saya tidak bisa membuka pintu."],["Permintaan sopan","Could you help me?","Bisakah kamu membantu saya?"],["Kemungkinan","It could rain later.","Mungkin akan hujan nanti."]]},det:[["Could untuk kemampuan masa lalu","Could adalah bentuk lampau can untuk kemampuan umum: <i>When I was young, I could run fast.</i> Untuk kejadian tertentu yang berhasil, lebih lazim <i>was able to</i>: <i>I was able to finish the test yesterday.</i> Untuk negatif, <i>couldn’t</i> bisa dipakai untuk keduanya."],["Could untuk permintaan sopan","<i>Could you open the window?</i> lebih sopan daripada <i>Can you open the window?</i> Ini dipakai kepada orang yang belum dekat, atau di situasi formal. Jawabannya bisa <i>Sure</i> atau <i>Of course</i>, tanpa mengulang could."],["Could untuk kemungkinan","Could juga menyatakan kemungkinan atau saran: <i>It could rain later.</i> <i>We could go to the cinema.</i> Maknanya lebih lemah daripada will dan lebih terbuka."]],dl:[["Kasir:","Good evening. How can I help you?","Selamat malam. Ada yang bisa saya bantu?"],["Tia:","Could you tell me where the bank is?","Bisakah Anda memberi tahu di mana bank itu?"],["Kasir:","Of course. It’s next to the post office. You couldn’t miss it.","Tentu. Letaknya di sebelah kantor pos. Anda tidak mungkin melewatkannya."]],nu:["Jangan tambah -s atau to setelah could: <i>She coulds</i> dan <i>could to</i> salah.","Jangan pakai could untuk kejadian tunggal yang berhasil: pakai <i>was able to</i> (<i>I was able to find it</i>).","Jangan pakai do atau did dengan could: <i>Did you could swim?</i> salah, yang benar <i>Could you swim?</i>.","Jangan pakai can untuk permintaan yang sangat sopan atau formal: pakai could."],rec:["Could + kata kerja dasar.","Kemampuan umum di masa lalu; couldn’t = tidak bisa.","Could you...? lebih sopan daripada Can you...?","Kejadian tunggal yang berhasil: was able to.","Could juga untuk kemungkinan dan saran."],eg2:[["I could play the piano when I was ten.","Saya bisa bermain piano waktu berumur sepuluh."],["Could I use your phone, please?","Bolehkah saya memakai ponselmu?"],["We couldn’t find the hotel.","Kami tidak bisa menemukan hotelnya."],["It could be dangerous.","Itu mungkin berbahaya."]],q2:[["___ you help me with this bag, please? (polite)",["Could","Do","Did"],"Could","Permintaan sopan: Could you...?"],["I ___ swim when I was five. (could)",null,"could","Kemampuan masa lalu: could."],["We ___ find our keys yesterday. (negative)",null,"couldn't","Negatif lampau: couldn’t.",["could not"]]],t:"Could and Couldn’t",o:"Menyatakan kemampuan masa lalu dan membuat permintaan sopan.",ex:"Could dipakai untuk kemampuan di masa lalu (I could swim when I was five), permintaan sopan (Could you help me?), dan kemungkinan (It could rain). Bentuknya could + kata kerja dasar untuk semua subjek. Negatif: couldn’t atau could not. Tanya: Could + subjek + kata kerja dasar?",f:"could + V1 | couldn’t + V1 | Could + subject + V1?",ok:"I could swim at five. / Could you help me?",no:"I can swim at five. / She could to swim.",mist:"Memakai can untuk masa lalu (I can swim when I was five) dan menambah to atau -s setelah could (could to swim, coulds). Untuk masa lalu pakai could, dan setelahnya kata kerja dasar.",eg:[["I could run fast when I was young.","Saya bisa berlari cepat waktu masih muda."],["Could you open the window?","Bisakah kamu membuka jendela?"],["He couldn’t sleep last night.","Dia tidak bisa tidur tadi malam."]],q:[["When I was a child, I ___ climb trees.",["can","could","am able"],"could","Kemampuan masa lalu: could."],["___ I open the window? (polite)",["Could","Do","Am"],"Could","Permintaan sopan: Could I...?"],["Which is correct?",["She could to swim.","She could swim.","She coulds swim."],"She could swim.","Could + kata kerja dasar."],["I ___ sleep last night because it was noisy. (negative)",null,"couldn't","Negatif lampau: couldn’t.",["could not"]],["___ you speak English when you were ten? (could)",null,"could","Pertanyaan: Could you...?"]]},
{id:"a2-lk",tb:{t:"Kata kerja kesukaan + V-ing",h:["Pola","Artinya","Contoh"],r:[["like + V-ing","suka melakukan","I like reading."],["love + V-ing","sangat suka","She loves dancing."],["enjoy + V-ing","menikmati","We enjoy swimming."],["hate + V-ing","benci","He hates waiting."],["good at + V-ing","pandai","I’m good at cooking."],["interested in + V-ing","tertarik","She’s interested in drawing."]]},det:[["Pola dasar","Setelah kata kerja yang menyatakan kesukaan (like, love, enjoy, hate, don’t mind), kata kerja berikutnya biasanya berbentuk <b>V-ing</b>: <i>I like swimming.</i> Setelah preposisi, selalu V-ing: <i>good at cooking, interested in learning.</i>"],["Like + to V","Like, love, dan hate juga bisa diikuti <b>to + V1</b>, artinya hampir sama: <i>I like to swim.</i> Umumnya V-ing untuk kesukaan umum dan to + V1 untuk pilihan di situasi tertentu: <i>I like to swim in the morning.</i> Tetapi enjoy dan don’t mind hanya dengan V-ing."],["Would like dan like","<i>I like swimming</i> adalah kesukaan umum. <i>I would like to swim</i> adalah keinginan sekarang atau tawaran yang sopan. Would like diikuti to + V1, bukan V-ing."]],dl:[["Nita:","What do you like doing on weekends?","Kamu suka melakukan apa di akhir pekan?"],["Oka:","I enjoy playing football, and I love cooking for my family.","Saya suka bermain sepak bola, dan saya senang memasak untuk keluarga."],["Nita:","Are you good at cooking?","Apakah kamu pandai memasak?"],["Oka:","Not really. But I don’t mind washing the dishes!","Kurang. Tetapi saya tidak keberatan mencuci piring!"]],nu:["Jangan pakai to + V1 setelah enjoy: <i>I enjoy to read</i> salah.","Jangan pakai kata kerja dasar setelah preposisi: <i>good at cook</i> salah, yang benar <i>good at cooking</i>.","Jangan pakai V-ing setelah would like: <i>I would like swimming</i> salah, yang benar <i>I would like to swim</i>.","Jangan lupa ejaan -ing yang benar: make menjadi making, run menjadi running."],rec:["Like, love, enjoy, hate + V-ing.","Setelah preposisi, selalu V-ing.","Like, love, hate juga bisa + to V1, tetapi enjoy tidak.","Would like + to V1.","Ejaan: make menjadi making, run menjadi running."],eg2:[["My brother loves playing the guitar.","Saudara laki-laki saya suka bermain gitar."],["I hate getting up early.","Saya benci bangun pagi."],["She is interested in learning Japanese.","Dia tertarik belajar bahasa Jepang."],["Would you like to join us?","Maukah kamu bergabung dengan kami?"]],q2:[["She enjoys ___ (swim) in the sea.",null,"swimming","Enjoy + V-ing; swim menjadi swimming."],["He is good at ___ (draw).",null,"drawing","Setelah preposisi, V-ing."],["I would like ___ a coffee, please.",["to have","having","have"],"to have","Would like + to V1."]],t:"Like, Love, Hate + -ing",o:"Menyatakan kesukaan dan ketidaksukaan dengan bentuk -ing.",ex:"Setelah kata kerja yang menyatakan kesukaan (like, love, enjoy, hate), kata kerja berikutnya biasanya berbentuk V-ing: I like reading. Setelah preposisi juga selalu V-ing (good at cooking). Like, love, dan hate juga bisa diikuti to + V1, tetapi enjoy hanya dengan V-ing. Would like diikuti to + V1.",f:"like/love/enjoy/hate + V-ing | would like + to V1",ok:"I enjoy reading. / She is good at cooking.",no:"I enjoy to read. / She is good at cook.",mist:"Memakai to + V1 setelah enjoy, atau kata kerja dasar setelah preposisi (good at cook). Setelah enjoy dan preposisi, gunakan V-ing.",eg:[["I like listening to music.","Saya suka mendengarkan musik."],["She is good at drawing.","Dia pandai menggambar."],["We enjoy playing football.","Kami menikmati bermain sepak bola."]],q:[["I enjoy ___ to music.",["listen","to listen","listening"],"listening","Enjoy + V-ing."],["She hates ___ up early.",["get","getting","to getting"],"getting","Hate + V-ing."],["Which is correct?",["I would like swimming.","I would like to swim.","I would like swim."],"I would like to swim.","Would like + to V1."],["My father loves ___ (cook) on Sundays.",null,"cooking","Love + V-ing."],["I’m interested ___ learning English. (preposition)",null,"in","Interested in + V-ing."]]},
{id:"a2-cj",tb:{t:"Kata hubung dan fungsinya",h:["Kata hubung","Fungsi","Contoh"],r:[["and","menambah","I like tea and coffee."],["but","pertentangan","I like tea, but I don’t like coffee."],["or","pilihan","Do you want tea or coffee?"],["so","akibat atau hasil","I was tired, so I went to bed."],["because","alasan atau sebab","I went to bed because I was tired."],["when / while","waktu","I was sleeping when you called."]]},det:[["Menyambung dua gagasan","Kata hubung (conjunction) menyambung kata, frasa, atau kalimat agar tulisan mengalir. <b>And</b> menambah informasi, <b>but</b> menunjukkan pertentangan, <b>or</b> menawarkan pilihan. Tanpa kata hubung, kalimat terdengar pendek dan terputus-putus: <i>I am tired. I go to bed.</i> menjadi <i>I am tired, so I go to bed.</i>"],["So dan because: akibat dan sebab","<b>Because</b> diikuti sebab: <i>I stayed home because it was raining.</i> <b>So</b> diikuti akibat: <i>It was raining, so I stayed home.</i> Keduanya menjelaskan hubungan yang sama, hanya urutannya berbeda. Jangan pakai keduanya bersamaan dalam satu kalimat: <i>Because it was raining, so I stayed home</i> salah."],["Koma dan awal kalimat","Sebelum <b>but</b> dan <b>so</b> yang menyambung dua kalimat lengkap, kita biasanya memakai koma: <i>I like tea, but I don’t like coffee.</i> Because boleh di tengah (tanpa koma) atau di awal (dengan koma): <i>Because it was cold, I wore a jacket.</i>"]],dl:[["Reza:","Do you want pizza or noodles for dinner?","Kamu mau pizza atau mi untuk makan malam?"],["Nia:","I like pizza, but I’m not very hungry.","Saya suka pizza, tetapi saya tidak terlalu lapar."],["Reza:","So let’s have soup. It’s cheap and healthy.","Kalau begitu kita makan sup saja. Murah dan sehat."],["Nia:","Good idea! I’ll cook because you cooked yesterday.","Ide bagus! Saya yang memasak karena kemarin kamu yang memasak."]],nu:["Jangan pakai because dan so bersamaan: <i>Because I was tired, so I slept</i> salah.","Jangan awali kalimat dengan because sendirian tanpa kalimat utama: <i>I was late. Because the bus was late.</i> kurang tepat.","Jangan lupa koma sebelum but atau so yang menyambung dua kalimat lengkap.","Jangan pakai and untuk dua hal yang bertentangan: pakai but."],rec:["And menambah, but bertentangan, or pilihan.","So = akibat; because = sebab.","Jangan pakai because dan so dalam satu kalimat.","Koma sebelum but dan so di antara dua kalimat lengkap.","When dan while menunjukkan waktu."],eg2:[["I have a brother and a sister.","Saya punya saudara laki-laki dan saudara perempuan."],["She is smart, but she is lazy.","Dia pintar, tetapi malas."],["He was ill, so he didn’t go to school.","Dia sakit, jadi dia tidak pergi ke sekolah."],["We stayed home because it was raining.","Kami tinggal di rumah karena hujan."]],q2:[["I was hungry, ___ I ate some rice. (result)",["so","because","but"],"so","Akibat: so."],["She didn’t come ___ she was sick.",["because","so","but"],"because","Alasan: because."],["I like swimming, ___ I can’t swim well. (contrast)",null,"but","Pertentangan: but."]],t:"Conjunctions: and, but, or, so, because",o:"Menyambung gagasan dengan and, but, or, so, dan because.",ex:"Conjunction menyambung dua kata atau dua kalimat. And menambah informasi, but menunjukkan pertentangan, or memberi pilihan, so menyatakan akibat, dan because menyatakan sebab. Dengan kata hubung, kalimat terdengar lebih mengalir dan jelas.",f:"A and B | A, but B | A or B | A, so B (akibat) | A because B (sebab)",ok:"I was tired, so I went to bed. / I went to bed because I was tired.",no:"Because I was tired, so I went to bed.",mist:"Memakai because dan so bersamaan (karena ... jadi ...) seperti dalam bahasa Indonesia. Dalam bahasa Inggris pilih salah satu: because atau so.",eg:[["I like coffee and tea.","Saya suka kopi dan teh."],["He is rich, but he is not happy.","Dia kaya, tetapi tidak bahagia."],["Do you want rice or noodles?","Kamu mau nasi atau mi?"]],q:[["I was tired, ___ I went to bed early.",["so","because","or"],"so","Akibat: so."],["I went to bed early ___ I was tired.",["so","because","but"],"because","Sebab: because."],["Which is correct?",["Because it rained, so we stayed home.","Because it rained, we stayed home.","So it rained, we stayed home."],"Because it rained, we stayed home.","Pilih because atau so, jangan keduanya."],["She is poor, ___ she is happy. (contrast)",null,"but","Pertentangan: but."],["Do you want tea ___ coffee? (choice)",null,"or","Pilihan: or."]]},
{id:"a2-ps",tb:{t:"’s, s’, dan whose",h:["Bentuk","Aturan","Contoh"],r:[["’s","pemilik tunggal","Rina’s bag, my brother’s room"],["s’","pemilik jamak berakhiran s","the students’ books, my parents’ house"],["’s (jamak tak beraturan)","children’s, men’s","the children’s toys"],["of","untuk benda mati","the door of the house"],["whose","bertanya pemilik","Whose book is this?"],["Jawaban","’s atau possessive pronoun","It’s Rina’s. / It’s mine."]]},det:[["Menunjukkan pemilik dengan ’s","Untuk menunjukkan bahwa sesuatu milik seseorang, tambahkan apostrof dan s pada pemiliknya: <i>Rina’s bag</i> (tas Rina), <i>my father’s car</i> (mobil ayah saya). Urutannya berlawanan dengan bahasa Indonesia: pemilik dulu, baru bendanya."],["Pemilik jamak dan kata tak beraturan","Jika pemilik jamak berakhiran -s, cukup tambahkan apostrof: <i>the students’ books</i>. Jika jamak tak beraturan, tambahkan ’s: <i>the children’s toys, the men’s room</i>. Untuk benda mati, lebih lazim memakai of: <i>the door of the house</i> (bukan <i>the house’s door</i>)."],["Whose: menanyakan pemilik","<b>Whose</b> menanyakan siapa pemilik sesuatu: <i>Whose book is this?</i> Jawab dengan ’s atau possessive pronoun: <i>It’s Rina’s.</i> atau <i>It’s mine.</i> Hati-hati: <i>whose</i> berbeda dari <i>who’s</i> (who is atau who has)."]],dl:[["Guru:","Whose pen is this?","Pulpen siapa ini?"],["Ali:","It’s Dina’s. She forgot it yesterday.","Itu milik Dina. Kemarin dia lupa membawanya."],["Guru:","And whose bags are these?","Dan tas siapa ini?"],["Ali:","They’re the girls’ bags. The boys’ bags are over there.","Itu tas anak-anak perempuan. Tas anak-anak laki-laki ada di sana."]],nu:["Jangan pakai ’s untuk membuat jamak: <i>two book’s</i> salah, yang benar <i>two books</i>.","Jangan pakai apostrof pada kata ganti milik: <i>her’s</i> dan <i>it’s</i> (milik) salah; yang benar <i>hers</i> dan <i>its</i>.","Jangan susun kebalikan: <i>the bag Rina</i> salah, yang benar <i>Rina’s bag</i>.","Jangan campur whose dengan who’s: <i>Who’s book is this?</i> salah."],rec:["Pemilik tunggal: ’s (Rina’s bag).","Pemilik jamak berakhiran s: s’ (the students’ books).","Jamak tak beraturan: children’s, men’s.","Benda mati: pakai of (the door of the house).","Whose menanyakan pemilik; who’s = who is."],eg2:[["This is my sister’s phone.","Ini ponsel saudara perempuan saya."],["The teachers’ room is on the second floor.","Ruang guru ada di lantai dua."],["Whose umbrella is this? It’s mine.","Payung siapa ini? Itu milik saya."],["I met Tom’s mother yesterday.","Saya bertemu ibu Tom kemarin."]],q2:[["The ___ toys are on the floor. (children)",["children’s","childrens’","childrens"],"children’s","Jamak tak beraturan: children’s."],["___ coat is this? It’s mine. (whose/who’s)",null,"whose","Menanyakan pemilik: whose."],["This is the ___ room. (more than one teacher)",["teachers’","teacher’s","teachers"],"teachers’","Pemilik jamak berakhiran s: teachers’."]],t:"Possessive ’s and Whose",o:"Menunjukkan pemilik dengan ’s dan bertanya dengan whose.",ex:"Possessive ’s dipakai untuk menunjukkan pemilik: Rina’s bag. Untuk pemilik jamak berakhiran -s, cukup tambahkan apostrof (the students’ books). Whose dipakai untuk menanyakan pemilik: Whose bag is this? Urutannya pemilik dahulu, baru bendanya.",f:"owner + ’s + benda | plural owner + ’ + benda | Whose + benda + is this?",ok:"This is Rina’s bag. / Whose bag is this?",no:"This is the bag Rina. / Who’s bag is this?",mist:"Menyusun seperti bahasa Indonesia (the bag Rina). Dalam bahasa Inggris pemilik ditulis lebih dulu: Rina’s bag. Juga tertukar whose dan who’s.",eg:[["This is my brother’s room.","Ini kamar saudara laki-laki saya."],["Those are the students’ books.","Itu buku-buku para siswa."],["Whose phone is this?","Ponsel siapa ini?"]],q:[["This is ___ bag. (Rina)",["Rina’s","Rina","Rinas"],"Rina’s","Pemilik tunggal: ’s."],["___ pen is this?",["Who’s","Whose","Who"],"Whose","Menanyakan pemilik: whose."],["Which is correct?",["the bag Rina","Rina’s bag","Rina bag’s"],"Rina’s bag","Pemilik lebih dulu, lalu bendanya."],["The ___ books are on the desk. (more than one student)",null,"students’","Pemilik jamak berakhiran s: students’."],["The ___ toys are in the garden. (children)",null,"children’s","Jamak tak beraturan: children’s."]]}
]};

IC.book=IC.vocabulary;IC.pencil=IC.grammar;IC.review=IC.bolt;
const ic=(n,s=20)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]||""}</svg>`;

const KEY="knowly:v1";
function load(){
 const raw=kStorage.getItem(KEY);
 if(raw){try{return kNormalize(kParse(raw))}catch(e){kRecoveryProblem='Saved progress could not be read. A recovery copy is available in Settings → Backup.';kStorage.setItem(KEY+':recovery',raw);}}
 const defaults=kDefaults();delete defaults.writing;return defaults;
}
let S=load();
function save(){return kStorage.setItem(KEY,JSON.stringify(S))}
// All "today" calculations use Asia/Jakarta (UTC+7)
const T=()=>new Date(Date.now()+7*36e5).toISOString().slice(0,10);
const addDays=(d,n)=>new Date(Date.parse(d+"T00:00:00Z")+n*864e5).toISOString().slice(0,10);
function roll(){if(S.day.d!==T())S.day={d:T(),w:[],n:[]}}
function activity(x){const t=T();if(S.p.last!==t){try{sessionStorage.setItem("knowly:streak-new",String(Date.now()))}catch(e){}S.p.streak=S.p.last===addDays(t,-1)?S.p.streak+1:1;S.p.last=t;S.p.longest=Math.max(S.p.longest,S.p.streak)}
S.dl=S.dl||{};const dd=S.dl[t]||(S.dl[t]={w:0,l:0,q:0});if(/^(Reviewed|Marked)/.test(x))dd.w++;else if(/^(Completed lesson|Finished reading)/.test(x))dd.l++;else if(/quiz \(/.test(x))dd.q++;
S.log.unshift({t:new Date().toISOString(),x});S.log=S.log.slice(0,30)}
const streak=()=>(S.p.last===T()||S.p.last===addDays(T(),-1))?S.p.streak:0;
const streakIcon=(size=20)=>`<span class="ks-fire" aria-hidden="true">${ic('flame',size)}</span>`;
const streakDisplay=()=>`<span class="ks-streak">${streakIcon(22)}<strong>${streak()}</strong> day streak</span>`;

const words=()=>((D[S.p.level]||{v:[]}).v).concat(S.cv||[]).map(a=>({id:S.p.level+":"+a[0],word:a[0],ipa:a[1],pos:a[2],m:a[3],en:a[4],idn:a[5],topic:a[6],diff:a[7]}));
const wpOf=id=>S.wp[id]||(S.wp[id]={s:"new",f:false,n:null,rc:0,cg:0,ag:0});
const st=w=>S.wp[w.id]?S.wp[w.id].s:"new";
const isDue=w=>{const p=S.wp[w.id];return p&&p.s!=="new"&&p.n&&p.n<=T()};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function build(extra){
const ws=words(),due=ws.filter(isDue).sort((a,b)=>S.wp[a.id].n<S.wp[b.id].n?-1:1);
const quota=Math.max(0,S.p.goal-S.day.n.length)+(extra?10:0);
const nw=shuffle(ws.filter(w=>st(w)==="new")).slice(0,quota);
R={q:due.concat(nw).slice(0,30),i:0,flip:false,c:{Again:0,Hard:0,Good:0,Easy:0}}}
function review(){
if(!R)build(false);
if(!R.q.length)return`<h1>Review</h1><div class="card empty"><h2>You’re all caught up for today</h2><p class="mu">No words are due and today’s new-word goal is complete.</p><button class="btn" data-a="extra">Study extra new words</button></div>`;
if(R.i>=R.q.length){const n=R.q.length;return`<h1>Session complete</h1><div class="card"><h2>${n} cards reviewed</h2><div class="row">${Object.keys(R.c).map(k=>`<span class="chip">${k}: ${R.c[k]}</span>`).join("")}</div>
<div class="row" style="margin-top:16px"><a class="btn" href="#dashboard">Back to dashboard</a><button class="btn o" data-a="again-session">Start another session</button></div></div>`}
const w=R.q[R.i];
return`<h1>Review</h1><p class="mu">Card ${R.i+1} of ${R.q.length}</p>${bar(pct(R.i,R.q.length))}
<div class="card fc" data-a="flip" tabindex="0" role="button" aria-label="Flip card"><h3>${kHTML(w.word)}</h3><div class="ipa">${kHTML(w.ipa)}</div>
${R.flip?`<div><b>${kHTML(w.m)}</b> <span class="mu">(${kHTML(w.pos)})</span></div><div class="ex" style="text-align:left">${kHTML(w.en)}<em>${kHTML(w.idn)}</em></div>`:`<span class="mu">Tap to see the meaning</span>`}</div>
