{id:"b2-mix",t:"Mixed Conditionals",o:"Menghubungkan kondisi masa lalu dengan hasil sekarang, atau kondisi sekarang dengan hasil masa lalu.",ex:"Mixed conditional menggabungkan dua waktu berbeda. Pola umum: If + past perfect, would + V1 untuk kondisi masa lalu yang berdampak sekarang. Pola lain: If + past simple, would have + V3 untuk kondisi sekarang yang menjelaskan hasil masa lalu.",f:"Past → present: If + had + V3, would + V1 | Present → past: If + past simple, would have + V3",ok:"If I had studied medicine, I would be a doctor now.",no:"If I had studied medicine, I would have been a doctor now (jika maksudnya profesi saat ini).",mist:"Past perfect pada klausa if tidak otomatis berarti hasilnya juga memakai would have. Perhatikan apakah hasilnya terjadi sekarang atau di masa lalu.",eg:[["If she had accepted the offer, she would work in London now.","Seandainya dia menerima tawaran itu, sekarang dia akan bekerja di London."],["If I were more confident, I would have spoken at the meeting yesterday.","Seandainya saya lebih percaya diri, kemarin saya pasti sudah berbicara di rapat."],["He wouldn't be tired now if he had gone to bed earlier.","Dia tidak akan lelah sekarang jika tadi malam tidur lebih awal."]],q:[["If I had learned to drive, I ___ a car now.",["would have","would have had","would have driven"],"would have","Kondisi masa lalu memiliki hasil sekarang: would + V1."],["If she were more organised, she ___ the deadline yesterday.",["wouldn't miss","wouldn't have missed","didn't miss"],"wouldn't have missed","Kondisi sekarang menjelaskan hasil di masa lalu: would have + V3."],["If they had booked earlier, they ___ here with us now.",["would be","would have been","are"],"would be","Hasilnya sekarang, jadi gunakan would + V1."],["If I ___ taller, I would have joined the basketball team at school.",["am","were","had been"],"were","Kondisi umum/sekarang menjelaskan hasil masa lalu: if + past simple."],["Which sentence is a mixed conditional?",["If I study, I will pass.","If I had saved money, I would own a house now.","If I had studied, I would have passed."],"If I had saved money, I would own a house now.","Kondisi masa lalu dengan hasil pada masa sekarang."]]},
{id:"b2-caus",t:"Causative: Have and Get Something Done",o:"Menjelaskan bahwa kita meminta atau mengatur orang lain melakukan sesuatu untuk kita.",ex:"Gunakan have/get + object + past participle (V3) ketika seseorang melakukan layanan atau pekerjaan untuk kita. Fokusnya bukan siapa pelakunya, melainkan pekerjaan yang diatur. Get biasanya lebih informal daripada have.",f:"Subject + have/get + object + V3",ok:"I had my laptop repaired yesterday.",no:"I had repaired my laptop yesterday (jika maksudnya meminta teknisi memperbaikinya).",mist:"Jangan gunakan V1 setelah objek. Dalam causative have/get, gunakan past participle (V3).",eg:[["She is having her hair cut.","Dia sedang memotong rambutnya di salon (meminta orang lain melakukannya)."],["We got our house painted last month.","Kami meminta rumah kami dicat bulan lalu."],["I need to have these documents translated.","Saya perlu meminta dokumen-dokumen ini diterjemahkan."],["He had his wallet stolen on the train.","Dompetnya dicuri di kereta (pengalaman buruk yang dialami)."]],q:[["I need to have my phone ___.",["repair","repaired","repairing"],"repaired","Causative have + object + V3."],["They got the windows ___ yesterday.",["clean","cleaned","cleaning"],"cleaned","Get + object + V3."],["She is having her photograph ___.",["take","taken","taking"],"taken","Setelah object gunakan V3: taken."],["Which sentence means a mechanic repaired my car for me?",["I repaired my car.","I had my car repaired.","I had repaired my car."],"I had my car repaired.","Have something done berarti mengatur agar orang lain melakukan pekerjaan."],["We should get the invitation cards ___.",["print","printed","printing"],"printed","Get + object + past participle."]]},
{id:"b2-fut",t:"Future Continuous and Future Perfect",o:"Membicarakan kegiatan yang sedang berlangsung atau sudah selesai pada waktu tertentu di masa depan.",ex:"Future continuous (will be + V-ing) menekankan kegiatan yang sedang berlangsung pada waktu tertentu di masa depan. Future perfect (will have + V3) menekankan kegiatan yang sudah selesai sebelum batas waktu di masa depan.",f:"Future continuous: will be + V-ing | Future perfect: will have + V3",ok:"This time tomorrow, I will be flying to Ankara. / By June, I will have finished the course.",no:"By June, I will finished the course.",mist:"Setelah will have gunakan V3. Future perfect sering memakai by, by the time, atau before untuk menunjukkan batas waktu.",eg:[["At 8 p.m. tonight, I will be studying.","Pukul delapan malam ini, saya akan sedang belajar."],["By next Friday, she will have completed the project.","Paling lambat Jumat depan, dia akan sudah menyelesaikan proyek itu."],["Will you be using the computer this evening?","Apakah kamu akan sedang menggunakan komputer malam ini?"],["By the time you arrive, we will have prepared dinner.","Saat kamu tiba, kami akan sudah menyiapkan makan malam."]],q:[["At this time tomorrow, we ___ to Jakarta.",["will travel","will be travelling","will have travelled"],"will be travelling","Pada waktu tertentu di masa depan, gunakan future continuous."],["By 2030, scientists ___ new solutions.",["will develop","will be developing","will have developed"],"will have developed","By + batas waktu: future perfect."],["She ___ (finish) the report by Monday.",null,"will have finished","Future perfect: will have + V3."],["At 10 a.m., I ___ (take) my exam.",null,"will be taking","Future continuous: will be + V-ing."],["Which tense emphasizes completion before a future deadline?",["Future simple","Future continuous","Future perfect"],"Future perfect","Future perfect menekankan bahwa sesuatu sudah selesai sebelum batas waktu."]]},
{id:"b2-inv",t:"Inversion for Emphasis",o:"Memberi penekanan formal dengan membalik urutan auxiliary dan subjek.",ex:"Dalam bahasa formal, ungkapan negatif atau pembatas seperti never, rarely, seldom, not only, dan under no circumstances dapat diletakkan di awal kalimat. Setelahnya, gunakan inversion: auxiliary + subject + main verb. Jika tidak ada auxiliary, gunakan do/does/did.",f:"Negative expression + auxiliary + subject + verb",ok:"Never have I seen such a beautiful view.",no:"Never I have seen such a beautiful view.",mist:"Setelah ungkapan negatif di awal kalimat, jangan memakai urutan subjek + auxiliary seperti kalimat biasa.",eg:[["Rarely do we see such dedication.","Jarang sekali kita melihat dedikasi seperti itu."],["Not only did she win, but she also broke the record.","Dia bukan hanya menang, tetapi juga memecahkan rekor."],["Under no circumstances should you share your password.","Dalam keadaan apa pun kamu tidak boleh membagikan kata sandimu."],["Never have I felt so proud.","Belum pernah saya merasa sebangga ini."]],q:[["Never ___ such a challenging task.",["I have faced","have I faced","I faced"],"have I faced","Never di awal kalimat memicu inversion."],["Rarely ___ he arrive late.",["does","is","has"],"does","Kata kerja utama arrive memakai auxiliary does."],["Not only ___ they apologise, but they also offered a refund.",["they did","did","have"],"did","Not only di awal klausa memakai inversion: did + subject + V1."],["Under no circumstances ___ you open this door.",["you should","should","do"],"should","Setelah ungkapan negatif gunakan auxiliary sebelum subjek."],["Which sentence is correctly inverted?",["Seldom we see this.","Seldom do we see this.","Seldom we do see this."],"Seldom do we see this.","Pola: Seldom + do + subject + V1."]]},
{id:"b2-part",t:"Participle Clauses",o:"Meringkas kalimat dengan menggunakan present atau past participle.",ex:"Participle clauses membuat tulisan lebih ringkas. Present participle (V-ing) biasanya menunjukkan tindakan aktif atau yang berlangsung bersamaan. Past participle (V3) biasanya menunjukkan makna pasif. Perfect participle (having + V3) menekankan bahwa satu tindakan selesai lebih dahulu.",f:"Active: V-ing | Passive: V3 | Earlier action: Having + V3",ok:"Walking home, I met an old friend. / Built in 1920, the bridge is still in use.",no:"Walking home, the rain started (subjek penggantung tidak cocok).",mist:"Pastikan pelaku pada participle clause sama dengan subjek klausa utama. Jika tidak, kalimat dapat memiliki dangling participle.",eg:[["Feeling tired, she went to bed early.","Karena merasa lelah, dia tidur lebih awal."],["Designed by a local artist, the building attracts visitors.","Dirancang oleh seniman lokal, bangunan itu menarik pengunjung."],["Having finished the report, he sent it to his manager.","Setelah menyelesaikan laporan, dia mengirimkannya kepada manajernya."],["Seen from above, the island looks like a heart.","Jika dilihat dari atas, pulau itu tampak seperti hati."]],q:[["___ the instructions, she began the task.",["Reading","Having read","Reads"],"Having read","Having + V3 menandakan tindakan selesai lebih dahulu."],["___ by experts, the plan was approved.",["Reviewing","Reviewed","Having review"],"Reviewed","Past participle menunjukkan makna pasif."],["___ nervous, he spoke very slowly.",["Feeling","Felt","Having feel"],"Feeling","V-ing menunjukkan keadaan aktif yang dialami subjek."],["Which sentence has a correct participle clause?",["Driving to work, the rain started.","Driving to work, I heard the news.","Driven to work, I heard the news."],"Driving to work, I heard the news.","Subjek participle clause dan klausa utama harus sama: I."],["___ the meeting, they went for lunch.",["Finishing","Having finished","Finished"],"Having finished","Perfect participle menunjukkan rapat selesai sebelum mereka makan siang."]]},
{id:"b2-cleft",t:"Cleft Sentences for Emphasis",o:"Menekankan bagian tertentu dari kalimat, seperti orang, waktu, tempat, atau alasan.",ex:"Cleft sentence membagi satu informasi menjadi dua bagian agar satu bagian lebih menonjol. Pola it-cleft: It is/was + bagian yang ditekankan + that/who. Pola what-cleft: What + clause + is/was + informasi utama.",f:"It-cleft: It is/was + focus + that/who ... | What-cleft: What + clause + is/was ...",ok:"It was Rina who organised the event. / What I need is more time.",no:"It was Rina which organised the event.",mist:"Gunakan who untuk orang dan that untuk benda/hal pada pola it-cleft. Perhatikan juga kesesuaian waktu: is untuk sekarang, was untuk masa lalu.",eg:[["It was the manager who made the final decision.","Manajerlah yang membuat keputusan akhir."],["It is patience that helps us improve.","Kesabaranlah yang membantu kita berkembang."],["What I enjoy most is learning new things.","Hal yang paling saya nikmati adalah mempelajari hal baru."],["What the team needs is clear communication.","Yang dibutuhkan tim adalah komunikasi yang jelas."]],q:[["It was my teacher ___ encouraged me to apply.",["which","who","where"],"who","Who digunakan untuk orang."],["___ I need is a little more time.",["That","What","Which"],"What","Pola what-cleft: What + clause + is + fokus."],["It is practice ___ makes progress possible.",["who","where","that"],"that","That digunakan untuk menekankan hal atau benda."],["Which sentence emphasises the person who called?",["It was Maya who called.","Maya called yesterday.","What Maya did was call."],"It was Maya who called.","It-cleft menonjolkan Maya sebagai orang yang menelepon."],["What surprised us ___ the final result.",["were","was","be"],"was","Subjek what-clause diperlakukan sebagai satu hal: was."]]},
{id:"b2-modperf",t:"Modal Perfects: Must Have, Might Have, Should Have",o:"Menyimpulkan, menyatakan kemungkinan, atau mengkritik kejadian masa lalu.",ex:"Modal perfect memakai modal + have + V3. Must have menyatakan kesimpulan kuat tentang masa lalu. Might/may/could have menyatakan kemungkinan. Can't have menyatakan sesuatu hampir pasti tidak terjadi. Should have menyatakan sesuatu yang seharusnya dilakukan, sering kali sebagai kritik atau penyesalan.",f:"Modal + have + V3",ok:"She must have forgotten the meeting. / You should have called me.",no:"She must has forgotten the meeting.",mist:"Setelah modal gunakan have, bukan has atau had. Kata kerja berikutnya harus berbentuk V3.",eg:[["They must have taken the wrong bus.","Mereka pasti naik bus yang salah."],["He might have missed the email.","Mungkin dia melewatkan email itu."],["You should have checked the information first.","Seharusnya kamu memeriksa informasinya terlebih dahulu."],["She can't have finished already; she only started ten minutes ago.","Tidak mungkin dia sudah selesai; dia baru mulai sepuluh menit lalu."]],q:[["The lights are on. They ___ arrived home.",["must have","must has","must had"],"must have","Must have + V3 untuk kesimpulan kuat tentang masa lalu."],["I am not sure, but he ___ forgotten the appointment.",["should have","might have","can't have"],"might have","Might have menyatakan kemungkinan."],["You ___ told me about the change. I was waiting.",["should have","must have","can't have"],"should have","Should have menyatakan sesuatu yang seharusnya dilakukan."],["She ___ taken the keys; she was abroad that week.",["must have","can't have","should have"],"can't have","Can't have menyatakan kesimpulan bahwa sesuatu hampir pasti tidak terjadi."],["After a modal perfect, use ___.",["V1","V2","V3"],"V3","Polanya modal + have + past participle (V3)."]]}

{id:"b2-subj",t:"The Subjunctive in Formal English",o:"Menggunakan bentuk formal setelah ungkapan saran, tuntutan, atau keharusan.",ex:"Dalam bahasa Inggris formal, beberapa kata kerja dan ungkapan seperti suggest, recommend, insist, essential, dan important dapat diikuti that + subject + base verb. Bentuk ini disebut subjunctive. Kata kerja tetap bentuk dasar, termasuk setelah he, she, atau it.",f:"Verb/adjective + that + subject + base verb",ok:"The teacher suggested that he study more.",no:"The teacher suggested that he studies more.",mist:"Dalam subjunctive formal, jangan menambahkan -s pada kata kerja orang ketiga. Bentuknya tetap base verb: that he study, bukan that he studies.",eg:[["They recommended that she apply for the scholarship.","Mereka menyarankan agar dia mendaftar beasiswa."],["It is essential that every student be informed.","Penting agar setiap siswa diberi informasi."],["The manager insisted that the report be completed today.","Manajer bersikeras agar laporan itu diselesaikan hari ini."],["I suggest that he take a short break.","Saya menyarankan agar dia beristirahat sebentar."]],q:[["The doctor recommended that he ___ more water.",["drinks","drink","drank"],"drink","Setelah recommend that, gunakan base verb dalam subjunctive."],["It is important that everyone ___ on time.",["is","be","being"],"be","Subjunctive formal memakai be untuk semua subjek."],["They insisted that the meeting ___ postponed.",["is","be","was"],"be","Pola formal: insist that + subject + be + V3."],["Which sentence uses the subjunctive correctly?",["She suggested that he goes.","She suggested that he go.","She suggested that he went."],"She suggested that he go.","Setelah suggest that, gunakan base verb."],["The committee requested that the form ___ submitted today.",["is","be","was"],"be","Passive subjunctive: be + V3."]]}],A1:[
{id:"a1-be",dl:[["Dina:","Hi, I’m Dina. Are you a new student?","Hai, saya Dina. Apakah kamu murid baru?"],["Tomi:","Yes, I am. My name is Tomi. I’m from Surabaya.","Ya, benar. Namaku Tomi. Saya dari Surabaya."],["Dina:","How old are you?","Berapa umurmu?"],["Tomi:","I’m fifteen. And you?","Saya lima belas. Kamu?"],["Dina:","I’m fifteen too. We are in the same class!","Saya juga lima belas. Kita sekelas!"]],nu:["Jangan pakai to be bersama kata kerja biasa: <i>I am go to school</i> salah, yang benar <i>I go to school</i> (kecuali kegiatan yang sedang berlangsung: <i>I am going</i>).","Jangan pakai have untuk usia: <i>I have 20 years</i> salah, yang benar <i>I am 20</i>.","Jangan pakai do atau does bersama to be: <i>Do you are tired?</i> salah, yang benar <i>Are you tired?</i>.","Jangan menghilangkan to be: <i>She teacher</i> salah, yang benar <i>She is a teacher</i>."],tb:{t:"Bentuk to be",h:["Subjek","Positif","Negatif","Pertanyaan"],r:[["I","I am","I am not","Am I...?"],["you","you are","you are not (aren’t)","Are you...?"],["he / she / it","is","is not (isn’t)","Is he...?"],["we / they","are","are not (aren’t)","Are they...?"]]},det:[["Kenapa to be wajib ada?","Dalam bahasa Indonesia kita bisa bilang 'Dia guru' tanpa kata 'adalah'. Dalam bahasa Inggris kalimat harus punya kata kerja, dan untuk menyatakan identitas, keadaan, atau tempat, kata kerjanya adalah to be. Jadi 'Dia guru' menjadi <i>She is a teacher</i>, 'Saya lelah' menjadi <i>I am tired</i>, dan 'Mereka di rumah' menjadi <i>They are at home</i>."],["Tiga pemakaian utama","1) Identitas atau pekerjaan: <i>I am a student.</i> 2) Keadaan atau sifat: <i>She is happy.</i> 3) Tempat: <i>We are in Jakarta.</i> Selain itu, to be dipakai untuk usia: <i>I am twenty years old</i> (bukan <i>I have twenty years</i>)."],["Singkatan dalam percakapan","I am menjadi I’m, you are menjadi you’re, he is menjadi he’s, she is menjadi she’s, it is menjadi it’s, we are menjadi we’re, dan they are menjadi they’re. Dalam tulisan formal, bentuk lengkap lebih umum."]],rec:["I memakai am, he/she/it memakai is, you/we/they memakai are.","Negatif: tambahkan not setelah to be.","Pertanyaan: pindahkan to be ke depan subjek.","To be wajib ada, tidak boleh dihilangkan seperti di bahasa Indonesia.","Usia memakai to be: I am 20."],eg2:[["I’m tired today.","Saya lelah hari ini."],["She isn’t at home.","Dia tidak ada di rumah."],["Are they your friends?","Apakah mereka teman-temanmu?"],["I am twenty years old.","Saya berusia dua puluh tahun."]],q2:[["How old ___ you?",["is","are","am"],"are","You memakai are, dan usia ditanyakan dengan to be."],["They ___ at school now.",null,"are","They memakai are."],["My sister ___ not at home.",null,"is","My sister sama dengan she, jadi is not."]],t:"To Be: am, is, are",o:"Memakai am, is, dan are untuk memperkenalkan diri dan menjelaskan sesuatu.",ex:"To be (am, is, are) berarti 'adalah' atau 'berada'. Dalam bahasa Indonesia kata ini sering dihilangkan, tetapi dalam bahasa Inggris wajib ada. I memakai am, he/she/it memakai is, dan you/we/they memakai are. Bentuk negatif: tambahkan not (I am not, he is not). Bentuk tanya: pindahkan to be ke depan (Are you a student?).",f:"I am | He/She/It is | You/We/They are",ok:"She is a teacher.",no:"She a teacher.",mist:"Lupa memakai to be karena dalam bahasa Indonesia cukup 'Dia guru' tanpa 'adalah'. Dalam bahasa Inggris harus ada: She is a teacher.",eg:[["I am a student.","Saya seorang pelajar."],["They are at home.","Mereka ada di rumah."],["Is he your brother?","Apakah dia saudara laki-lakimu?"]],q:[["I ___ from Indonesia.",["is","am","are"],"am","Subjek I memakai am."],["She ___ a doctor.",["are","am","is"],"is","Subjek she memakai is."],["We ___ students. (to be)",null,"are","Subjek we memakai are."],["___ you tired? (to be)",null,"are","Pertanyaan dengan you: Are you...?"],["Which sentence is correct?",["He a student.","He is a student.","He are a student."],"He is a student.","He memakai is, dan to be wajib ada."]]},
{id:"a1-ps",dl:[["Rani:","What time do you get up every day?","Jam berapa kamu bangun setiap hari?"],["Eko:","I get up at five. My mother cooks breakfast at six.","Saya bangun jam lima. Ibu saya memasak sarapan jam enam."],["Rani:","Does your father work?","Apakah ayahmu bekerja?"],["Eko:","Yes, he does. He works in a bank. He doesn’t work on Sundays.","Ya, bekerja. Dia bekerja di bank. Dia tidak bekerja pada hari Minggu."]],nu:["Jangan pakai present simple untuk kegiatan yang sedang berlangsung sekarang: <i>I eat now</i> kurang tepat, pakai <i>I am eating now</i> (present continuous).","Jangan tambahkan -s setelah does atau doesn’t: <i>Does she works?</i> salah.","Jangan tambahkan -s untuk I, you, we, dan they: <i>They plays</i> salah.","Jangan pakai present simple untuk kejadian yang sudah selesai: <i>I go yesterday</i> salah, pakai past simple."],tb:{t:"Penambahan -s / -es untuk he, she, it",h:["Aturan","Contoh"],r:[["Kebanyakan kata kerja: tambah -s","work menjadi works, play menjadi plays"],["Berakhir -s, -sh, -ch, -x, -o: tambah -es","watch menjadi watches, go menjadi goes, wash menjadi washes"],["Konsonan + y: ubah y menjadi -ies","study menjadi studies, try menjadi tries"],["Tidak beraturan","have menjadi has"]]},det:[["Kapan present simple dipakai?","Present simple dipakai untuk (1) kebiasaan: <i>I get up at six.</i> (2) fakta: <i>The sun rises in the east.</i> (3) jadwal tetap: <i>The class starts at eight.</i> Kata penanda yang sering muncul: every day, always, usually, often, sometimes, never, dan on Mondays."],["Mengapa he/she/it dapat -s?","Hanya untuk orang ketiga tunggal (he, she, it, atau satu nama seperti Rina dan my father), kata kerja diberi akhiran -s atau -es. Untuk I, you, we, dan they, kata kerjanya tetap bentuk dasar. Jadi <i>I work</i> tetapi <i>she works</i>."],["Negatif dan pertanyaan","Gunakan do atau does sebagai kata bantu. Karena does sudah membawa tanda orang ketiga, kata kerja utamanya kembali ke bentuk dasar: <i>She doesn’t work</i> (bukan <i>doesn’t works</i>) dan <i>Does she work?</i> (bukan <i>Does she works?</i>)."]],rec:["I/you/we/they: kata kerja dasar; he/she/it: tambah -s atau -es.","Negatif: do not (don’t) atau does not (doesn’t) + kata kerja dasar.","Pertanyaan: Do atau Does + subjek + kata kerja dasar.","Setelah does atau doesn’t, tidak ada -s lagi.","Penanda: every day, always, usually, often, sometimes, never."],eg2:[["My father works in an office.","Ayah saya bekerja di kantor."],["She studies English every night.","Dia belajar bahasa Inggris setiap malam."],["We don’t eat meat.","Kami tidak makan daging."],["Does your brother play football?","Apakah saudaramu bermain sepak bola?"]],q2:[["He ___ English every day. (study)",null,"studies","Konsonan + y menjadi -ies untuk he."],["My sister ___ TV in the evening. (watch)",null,"watches","Berakhir -ch, tambah -es."],["Does she ___ tea? (like)",null,"like","Setelah does, kata kerja dasar."]],t:"Present Simple",o:"Membicarakan kebiasaan dan fakta sehari-hari.",ex:"Present simple dipakai untuk kebiasaan, fakta, dan jadwal tetap. Untuk I, you, we, dan they pakai kata kerja dasar (I work). Untuk he, she, dan it tambahkan -s atau -es (she works, he watches). Bentuk negatif memakai do not atau does not + kata kerja dasar. Bentuk tanya memakai Do atau Does di depan, dan kata kerjanya kembali ke bentuk dasar.",f:"I/you/we/they + V1 | he/she/it + V1-s | do/does + not + V1",ok:"She works in a bank. / He doesn’t like coffee.",no:"She work in a bank. / He doesn’t likes coffee.",mist:"Lupa menambah -s untuk he/she/it, dan menambah -s lagi setelah does (He doesn’t likes). Setelah do atau does, kata kerja kembali ke bentuk dasar.",eg:[["I get up at six every day.","Saya bangun jam enam setiap hari."],["She drinks tea in the morning.","Dia minum teh di pagi hari."],["Do you like rice?","Apakah kamu suka nasi?"]],q:[["He ___ to school by bus.",["go","goes","going"],"goes","He memakai kata kerja dengan -es (goes)."],["They ___ football on Sundays.",["plays","play","playing"],"play","They memakai kata kerja dasar."],["My mother ___ (cook) every evening.",null,"cooks","My mother = she, jadi tambahkan -s."],["She doesn’t ___ (like) coffee.",null,"like","Setelah doesn’t, kata kerja kembali ke bentuk dasar."],["Which sentence is correct?",["Does he likes tea?","Does he like tea?","Do he like tea?"],"Does he like tea?","He memakai Does, dan kata kerja bentuk dasar."]]},
{id:"a1-tt",dl:[["Dewi:","Excuse me, is there a bank near here?","Permisi, apakah ada bank di dekat sini?"],["Pak Adi:","Yes, there is. There is a bank next to the post office.","Ya, ada. Ada bank di sebelah kantor pos."],["Dewi:","Are there any shops on this street?","Apakah ada toko di jalan ini?"],["Pak Adi:","Yes, there are many shops, but there isn’t a market.","Ya, ada banyak toko, tetapi tidak ada pasar."]],nu:["Jangan pakai there is atau there are untuk menyatakan kepemilikan: <i>There is a car in my house</i> artinya ada mobil di rumah, bukan 'saya punya mobil'. Untuk kepemilikan pakai <i>I have a car</i>.","Jangan pakai there is atau there are dengan benda yang sudah spesifik: <i>There is my book on the table</i> salah, pakai <i>My book is on the table</i>.","Jangan pakai are untuk benda tunggal (<i>There are a book</i> salah) atau is untuk benda jamak (<i>There is two books</i> salah)."],tb:{t:"There is / There are",h:["Bentuk","Tunggal atau tak terhitung","Jamak"],r:[["Positif","There is a book.","There are two books."],["Negatif","There isn’t a book.","There aren’t any books."],["Pertanyaan","Is there a book?","Are there any books?"],["Jawaban singkat","Yes, there is. / No, there isn’t.","Yes, there are. / No, there aren’t."]]},det:[["Apa bedanya dengan to be biasa?","There is dan there are dipakai untuk menyatakan <b>keberadaan</b>: sesuatu ada di suatu tempat. Bahasa Indonesia memakai kata 'ada'. Contoh: <i>Ada kucing di kebun</i> menjadi <i>There is a cat in the garden.</i> Kata there di sini tidak berarti 'di sana', tetapi hanya pembuka kalimat."],["Cara memilih is atau are","Lihat benda yang <b>muncul setelahnya</b>, bukan kata there. Satu benda atau benda tak terhitung (water, rice) memakai is. Dua benda atau lebih memakai are: <i>There is some rice</i> dan <i>There are three eggs</i>. Kalau ada daftar, ikuti benda pertama: <i>There is a pen and two books</i>."],["Memakai some dan any","Kalimat positif: <i>There are some apples.</i> Kalimat negatif dan pertanyaan: <i>There aren’t any apples. Are there any apples?</i> (lihat juga pelajaran Some and Any)."]],rec:["There is + benda tunggal atau tak terhitung.","There are + benda jamak.","Negatif: there isn’t atau there aren’t (+ any).","Pertanyaan: Is there...? atau Are there...? (+ any).","Pilih is atau are dari benda yang muncul setelahnya."],eg2:[["There is some water in the bottle.","Ada sedikit air di dalam botol."],["There aren’t any chairs in the room.","Tidak ada kursi sama sekali di ruangan itu."],["Are there any shops near here?","Apakah ada toko di dekat sini?"],["There is a pen and two books on the desk.","Ada sebuah pulpen dan dua buku di atas meja."]],q2:[["There ___ some rice in the pot.",["is","are","am"],"is","Rice tidak bisa dihitung, jadi there is."],["___ there any eggs in the fridge?",null,"are","Eggs jamak, jadi Are there...?"],["There ___ any milk. (negative)",null,"isn't","Milk tak terhitung, negatifnya there isn’t any.",["is not"]]],t:"There is and There are",o:"Menyatakan bahwa sesuatu ada di suatu tempat.",ex:"There is dan there are dipakai untuk menyatakan sesuatu ada di suatu tempat. There is untuk benda tunggal atau tak terhitung (There is a book on the table). There are untuk benda jamak (There are two chairs). Bentuk negatif: there isn’t atau there aren’t. Bentuk tanya: Is there...? atau Are there...?",f:"There is + tunggal | There are + jamak",ok:"There are three books on the table.",no:"There is three books on the table.",mist:"Memakai there is untuk benda jamak. Lihat bendanya: satu memakai is, lebih dari satu memakai are.",eg:[["There is a cat under the chair.","Ada seekor kucing di bawah kursi."],["There are many students in the class.","Ada banyak pelajar di kelas."],["Is there a bank near here?","Apakah ada bank di dekat sini?"]],q:[["There ___ a book on the desk.",["are","is","am"],"is","A book itu tunggal, jadi there is."],["There ___ five people in the room.",["is","are","be"],"are","Five people itu jamak, jadi there are."],["___ there a shop near here?",null,"is","A shop itu tunggal, jadi Is there...?"],["There ___ two cats in the garden.",null,"are","Two cats itu jamak, jadi there are."],["Which is correct?",["There is two chairs.","There are two chairs.","There be two chairs."],"There are two chairs.","Two chairs itu jamak, jadi there are."]]},
{id:"a1-ar",tb:{t:"Kapan memakai a, an, the, atau tanpa artikel?",h:["Artikel","Dipakai untuk","Contoh"],r:[["a","benda tunggal, bunyi konsonan, belum spesifik","a book, a teacher, a university"],["an","benda tunggal, bunyi vokal, belum spesifik","an apple, an hour, an umbrella"],["the","benda yang sudah jelas atau sudah disebut","the book on the table, the sun"],["(tanpa artikel)","jamak, tak terhitung, atau hal umum","I like books. I drink water."]]},det:[["Mengapa ada artikel?","Bahasa Indonesia tidak punya artikel, tetapi bahasa Inggris hampir selalu memakainya di depan kata benda tunggal yang bisa dihitung. A dan an berarti 'satu' atau 'salah satu' dan dipakai saat pertama kali menyebut sesuatu. The dipakai saat pembicara dan pendengar sudah tahu benda mana yang dimaksud."],["a atau an? Dengar bunyinya","Pilihan a atau an ditentukan oleh <b>bunyi</b> awal kata, bukan hurufnya. An dipakai sebelum bunyi vokal: <i>an egg, an orange, an hour</i> (h tidak dibaca). A dipakai sebelum bunyi konsonan: <i>a university</i> (dibaca 'yuniversiti', awalnya bunyi y) dan <i>a house</i>."],["Disebut pertama a, selanjutnya the","Saat pertama kali menyebut sesuatu, pakai a atau an: <i>I have a cat.</i> Setelah itu benda yang sama menjadi sudah jelas, jadi pakai the: <i>The cat is black.</i> Pakai the juga untuk benda yang hanya ada satu: <i>the sun, the moon, the sky</i>."]],dl:[["Ina:","I have a new phone and an old laptop.","Saya punya ponsel baru dan laptop lama."],["Dani:","Is the phone expensive?","Apakah ponselnya mahal?"],["Ina:","No. I bought it at a small shop near the station.","Tidak. Saya membelinya di toko kecil dekat stasiun."]],nu:["Jangan pakai a atau an dengan benda jamak: <i>a books</i> salah, yang benar <i>books</i>.","Jangan pakai a atau an dengan benda tak terhitung: <i>a water</i> salah, yang benar <i>some water</i> atau <i>a glass of water</i>.","Tidak pakai artikel untuk hal umum: <i>I like music</i>, bukan <i>I like the music</i> (kecuali musik tertentu).","Tidak pakai artikel untuk nama orang dan kebanyakan nama kota: <i>Rina lives in Bandung</i>."],rec:["A sebelum bunyi konsonan, an sebelum bunyi vokal.","Pertama kali disebut: a atau an. Sudah jelas: the.","Benda jamak dan tak terhitung tidak memakai a atau an.","Benda yang hanya ada satu (the sun, the moon) memakai the.","Pilih a atau an dari bunyi, bukan huruf: an hour, a university."],eg2:[["She is an engineer.","Dia seorang insinyur."],["I need a pen. Where is the pen?","Saya butuh pulpen. Di mana pulpennya?"],["The moon is beautiful tonight.","Bulannya indah malam ini."],["He wants an ice cream.","Dia ingin sebuah es krim."]],q2:[["I saw ___ elephant at the zoo.",["a","an","the"],"an","Elephant diawali bunyi vokal, jadi an."],["___ sun is very hot today.",["A","An","The"],"The","Matahari hanya ada satu, jadi the."],["She goes to ___ university in Jakarta. (a/an)",null,"a","University dibaca 'yuniversiti' (bunyi y), jadi a."]],t:"Articles: a, an, the",o:"Memakai a, an, dan the dengan benar.",ex:"A dan an dipakai untuk benda tunggal yang disebut pertama kali atau belum spesifik. A dipakai sebelum bunyi konsonan (a book), sedangkan an sebelum bunyi vokal (an apple). The dipakai untuk benda yang sudah jelas atau sudah disebut sebelumnya (Close the door). Benda jamak dan tak terhitung tidak memakai a atau an.",f:"a + bunyi konsonan | an + bunyi vokal | the + benda yang sudah jelas",ok:"I have an orange and a banana.",no:"I have a orange and an banana.",mist:"Bahasa Indonesia tidak punya artikel, jadi sering lupa memakainya. Ingat juga pilihan a atau an ditentukan oleh bunyi, bukan huruf: an hour, a university.",eg:[["She has a cat. The cat is white.","Dia punya seekor kucing. Kucing itu berwarna putih."],["I eat an apple every day.","Saya makan sebuah apel setiap hari."],["Open the window, please.","Tolong buka jendelanya."]],q:[["I have ___ umbrella.",["a","an","the"],"an","Umbrella diawali bunyi vokal, jadi an."],["He is ___ teacher.",["a","an","the"],"a","Teacher diawali bunyi konsonan, jadi a."],["She has a dog. ___ dog is very small.",["A","The","An"],"The","Anjing itu sudah disebut sebelumnya, jadi the."],["I eat ___ egg every morning. (a/an)",null,"an","Egg diawali bunyi vokal, jadi an."],["It takes ___ hour to get there. (a/an)",null,"an","Hour dibaca tanpa bunyi h, jadi diawali bunyi vokal dan memakai an."]]},
{id:"a1-cn",tb:{t:"Bentuk can",h:["Bentuk","Rumus","Contoh"],r:[["Positif","subject + can + V1","She can swim."],["Negatif","subject + can’t / cannot + V1","He can’t drive."],["Pertanyaan","Can + subject + V1?","Can you help me?"],["Jawaban singkat","Yes, I can. / No, I can’t.","Can she cook? Yes, she can."]]},det:[["Dua fungsi can","1) <b>Kemampuan:</b> <i>I can swim.</i> (saya bisa berenang). 2) <b>Izin atau permintaan:</b> <i>Can I use your pen?</i> (bolehkah saya memakai pulpenmu?). Untuk permintaan yang lebih sopan dipakai could atau may, tetapi can sudah cukup dalam percakapan sehari-hari."],["Can termasuk modal verb","Can adalah <b>modal verb</b>: bentuknya tidak berubah untuk semua subjek (tidak ada cans) dan setelahnya langsung kata kerja dasar tanpa to. Karena itu <i>She can swims</i> dan <i>She can to swim</i> keduanya salah. Untuk pertanyaan dan negatif, tidak perlu do atau does."],["Can dan can’t dalam ucapan","Can’t (cannot) berarti tidak bisa atau tidak boleh. Dalam ucapan, can yang tidak ditekan terdengar pendek, sedangkan can’t terdengar jelas dan panjang. Kalau ragu, perhatikan konteks kalimatnya."]],dl:[["Sari:","Can you play the guitar?","Bisakah kamu bermain gitar?"],["Reza:","Yes, I can. But I can’t sing well.","Ya, bisa. Tetapi saya tidak bisa bernyanyi dengan baik."],["Sari:","Can you help me with my homework?","Bisakah kamu membantuku mengerjakan PR?"],["Reza:","Sure, I can help you after lunch.","Tentu, aku bisa membantumu setelah makan siang."]],nu:["Jangan tambah -s setelah can: <i>She can swims</i> salah.","Jangan tambah to setelah can: <i>I can to swim</i> salah.","Jangan pakai do atau does bersama can: <i>Do you can swim?</i> salah, yang benar <i>Can you swim?</i>.","Untuk kemampuan di masa lalu, jangan pakai can: pakai could (<i>I could swim when I was five</i>)."],rec:["Can + kata kerja dasar, tanpa to dan tanpa -s.","Negatif: can’t atau cannot. Tanya: Can + subjek + kata kerja?","Dipakai untuk kemampuan dan meminta izin.","Tidak pakai do atau does bersama can.","Kemampuan masa lalu memakai could."],eg2:[["My brother can speak three languages.","Saudara laki-laki saya bisa berbicara tiga bahasa."],["I can’t find my keys.","Saya tidak bisa menemukan kunci saya."],["Can I open the window?","Bolehkah saya membuka jendela?"],["They can’t come tonight.","Mereka tidak bisa datang malam ini."]],q2:[["___ I use your phone, please?",["Can","Do","Am"],"Can","Meminta izin memakai Can."],["My grandmother ___ use a computer. (negative)",null,"can't","Negatif can adalah can’t atau cannot.",["cannot","can not"]],["Can your sister ___? (swim)",null,"swim","Setelah can, kata kerja dasar."]],t:"Can and Can’t",o:"Menyatakan kemampuan dan meminta izin.",ex:"Can dipakai untuk menyatakan kemampuan atau meminta izin. Bentuknya sama untuk semua subjek, dan kata kerja setelahnya berbentuk dasar tanpa to. Bentuk negatifnya can’t atau cannot. Untuk bertanya, pindahkan can ke depan (Can you swim?).",f:"Subject + can/can’t + V1",ok:"She can swim. / Can you help me?",no:"She can swims. / She can to swim.",mist:"Menambah -s setelah can (She can swims), menambah to (can to swim), atau memakai do/does bersama can. Setelah can langsung kata kerja dasar.",eg:[["I can speak English a little.","Saya bisa berbahasa Inggris sedikit."],["He can’t drive a car.","Dia tidak bisa mengemudi mobil."],["Can I use your phone?","Bolehkah saya memakai ponselmu?"]],q:[["She ___ play the guitar.",["cans","can","can to"],"can","Can tidak berubah dan diikuti kata kerja dasar."],["Which sentence is correct?",["He can swims.","He can swim.","He can to swim."],"He can swim.","Setelah can, kata kerja dasar tanpa -s dan tanpa to."],["I ___ speak French. (negative)",null,"can't","Bentuk negatif can adalah can’t atau cannot.",["cannot","can not"]],["___ you help me, please?",null,"can","Pertanyaan dengan can: Can you...?"],["Can I sit here? is asking for...",["permission","the weather","the time"],"permission","Can juga dipakai untuk meminta izin."]]},
{id:"a1-pc",tb:{t:"Bentuk present continuous",h:["Bentuk","Rumus","Contoh"],r:[["Positif","am/is/are + V-ing","I am eating."],["Negatif","am/is/are + not + V-ing","She isn’t sleeping."],["Pertanyaan","Am/Is/Are + subject + V-ing?","Are you studying?"],["Jawaban singkat","Yes, I am. / No, he isn’t.","Is it raining? Yes, it is."]]},det:[["Kapan dipakai?","Present continuous dipakai untuk (1) kegiatan yang <b>sedang berlangsung sekarang</b>: <i>I am studying.</i> (2) kegiatan sementara di masa-masa ini: <i>She is learning English this month.</i> (3) rencana dekat yang sudah diatur: <i>We are visiting my aunt tomorrow.</i> Penandanya: now, at the moment, today, right now, look!, dan listen!"],["Cara menambah -ing","Kebanyakan kata kerja cukup ditambah -ing: <i>play menjadi playing</i>. Kata kerja berakhir -e, hilangkan e: <i>make menjadi making</i>. Kata kerja pendek dengan pola konsonan-vokal-konsonan, gandakan konsonan terakhir: <i>run menjadi running, sit menjadi sitting</i>."],["Beda dengan present simple","Present simple untuk kebiasaan: <i>I drink coffee every morning.</i> Present continuous untuk yang sedang terjadi: <i>I am drinking coffee now.</i> Bahasa Indonesia memakai kata 'sedang' untuk yang kedua."]],dl:[["Ibu:","Where are you, Tina? What are you doing?","Kamu di mana, Tina? Kamu sedang apa?"],["Tina:","I’m in my room. I’m doing my homework.","Aku di kamarku. Aku sedang mengerjakan PR."],["Ibu:","Is your brother studying too?","Apakah kakakmu juga sedang belajar?"],["Tina:","No, he isn’t. He’s playing games.","Tidak. Dia sedang bermain gim."]],nu:["Jangan pakai untuk kebiasaan atau fakta: <i>I am going to school every day</i> kurang tepat, pakai <i>I go to school every day</i>.","Jangan lupa to be: <i>She reading</i> salah, yang benar <i>She is reading</i>.","Beberapa kata kerja tidak lazim dipakai dalam bentuk -ing karena menyatakan keadaan: know, like, love, want, need. Katakan <i>I know the answer</i> (bukan <i>I am knowing</i>).","Jangan pakai kata kerja dasar setelah to be: <i>She is read</i> salah."],rec:["Rumus: am/is/are + V-ing.","Untuk kegiatan yang sedang berlangsung sekarang.","Penanda: now, at the moment, look!, listen!","Kata kerja keadaan (know, like, want) tidak dipakai dalam bentuk -ing.","Ejaan: make menjadi making, run menjadi running."],eg2:[["The children are playing in the garden.","Anak-anak sedang bermain di kebun."],["I’m not watching TV now.","Saya tidak sedang menonton TV sekarang."],["What are you doing?","Kamu sedang apa?"],["It is raining. Take an umbrella.","Sedang hujan. Bawa payung."]],q2:[["She ___ a letter now. (write)",null,"is writing","Write berakhir -e, hilangkan e lalu tambah -ing."],["They ___ TV at the moment. (not/watch)",null,"aren't watching","Negatif jamak: are not (aren’t) + V-ing.",["are not watching"]],["___ he running in the park?",["Is","Does","Are"],"Is","He memakai Is + V-ing."]],t:"Present Continuous",o:"Menceritakan kegiatan yang sedang berlangsung sekarang.",ex:"Present continuous dipakai untuk kegiatan yang sedang berlangsung sekarang. Bentuknya to be (am/is/are) + kata kerja-ing. Negatif: tambahkan not setelah to be (I am not working). Tanya: pindahkan to be ke depan (Are you studying?). Sering dipakai dengan now, at the moment, dan look!",f:"am/is/are + V-ing",ok:"She is reading a book now.",no:"She reading a book now.",mist:"Lupa to be (She reading) atau memakai kata kerja dasar setelah to be (She is read). Dalam bahasa Indonesia 'sedang membaca' cukup satu kata kerja, tetapi dalam bahasa Inggris butuh to be + V-ing.",eg:[["I am studying English now.","Saya sedang belajar bahasa Inggris sekarang."],["They are playing football.","Mereka sedang bermain sepak bola."],["Is it raining?","Apakah sedang hujan?"]],q:[["I ___ a book now.",["read","am reading","reading"],"am reading","Kegiatan sekarang: am + V-ing."],["She ___ TV at the moment.",["is watching","watching","are watching"],"is watching","She memakai is + V-ing."],["They ___ (play) football now.",null,"are playing","They memakai are + V-ing."],["Look! It ___ (rain).",null,"is raining","Kegiatan yang sedang terjadi: is + V-ing.",["'s raining"]],["Which sentence is correct?",["He is run.","He is running.","He running."],"He is running.","Is + V-ing."]]},
{id:"a1-pos",dl:[["Ani:","Is this your book, Budi?","Apakah ini bukumu, Budi?"],["Budi:","No, it isn’t my book. It’s Rina’s book.","Bukan, itu bukan bukuku. Itu buku Rina."],["Ani:","Where is her bag?","Di mana tasnya?"],["Budi:","Her bag is on the chair. Our teacher is looking for it.","Tasnya ada di kursi. Guru kami sedang mencarinya."]],nu:["Jangan pakai possessive adjective tanpa kata benda: <i>This book is my</i> salah, yang benar <i>This book is mine</i>.","Jangan campur dengan kata ganti subjek: <i>I book</i> salah, yang benar <i>my book</i>.","Untuk nama orang, pakai 's, bukan his atau her: <i>Rina’s book</i> (bukan <i>Rina book</i>).","Bagian tubuh dan pakaian tetap memakai possessive: <i>I wash my hands</i> (bukan <i>the hands</i>)."],tb:{t:"Dari mana my, your, his berasal?",h:["Kata ganti subjek","Possessive adjective","Contoh","Artinya"],r:[["I","my","my book","buku saya"],["you","your","your book","bukumu"],["he","his","his book","bukunya (laki-laki)"],["she","her","her book","bukunya (perempuan)"],["it","its","its tail","ekornya"],["we","our","our house","rumah kita/kami"],["they","their","their house","rumah mereka"]]},det:[["Dari mana asalnya?","Possessive adjective berasal dari kata ganti subjek. Kata ganti subjek (I, you, he, she, we, they) menunjukkan siapa yang melakukan sesuatu. Kalau kita ingin menunjukkan bahwa suatu benda <b>milik</b> orang tersebut, kata gantinya berubah: I menjadi <b>my</b>, you menjadi <b>your</b>, he menjadi <b>his</b>, she menjadi <b>her</b>, we menjadi <b>our</b>, dan they menjadi <b>their</b>. Jadi my berarti 'milik I', dan her berarti 'milik she'. Kata-kata ini selalu diikuti kata benda."],["Cara memilihnya","Tanyakan dulu: <b>siapa pemiliknya?</b> Bukan apa bendanya. Buku milik Rina, pemiliknya perempuan, jadi her book. Buku milik Budi, pemiliknya laki-laki, jadi his book. Bendanya tunggal atau jamak tidak mengubah bentuknya: my book dan my books sama-sama memakai my."],["Possessive adjective vs possessive pronoun","Possessive adjective (my, your, his, her, our, their) harus diikuti kata benda: <i>This is my book.</i> Ada juga possessive pronoun (mine, yours, his, hers, ours, theirs) yang berdiri sendiri tanpa kata benda: <i>This book is mine.</i> Jangan ucapkan <i>mine book</i>, tetapi <i>my book</i>."],["Hati-hati: its dan it’s","<b>Its</b> (tanpa apostrof) berarti 'miliknya' untuk hewan atau benda: <i>The cat likes its food.</i> <b>It’s</b> adalah singkatan dari it is atau it has: <i>It’s a cat.</i> Keduanya terdengar sama, tetapi artinya berbeda."]],rec:["Possessive adjective: my, your, his, her, its, our, their.","Letakkan sebelum kata benda, tidak pernah berdiri sendiri.","Pilih his atau her dari pemiliknya, bukan dari bendanya.","Bentuknya sama untuk benda tunggal dan jamak.","Its (milik) berbeda dari it’s (it is)."],eg2:[["This is my book. That is your book.","Ini bukuku. Itu bukumu."],["Rina loves her cat. Her cat is white.","Rina menyayangi kucingnya. Kucingnya berwarna putih."],["The dog is eating its food.","Anjing itu sedang makan makanannya."],["We are in our classroom.","Kami ada di kelas kami."]],q2:[["The cat likes ___ food.",["it’s","its","it"],"its","Its (tanpa apostrof) berarti miliknya untuk hewan atau benda."],["Dina has a bag. ___ bag is blue.",["His","Her","Their"],"Her","Dina perempuan, jadi her."],["We are at ___ school. (we)",null,"our","Pemiliknya we (kami), jadi our."]],t:"Possessive Adjectives: my, your, his, her",o:"Menunjukkan kepemilikan dengan my, your, his, her, our, dan their.",ex:"Possessive adjective menunjukkan kepemilikan dan diletakkan sebelum kata benda: my (milik saya), your (milikmu), his (miliknya, laki-laki), her (miliknya, perempuan), its (miliknya, benda atau hewan), our (milik kami atau kita), dan their (milik mereka). Bentuknya tidak berubah untuk benda tunggal maupun jamak.",f:"my / your / his / her / its / our / their + kata benda",ok:"She loves her family. / This is my book.",no:"She loves she family. / This is I book.",mist:"Memakai kata ganti subjek (I, she) sebelum kata benda, seperti 'I book'. Gunakan bentuk milik: my, her. Pilih his atau her berdasarkan pemiliknya, bukan bendanya.",eg:[["My name is Rina.","Nama saya Rina."],["He is with his brother.","Dia bersama saudara laki-lakinya."],["They love their school.","Mereka menyukai sekolah mereka."]],q:[["I like ___ new phone.",["me","my","mine"],"my","Sebelum kata benda, pakai possessive adjective: my."],["She is eating ___ lunch.",["her","she","hers"],"her","Pemiliknya perempuan, jadi her."],["Tom and Ani are at ___ house.",["they","their","them"],"their","Pemiliknya mereka, jadi their."],["This is Budi. ___ sister is a nurse.",null,"his","Budi laki-laki, jadi his."],["My mother has a car. ___ car is red.",null,"her","Ibu perempuan, jadi her."]]},
{id:"a1-pl",tb:{t:"Aturan membentuk jamak",h:["Aturan","Contoh"],r:[["Kebanyakan: + s","book menjadi books, car menjadi cars"],["Berakhir s, x, ch, sh: + es","bus menjadi buses, watch menjadi watches, dish menjadi dishes"],["Konsonan + y: y menjadi ies","baby menjadi babies, city menjadi cities"],["Vokal + y: + s","boy menjadi boys, day menjadi days"],["Berakhir f atau fe: menjadi ves","knife menjadi knives, leaf menjadi leaves"],["Tidak beraturan","man menjadi men, woman menjadi women, child menjadi children, person menjadi people, foot menjadi feet, tooth menjadi teeth"],["Sama untuk tunggal dan jamak","sheep, fish, deer"]]},det:[["Kenapa jamak penting?","Dalam bahasa Indonesia, jamak sering ditunjukkan oleh angka atau pengulangan (dua buku, anak-anak). Dalam bahasa Inggris, kata bendanya sendiri berubah: <i>two books</i>, bukan <i>two book</i>. Kata seperti many, some, dan a lot of juga diikuti kata benda jamak."],["Pengucapan akhiran -s","Akhiran -s dibaca /s/ setelah bunyi tak bersuara (books), /z/ setelah bunyi bersuara (dogs), dan /ɪz/ setelah s, x, ch, sh (buses, watches). Tidak perlu dihafal, cukup dengarkan contoh-contohnya lewat tombol Listen di kosakata."],["Kata yang tidak bisa dihitung","Beberapa kata benda tidak punya bentuk jamak karena tidak bisa dihitung satu per satu: water, rice, money, information, dan advice. Jangan katakan <i>informations</i> atau <i>advices</i>. Gunakan <i>some information</i> atau <i>a piece of advice</i>."]],dl:[["Guru:","How many students are there in your class?","Ada berapa siswa di kelasmu?"],["Rina:","There are thirty children. Twenty are girls and ten are boys.","Ada tiga puluh anak. Dua puluh perempuan dan sepuluh laki-laki."],["Guru:","Do you have many books?","Apakah kamu punya banyak buku?"],["Rina:","Yes, I have about fifty books and two big boxes of pencils.","Ya, saya punya sekitar lima puluh buku dan dua kotak besar pensil."]],nu:["Jangan lupa menambah -s setelah angka lebih dari satu: <i>two book</i> salah.","Jangan pakai bentuk jamak biasa untuk kata tidak beraturan: <i>childs, mans, womans</i> salah.","Jangan buat jamak untuk benda tak terhitung: <i>informations, furnitures</i> salah.","Jangan pakai a atau an dengan benda jamak: <i>a books</i> salah."],rec:["Kebanyakan kata benda jamak: tambah -s.","s, x, ch, sh: tambah -es. Konsonan + y: ies.","Tidak beraturan: men, women, children, people, feet, teeth.","Sheep dan fish sama untuk tunggal dan jamak.","Benda tak terhitung tidak punya bentuk jamak."],eg2:[["There are three buses at the station.","Ada tiga bus di stasiun."],["The babies are sleeping.","Bayi-bayi itu sedang tidur."],["My teeth are clean.","Gigi-gigi saya bersih."],["I have two sheep on my farm.","Saya punya dua domba di peternakan."]],q2:[["One city, two ___. (city)",null,"cities","Konsonan + y menjadi -ies."],["One foot, two ___. (foot)",null,"feet","Bentuk jamak tidak beraturan: feet."],["I need some ___.",["information","informations","an information"],"information","Information tidak bisa dihitung."]],t:"Plural Nouns",o:"Membentuk kata benda jamak dengan benar.",ex:"Kebanyakan kata benda jamak dibentuk dengan menambah -s (book menjadi books). Jika berakhir -s, -x, -ch, atau -sh, tambahkan -es (bus menjadi buses, watch menjadi watches). Jika berakhir konsonan + y, ubah y menjadi -ies (baby menjadi babies). Ada bentuk tidak beraturan: man menjadi men, woman menjadi women, child menjadi children, person menjadi people.",f:"+s | +es | y menjadi ies | bentuk tidak beraturan",ok:"two babies, three buses, five children",no:"two babys, three buss, five childs",mist:"Dalam bahasa Indonesia jamak cukup dengan angka (dua buku), sehingga sering lupa menambah -s. Dalam bahasa Inggris, setelah angka lebih dari satu kata bendanya harus jamak.",eg:[["I have two brothers.","Saya punya dua saudara laki-laki."],["The children are in the garden.","Anak-anak ada di kebun."],["She washes the dishes.","Dia mencuci piring-piring."]],q:[["I have three ___.",["book","books","bookes"],"books","Kata benda jamak biasa ditambah -s."],["There are two ___ in the room.",["woman","womans","women"],"women","Bentuk jamak tidak beraturan: women."],["The plural of baby is...",["babys","babies","babyes"],"babies","Konsonan + y menjadi -ies."],["One bus, two ___. (bus)",null,"buses","Berakhir -s, tambahkan -es."],["One child, three ___. (child)",null,"children","Bentuk jamak tidak beraturan: children."]]},
{id:"a1-th",tb:{t:"This, that, these, those",h:["Bentuk","Dekat","Jauh"],r:[["Tunggal","this (ini)","that (itu)"],["Jamak","these (ini)","those (itu)"],["Contoh tunggal","This is my bag.","That is your bag."],["Contoh jamak","These are my keys.","Those are your keys."]]},det:[["Jarak itu relatif","Dekat atau jauh dihitung dari si pembicara. Kalau benda ada di tangan atau di dekatmu, pakai this atau these. Kalau benda ada di seberang ruangan atau jauh, pakai that atau those. Waktu juga bisa: <i>this week</i> (minggu ini) dan <i>that day</i> (hari itu)."],["Bisa jadi kata ganti atau penunjuk","Sebagai <b>kata ganti</b>, ia berdiri sendiri: <i>This is nice.</i> Sebagai <b>penunjuk</b>, ia diikuti kata benda: <i>This bag is nice.</i> Dalam kedua kasus, tunggal memakai this atau that, dan jamak memakai these atau those."],["Memperkenalkan dan di telepon","Saat memperkenalkan orang, pakai this: <i>This is my friend, Rina.</i> Saat di telepon, 'ini' memakai this: <i>Hello, this is Budi.</i>, dan 'siapa itu' memakai that: <i>Who is that?</i>"]],dl:[["Penjual:","Hello! Can I help you?","Halo! Ada yang bisa saya bantu?"],["Maya:","Yes, how much is this bag?","Ya, berapa harga tas ini?"],["Penjual:","It’s fifty thousand. Those shoes over there are cheap too.","Lima puluh ribu. Sepatu di sana juga murah."],["Maya:","I like these shoes, but that bag is nicer.","Saya suka sepatu ini, tetapi tas itu lebih bagus."]],nu:["Jangan campur tunggal dan jamak: <i>These is my pen</i> salah, <i>This is my pen</i> benar.","Jangan pakai this atau these untuk benda yang jelas jauh darimu.","Jangan lupa bentuk to be: this atau that + is, these atau those + are.","Jangan tambah the di depannya: <i>the this book</i> salah, yang benar <i>this book</i>."],rec:["This dan these untuk yang dekat, that dan those untuk yang jauh.","This dan that tunggal; these dan those jamak.","Tunggal memakai is, jamak memakai are.","This is dipakai saat memperkenalkan seseorang.","Bisa berdiri sendiri atau diikuti kata benda."],eg2:[["This is my friend, Rina.","Ini temanku, Rina."],["Those mountains are very high.","Gunung-gunung itu sangat tinggi."],["Are these your keys?","Apakah ini kunci-kuncimu?"],["That house over there is big.","Rumah di sana besar."]],q2:[["Hello, ___ is Budi. (on the phone)",["that","this","those"],"this","Memperkenalkan diri di telepon memakai this."],["___ books over there are mine. (those/these)",null,"those","Banyak benda yang jauh: those."],["___ is my father, Mr. Adi. (introducing, near me)",null,"this","Memperkenalkan orang yang dekat memakai this."]],t:"This, That, These, Those",o:"Menunjuk benda yang dekat dan yang jauh.",ex:"This dan these dipakai untuk benda yang dekat dengan kita (this = satu, these = banyak). That dan those dipakai untuk benda yang jauh (that = satu, those = banyak). Setelah this atau that pakai is, setelah these atau those pakai are.",f:"this/that + is + tunggal | these/those + are + jamak",ok:"This is my pen. / Those are your shoes.",no:"These is my pen.",mist:"Mencampur bentuk tunggal dan jamak (these is). This dan that untuk satu benda, these dan those untuk lebih dari satu. Jaraknya: dekat = this/these, jauh = that/those.",eg:[["This is my bag.","Ini tas saya."],["Those are my friends over there.","Itu teman-temanku di sana."],["Are these your keys?","Apakah ini kunci-kuncimu?"]],q:[["___ is my pen. (near me)",["That","This","Those"],"This","Satu benda yang dekat: this."],["___ are my shoes. (near me)",["These","This","That"],"These","Banyak benda yang dekat: these."],["___ car over there is expensive.",["This","These","That"],"That","Satu benda yang jauh: that."],["___ are my friends over there. (those/that)",null,"those","Banyak orang yang jauh: those."],["___ is a good book. (near me, one book)",null,"this","Satu benda yang dekat: this."]]},
{id:"a1-qw",tb:{t:"Kata tanya dan artinya",h:["Kata tanya","Menanyakan","Contoh"],r:[["what","benda atau hal","What is this?"],["where","tempat","Where do you live?"],["who","orang","Who is she?"],["when","waktu","When is your birthday?"],["why","alasan","Why are you late?"],["how","cara atau keadaan","How are you?"],["which","pilihan tertentu","Which bag is yours?"]]},det:[["Urutan kalimat tanya","Rumusnya: <b>kata tanya + to be / do / does + subjek + ...</b> Dengan to be: <i>Where is the station?</i> Dengan kata kerja biasa: <i>Where does she work?</i> Perhatikan bahwa kata kerja utama kembali ke bentuk dasar setelah do atau does."],["Kata tanya dengan how","How bisa digabung: <i>how old</i> (umur), <i>how much</i> (harga atau jumlah tak terhitung), <i>how many</i> (jumlah benda yang bisa dihitung), <i>how long</i> (berapa lama), dan <i>how often</i> (seberapa sering). Contoh: <i>How old are you?</i> dan <i>How many brothers do you have?</i>"],["Who sebagai subjek","Kalau kata tanya adalah subjek kalimat, tidak perlu do atau does: <i>Who lives here?</i> (bukan <i>Who does live here?</i>). Bandingkan dengan <i>Where does she live?</i>"]],dl:[["Guru:","What is your name?","Siapa namamu?"],["Siswa:","My name is Joko.","Nama saya Joko."],["Guru:","Where do you live, Joko?","Kamu tinggal di mana, Joko?"],["Siswa:","I live in Bekasi. I go to school by train.","Saya tinggal di Bekasi. Saya ke sekolah naik kereta."],["Guru:","How long does it take?","Berapa lama perjalanannya?"],["Siswa:","About forty minutes.","Sekitar empat puluh menit."]],nu:["Jangan menyusun pertanyaan tanpa to be atau do/does: <i>Where you live?</i> salah.","Jangan pakai who untuk benda dan what untuk orang: tanyakan orang dengan who.","Jangan pakai do atau does saat who atau what menjadi subjek: <i>Who lives here?</i>.","Jangan tambah -s pada kata kerja utama setelah does: <i>Where does she works?</i> salah."],rec:["Pola: kata tanya + to be/do/does + subjek.","What (hal), where (tempat), who (orang), when (waktu), why (alasan), how (cara).","How old, how much, how many, how long, how often.","Setelah does, kata kerja kembali ke bentuk dasar.","Jika who atau what adalah subjek, tidak perlu do atau does."],eg2:[["What time is it?","Jam berapa sekarang?"],["How many students are there?","Ada berapa pelajar?"],["Why does he study English?","Mengapa dia belajar bahasa Inggris?"],["Who lives next door?","Siapa yang tinggal di sebelah?"]],q2:[["___ old are you?",["How","What","Who"],"How","Umur ditanyakan dengan how old."],["___ many brothers do you have?",null,"how","Jumlah benda yang bisa dihitung: how many."],["Where ___ she work? (do/does)",null,"does","She memakai does."]],t:"Question Words",o:"Bertanya dengan what, where, who, when, why, dan how.",ex:"Question words dipakai untuk menanyakan informasi: what (apa), where (di mana), who (siapa), when (kapan), why (mengapa), how (bagaimana), dan which (yang mana). Letaknya di awal kalimat, lalu diikuti to be atau do/does: Where is the station? What do you eat?",f:"Question word + is/are/do/does + subject",ok:"Where do you live? / What is your name?",no:"Where you live? / What your name?",mist:"Membuat pertanyaan tanpa to be atau do/does (Where you live?), karena dalam bahasa Indonesia cukup 'Kamu tinggal di mana?'. Dalam bahasa Inggris urutannya: kata tanya + to be/do/does + subjek.",eg:[["What is your name?","Siapa namamu?"],["Where does she work?","Di mana dia bekerja?"],["Why are you late?","Mengapa kamu terlambat?"]],q:[["___ do you live? In Bandung.",["Where","Who","When"],"Where","Where menanyakan tempat."],["___ is your teacher? Mr. Adi.",["When","Who","Why"],"Who","Who menanyakan orang."],["___ is your birthday? In May.",["Where","When","Who"],"When","When menanyakan waktu."],["___ are you late? Because of the traffic.",null,"why","Why menanyakan alasan."],["___ do you go to school? By bus.",null,"how","How menanyakan cara."]]},
{id:"a1-pp",tb:{t:"Preposisi tempat",h:["Preposisi","Artinya","Contoh"],r:[["in","di dalam","in the box"],["on","di atas (menempel)","on the table"],["under","di bawah","under the chair"],["next to","di sebelah","next to the bank"],["between","di antara dua benda","between the bank and the shop"],["in front of","di depan","in front of the school"],["behind","di belakang","behind the door"]]},det:[["Satu kata 'di', banyak pilihan","Bahasa Indonesia memakai 'di' untuk hampir semua tempat. Dalam bahasa Inggris, pilihannya bergantung pada posisi: di dalam ruang atau wadah memakai <b>in</b>, di permukaan memakai <b>on</b>, di bawah memakai <b>under</b>, dan di dekat memakai <b>next to</b> atau <b>near</b>."],["At, in, dan on untuk tempat","<b>At</b> untuk titik atau tempat tertentu: <i>at the bus stop, at home, at school</i>. <b>In</b> untuk ruang tertutup, kota, dan negara: <i>in the room, in Bandung, in Indonesia</i>. <b>On</b> untuk permukaan dan jalan: <i>on the wall, on the second floor, on Jalan Sudirman</i>."],["Bertanya dan menjawab letak","Tanya dengan where: <i>Where is the bank?</i> Jawab dengan preposisi: <i>It is next to the post office.</i> Untuk memberi petunjuk, kombinasikan: <i>It is between the school and the market.</i>"]],dl:[["Turis:","Excuse me, where is the hospital?","Permisi, di mana rumah sakitnya?"],["Warga:","It’s next to the bank, in front of the park.","Di sebelah bank, di depan taman."],["Turis:","Is the bank on this street?","Apakah banknya di jalan ini?"],["Warga:","Yes, it is. It’s between the school and the market.","Ya. Letaknya di antara sekolah dan pasar."]],nu:["Jangan pakai in untuk permukaan: <i>in the table</i> salah, yang benar <i>on the table</i>.","Jangan pakai on untuk benda di dalam wadah: <i>on the bag</i> berarti di atas tas, bukan di dalam tas.","Jangan tambah to sebelum home saat bergerak: <i>I go home</i>, bukan <i>I go to home</i>.","Jangan pakai in untuk titik tertentu seperti halte: gunakan <i>at the bus stop</i>."],rec:["in = di dalam, on = di atas dan menempel, under = di bawah.","next to = di sebelah, between = di antara, behind = di belakang.","At untuk titik, in untuk ruang dan kota, on untuk permukaan.","Tanyakan letak dengan Where is...?","Pilih preposisi dari posisinya, bukan dari kata 'di'."],eg2:[["The cat is behind the sofa.","Kucing itu ada di belakang sofa."],["The picture is on the wall.","Gambar itu ada di dinding."],["I am at the bus stop.","Saya ada di halte bus."],["The school is between the park and the shop.","Sekolah ada di antara taman dan toko."]],q2:[["The keys are ___ my bag. (inside)",["on","in","between"],"in","Di dalam tas: in."],["The picture is ___ the wall.",["in","on","under"],"on","Di dinding (permukaan): on."],["The shop is ___ the bank and the school. (in the middle)",null,"between","Di antara dua benda: between."]],t:"Prepositions of Place: in, on, under, next to",o:"Menyebutkan letak benda dengan tepat.",ex:"Preposition of place menunjukkan letak benda. In berarti di dalam (in the bag), on berarti di atas dan menempel (on the table), under berarti di bawah (under the chair), next to berarti di sebelah (next to the bank), between berarti di antara dua benda, dan in front of berarti di depan.",f:"in = di dalam | on = di atas | under = di bawah | next to = di sebelah",ok:"The cat is under the chair. / The book is on the table.",no:"The cat is in under the chair.",mist:"Memakai satu kata 'di' untuk semuanya. Dalam bahasa Inggris pilih sesuai posisi: di dalam = in, di atas = on, di bawah = under, di sebelah = next to.",eg:[["My keys are in my bag.","Kunci saya ada di dalam tas saya."],["The phone is on the table.","Ponselnya ada di atas meja."],["The shop is next to the bank.","Tokonya ada di sebelah bank."]],q:[["The milk is ___ the fridge.",["on","in","under"],"in","Di dalam kulkas: in."],["The book is ___ the table.",["in","on","between"],"on","Di atas meja dan menempel: on."],["The cat is ___ the chair. (below it)",["under","on","at"],"under","Di bawah kursi: under."],["The bank is ___ to the school. (beside)",null,"next","Di sebelah: next to."],["My phone is ___ my bag. (inside)",null,"in","Di dalam tas: in."]]},
{id:"a1-im",tb:{t:"Bentuk imperative",h:["Fungsi","Rumus","Contoh"],r:[["Perintah","V1","Sit down."],["Perintah sopan","Please + V1 / V1, please","Please open the door."],["Larangan","Don’t + V1","Don’t run."],["Ajakan","Let’s + V1","Let’s go home."]]},det:[["Tidak ada subjek","Imperative selalu ditujukan kepada orang yang diajak bicara (you), jadi subjek you tidak disebut: <i>Open the door.</i> (bukan <i>You open the door.</i>). Kata kerjanya bentuk dasar."],["Membuat lebih sopan","Tambahkan <b>please</b> di awal atau akhir: <i>Please sit down.</i> atau <i>Sit down, please.</i> Nada suara juga berpengaruh. Tanpa please dan dengan nada tegas, imperative bisa terdengar seperti perintah keras."],["Imperative di sekitar kita","Imperative sering muncul di rambu dan instruksi: <i>Stop. Keep left. Do not touch. Turn right.</i> Dalam resep: <i>Add sugar. Mix well.</i> Dalam petunjuk arah: <i>Go straight, then turn left.</i>"]],dl:[["Ibu:","Tina, wash your hands, please.","Tina, cuci tanganmu, ya."],["Tina:","OK, Mom. Can I play outside?","Baik, Bu. Boleh saya bermain di luar?"],["Ibu:","Yes, but don’t go far. And don’t be late for dinner.","Boleh, tetapi jangan jauh-jauh. Dan jangan terlambat makan malam."],["Tina:","Let’s go, Dina!","Ayo, Dina!"]],nu:["Jangan pakai subjek: <i>You sit down</i> terdengar seperti pernyataan, bukan perintah.","Jangan pakai not langsung: <i>Not run</i> salah, yang benar <i>Don’t run</i>.","Jangan pakai are di perintah: <i>Be quiet</i> benar, tetapi <i>Are quiet</i> salah.","Hati-hati dengan perintah tanpa please kepada orang yang lebih tua atau dalam situasi formal. Tambahkan please agar sopan."],rec:["Perintah: kata kerja dasar tanpa subjek.","Larangan: Don’t + kata kerja dasar.","Ajakan: Let’s + kata kerja dasar.","Tambahkan please agar lebih sopan.","Imperative sering ada di rambu, resep, dan petunjuk arah."],eg2:[["Turn left at the corner.","Belok kiri di sudut jalan."],["Don’t forget your homework.","Jangan lupa PR-mu."],["Please be quiet.","Tolong diam."],["Let’s play football after school.","Ayo bermain sepak bola setelah sekolah."]],q2:[["___ late for school, please.",["Don’t be","Not be","No be"],"Don’t be","Larangan memakai Don’t + kata kerja dasar."],["___ eat in the library. (negative)",null,"don't","Larangan memakai Don’t + kata kerja dasar.",["do not"]],["Let’s ___ to the park. (go)",null,"go","Let’s + kata kerja dasar."]],t:"Imperatives",o:"Memberi perintah, larangan, dan ajakan.",ex:"Imperative dipakai untuk memberi perintah, instruksi, atau ajakan. Bentuknya kata kerja dasar tanpa subjek (Open the door). Untuk larangan, pakai don’t + kata kerja dasar (Don’t run). Tambahkan please agar lebih sopan, dan let’s + kata kerja dasar untuk mengajak (Let’s go).",f:"V1 (+ please) | Don’t + V1 | Let’s + V1",ok:"Open the window, please. / Don’t be late.",no:"You open the window. / Not be late.",mist:"Memakai subjek atau not untuk larangan (Not run). Larangan memakai Don’t + kata kerja dasar. Perintah tidak butuh subjek you.",eg:[["Sit down, please.","Silakan duduk."],["Don’t touch that.","Jangan sentuh itu."],["Let’s have lunch.","Ayo makan siang."]],q:[["___ the door, please.",["Open","Opens","Opening"],"Open","Perintah memakai kata kerja dasar."],["___ run in the classroom.",["Not","Don’t","No"],"Don’t","Larangan memakai Don’t + kata kerja dasar."],["___ go to the beach! (invitation)",["Let’s","Lets","Let"],"Let’s","Ajakan memakai Let’s + kata kerja dasar."],["Don’t ___ late for class.",null,"be","Don’t + kata kerja dasar (be)."],["Please ___ your name here.",null,"write","Perintah sopan: please + kata kerja dasar."]]},
{id:"a1-hg",tb:{t:"Bentuk have got",h:["Bentuk","I / you / we / they","he / she / it"],r:[["Positif","I have got a car.","She has got a car."],["Negatif","I haven’t got a car.","She hasn’t got a car."],["Pertanyaan","Have you got a car?","Has she got a car?"],["Jawaban singkat","Yes, I have. / No, I haven’t.","Yes, she has. / No, she hasn’t."]]},det:[["Untuk apa have got?","Have got dipakai untuk <b>kepemilikan</b> (<i>I have got a phone</i>), <b>ciri fisik</b> (<i>She has got long hair</i>), <b>hubungan keluarga</b> (<i>He has got two sisters</i>), dan <b>keluhan sakit</b> (<i>I have got a headache</i>). Artinya sama dengan have, tetapi have got lebih sering dipakai dalam percakapan."],["Have got dan have","<i>I have got a car</i> dan <i>I have a car</i> artinya sama. Perbedaannya ada pada bentuk negatif dan tanya: have got memakai have atau has sendiri (<i>Have you got...?</i>), sedangkan have memakai do atau does (<i>Do you have...?</i>). Jangan mencampur keduanya: <i>Do you have got</i> salah."],["Bentuk singkat","I have got menjadi I’ve got, she has got menjadi she’s got. Hati-hati: <i>she’s got</i> berarti she has got, bukan she is got. Dalam percakapan sering terdengar: <i>I’ve got a question.</i>"]],dl:[["Fani:","Have you got any brothers or sisters?","Apakah kamu punya saudara?"],["Gilang:","I’ve got one sister. She’s got long black hair.","Saya punya satu saudara perempuan. Dia berambut hitam panjang."],["Fani:","Has she got a phone?","Apakah dia punya ponsel?"],["Gilang:","No, she hasn’t. But she’s got a laptop.","Tidak. Tetapi dia punya laptop."]],nu:["Jangan pakai have got untuk kegiatan: <i>I have got breakfast</i> salah, yang benar <i>I have breakfast</i>.","Jangan pakai have got untuk he, she, it: <i>She have got</i> salah.","Jangan pakai do atau does bersama have got: <i>Do you have got a pen?</i> salah.","Have got tidak dipakai di masa lalu: pakai had (<i>I had a car</i>)."],rec:["I/you/we/they have got; he/she/it has got.","Negatif: haven’t got atau hasn’t got. Tanya: Have atau Has + subjek + got?","Untuk kepemilikan, ciri, keluarga, dan keluhan.","Jangan campur dengan do atau does.","Masa lalu memakai had."],eg2:[["My sister has got a new bike.","Saudara perempuan saya punya sepeda baru."],["We haven’t got any money.","Kami tidak punya uang sama sekali."],["Have they got a big house?","Apakah mereka punya rumah besar?"],["I’ve got a headache.","Kepala saya sakit."]],q2:[["He ___ got blue eyes.",["have","has","is"],"has","He memakai has got."],["We ___ got a dog. (negative)",null,"haven't","Negatif we: haven’t got.",["have not"]],["___ she got a brother? (have/has)",null,"has","She memakai Has she got...?"]],t:"Have got",o:"Menyatakan kepemilikan dan ciri dengan have got dan has got.",ex:"Have got dipakai untuk menyatakan kepemilikan dan ciri. I, you, we, dan they memakai have got, sedangkan he, she, dan it memakai has got. Negatif: haven’t got atau hasn’t got. Tanya: Have you got...? atau Has she got...? Dalam percakapan sering disingkat I’ve got dan she’s got.",f:"I/you/we/they have got | he/she/it has got",ok:"She has got a new phone. / I haven’t got a car.",no:"She have got a new phone.",mist:"Memakai have got untuk he, she, atau it (She have got). Untuk he, she, it pakai has got. Untuk negatif dan tanya, jangan pakai do/does bersama have got.",eg:[["I have got two sisters.","Saya punya dua saudara perempuan."],["He has got a big house.","Dia punya rumah besar."],["Have you got a pen?","Apakah kamu punya pulpen?"]],q:[["She ___ got a new bag.",["have","has","is"],"has","She memakai has got."],["They ___ got three cats.",["has","have","are"],"have","They memakai have got."],["Which is correct?",["Do you have got a pen?","Have you got a pen?","Has you got a pen?"],"Have you got a pen?","Tanya: Have you got...?"],["He ___ got a red car. (have/has)",null,"has","He memakai has got."],["I haven’t ___ a car. (got)",null,"got","Bentuknya haven’t got."]]},
{id:"a1-sa",tb:{t:"Some dan any",h:["Jenis kalimat","Pakai","Contoh"],r:[["Positif","some","I have some milk."],["Negatif","any","I don’t have any milk."],["Pertanyaan","any","Do you have any milk?"],["Menawarkan","some","Would you like some tea?"],["Meminta","some","Can I have some water?"]]},det:[["Apa artinya?","Some dan any dipakai untuk jumlah yang tidak disebut pasti, dengan benda jamak (some books) dan benda tak terhitung (some water). Some kira-kira berarti 'beberapa' atau 'sedikit', sedangkan any di kalimat negatif berarti 'sama sekali tidak' dan di pertanyaan berarti 'ada atau tidak'."],["Pengecualian: some di pertanyaan","Di pertanyaan, kita memakai some saat <b>menawarkan atau meminta</b> sesuatu dan berharap jawabannya ya: <i>Would you like some coffee?</i> dan <i>Can I have some water?</i> Selain itu, pertanyaan biasa memakai any."],["Turunannya","Some dan any membentuk kata lain: <i>someone / anyone</i> (seseorang), <i>something / anything</i> (sesuatu), dan <i>somewhere / anywhere</i> (suatu tempat). Aturannya sama: positif memakai some-, negatif dan pertanyaan memakai any-. Contoh: <i>I don’t know anyone here.</i>"]],dl:[["Mia:","Is there any milk in the fridge?","Apakah ada susu di kulkas?"],["Ibu:","Yes, there is some milk. But there aren’t any eggs.","Ya, ada sedikit susu. Tetapi tidak ada telur sama sekali."],["Mia:","Can I have some bread, please?","Boleh saya minta roti?"],["Ibu:","Sure. Would you like some jam too?","Tentu. Mau selai juga?"]],nu:["Jangan pakai some di kalimat negatif: <i>I don’t have some money</i> salah.","Jangan pakai any di kalimat positif biasa: <i>I have any friends</i> salah.","Some dan any tidak dipakai dengan benda tunggal yang bisa dihitung: <i>some book</i> salah, pakai <i>a book</i>.","Jangan lupa: tawaran dan permintaan memakai some, walau berbentuk pertanyaan."],rec:["Positif: some. Negatif dan pertanyaan: any.","Tawaran dan permintaan memakai some.","Dipakai untuk benda jamak dan tak terhitung.","Turunan: someone, something, somewhere dan anyone, anything, anywhere.","Tidak dipakai dengan benda tunggal yang bisa dihitung."],eg2:[["There are some apples on the table.","Ada beberapa apel di atas meja."],["I haven’t got any brothers.","Saya tidak punya saudara laki-laki."],["Is there any sugar?","Apakah ada gula?"],["Would you like some water?","Mau air?"]],q2:[["Would you like ___ tea? (offer)",["some","any","a"],"some","Menawarkan sesuatu memakai some."],["I don’t know ___ here. (anyone/someone)",null,"anyone","Kalimat negatif memakai anyone."],["There are ___ eggs in the basket. (positive)",null,"some","Kalimat positif memakai some."]],t:"Some and Any",o:"Menyatakan jumlah yang tidak pasti.",ex:"Some dan any dipakai untuk jumlah yang tidak disebutkan secara pasti. Some dipakai di kalimat positif (I have some milk). Any dipakai di kalimat negatif dan pertanyaan (I don’t have any milk. Do you have any milk?). Some juga dipakai saat menawarkan sesuatu (Would you like some tea?).",f:"+ some | - any | ? any",ok:"I have some rice. / I don’t have any money.",no:"I don’t have some money.",mist:"Memakai some di kalimat negatif (I don’t have some money). Di kalimat negatif dan pertanyaan pakai any.",eg:[["There is some milk in the fridge.","Ada sedikit susu di kulkas."],["We don’t have any eggs.","Kami tidak punya telur sama sekali."],["Do you have any brothers?","Apakah kamu punya saudara laki-laki?"]],q:[["I have ___ friends in Jakarta.",["any","some","a"],"some","Kalimat positif memakai some."],["We don’t have ___ sugar.",["some","any","a"],"any","Kalimat negatif memakai any."],["Is there ___ water in the bottle?",["some","any","an"],"any","Pertanyaan memakai any."],["She wants ___ rice. (some/any)",null,"some","Kalimat positif memakai some."],["I haven’t got ___ money. (some/any)",null,"any","Kalimat negatif memakai any."]]},
{id:"a1-op",tb:{t:"Subject pronoun dan object pronoun",h:["Subject (sebelum kata kerja)","Object (setelah kata kerja)","Contoh"],r:[["I","me","She loves me."],["you","you","I see you."],["he","him","I know him."],["she","her","He helps her."],["it","it","I like it."],["we","us","They call us."],["they","them","I meet them."]]},det:[["Dua posisi, dua bentuk","Kata ganti subjek dipakai <b>sebelum</b> kata kerja karena menjadi pelaku: <i>She loves music.</i> Kata ganti objek dipakai <b>setelah</b> kata kerja atau preposisi karena menjadi penerima: <i>I love her.</i> Jadi satu orang bisa punya dua bentuk, misalnya she dan her."],["Setelah preposisi","Setelah preposisi (to, with, for, at, about), selalu pakai kata ganti objek: <i>with me, for him, to us, about them.</i> Contoh: <i>Come with me.</i> (bukan <i>with I</i>)."],["Menghindari pengulangan","Kata ganti membuat kalimat tidak berulang. Bandingkan: <i>Rina is my friend. I like Rina.</i> menjadi <i>Rina is my friend. I like her.</i> Pilih kata ganti sesuai orangnya dan jumlahnya (him untuk laki-laki, her untuk perempuan, them untuk jamak)."]],dl:[["Nina:","Do you know Tomi?","Apakah kamu kenal Tomi?"],["Ari:","Yes, I know him. He is my neighbor. I often help him.","Ya, saya kenal dia. Dia tetangga saya. Saya sering membantunya."],["Nina:","And his sisters?","Dan saudara-saudara perempuannya?"],["Ari:","I don’t know them well. They talk to me sometimes.","Saya kurang kenal mereka. Mereka kadang mengobrol dengan saya."]],nu:["Jangan pakai kata ganti subjek setelah kata kerja: <i>I see she</i> salah, yang benar <i>I see her</i>.","Jangan pakai kata ganti subjek setelah preposisi: <i>with I</i> salah, yang benar <i>with me</i>.","Jangan pakai kata ganti objek sebagai subjek: <i>Me like tea</i> salah, yang benar <i>I like tea</i>.","Untuk you dan it, bentuk subjek dan objeknya sama, jadi tidak ada yang berubah."],rec:["Subject: I, you, he, she, it, we, they (sebelum kata kerja).","Object: me, you, him, her, it, us, them (setelah kata kerja atau preposisi).","You dan it tidak berubah bentuk.","Setelah preposisi selalu pakai object pronoun.","Pilih sesuai orang dan jumlahnya."],eg2:[["Please call me tonight.","Tolong telepon saya nanti malam."],["Dina is my friend. I often visit her.","Dina temanku. Aku sering mengunjunginya."],["Come with us.","Ikutlah dengan kami."],["I can’t see them.","Saya tidak bisa melihat mereka."]],q2:[["Come with ___. (I)",["I","me","my"],"me","Setelah preposisi pakai object pronoun: me."],["My parents are at home. I call ___ every day. (they)",null,"them","Object pronoun dari they adalah them."],["Ani is nice. I like ___. (she)",null,"her","Object pronoun dari she adalah her."]],t:"Object Pronouns",o:"Memakai me, him, her, us, dan them setelah kata kerja.",ex:"Object pronoun dipakai setelah kata kerja atau preposisi untuk menggantikan kata benda: me, you, him, her, it, us, dan them. Subject pronoun (I, you, he, she, it, we, they) dipakai sebelum kata kerja.",f:"I: me | he: him | she: her | we: us | they: them",ok:"Please help me. / I know her.",no:"Please help I. / I know she.",mist:"Memakai kata ganti subjek setelah kata kerja (help I, know she). Setelah kata kerja atau preposisi, pakai object pronoun: me, him, her, us, them.",eg:[["She loves him.","Dia mencintainya."],["Can you help us?","Bisakah kamu membantu kami?"],["I see them every day.","Saya melihat mereka setiap hari."]],q:[["Please call ___ tomorrow. (me)",["I","me","my"],"me","Setelah kata kerja, pakai object pronoun: me."],["I like Dina. I talk to ___ every day.",["she","her","hers"],"her","Setelah preposisi, pakai object pronoun: her."],["They are my friends. I see ___ often.",["they","them","their"],"them","Setelah kata kerja, pakai them."],["Tom is my brother. I love ___. (he)",null,"him","Object pronoun dari he adalah him."],["We need help. Can you help ___? (we)",null,"us","Object pronoun dari we adalah us."]]}
