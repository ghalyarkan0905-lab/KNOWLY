/* KNOWLY v22: safe storage and backward-compatible progress validation. */
function kHTML(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function kObject(v){return !!v&&typeof v==='object'&&!Array.isArray(v);}
let kStorageProblem='',kRecoveryProblem='';
const kStorage=(()=>{
 const memory=new Map();
 return {
  getItem(key){if(memory.has(key))return memory.get(key);try{return window.localStorage.getItem(key)}catch(e){kStorageProblem='Browser storage is unavailable. Export your progress before closing this page.';return null}},
  setItem(key,value){value=String(value);memory.set(key,value);try{window.localStorage.setItem(key,value);kStorageProblem='';return true}catch(e){kStorageProblem='Progress is only saved for this session. Browser storage is blocked or full. Export a backup before closing.';return false}},
  removeItem(key){memory.set(key,null);try{window.localStorage.removeItem(key);return true}catch(e){return false}}
 };
})();
function kParse(text){return JSON.parse(text,(key,value)=>{if(['__proto__','prototype','constructor'].includes(key))throw Error('Unsupported progress key');return value})}
function kDefaults(){return {p:{level:'B1',goal:10,theme:'system',streak:0,longest:0,last:null},wp:{},log:[],day:{d:'',w:[],n:[]},writing:{},missionXP:{total:0,events:{},claimed:{}},zeliShop:{coins:0,creditedXP:0,owned:[],equipped:{}},zeliAppearance:{color:'default',customHex:'#7fc7ee'}}}
function kNormalize(raw){
 if(!kObject(raw)||!kObject(raw.p))throw Error('Missing profile');
 const s=raw,levels=['A1','A2','B1','B2','C1','C2'];
 const record=(value,name)=>{if(!kObject(value))throw Error('Invalid '+name);return value};
 const array=(value,name)=>{if(!Array.isArray(value))throw Error('Invalid '+name);return value};
 const number=(value,def=0)=>{if(value==null)return def;if(!Number.isFinite(Number(value))||Number(value)<0)throw Error('Invalid number');return Number(value)};
 const text=v=>typeof v==='string';
 s.p={...kDefaults().p,...s.p};
 if(!levels.includes(s.p.level)||!['system','light','dark'].includes(s.p.theme))throw Error('Invalid profile');
 s.p.goal=Math.min(50,Math.max(1,Math.round(number(s.p.goal,10))));
 s.p.streak=number(s.p.streak);s.p.longest=Math.max(number(s.p.longest),s.p.streak);
 if(s.p.last!==null&&!/^\d{4}-\d{2}-\d{2}$/.test(s.p.last))throw Error('Invalid date');
 s.wp=record(s.wp??{},'vocabulary');
 for(const v of Object.values(s.wp)){record(v,'word');if(!['new','learning','mastered'].includes(v.s??'new'))throw Error('Invalid word status');v.s??='new';for(const key of ['rc','cg','ag'])v[key]=number(v[key]);v.f=!!v.f;if(v.n!=null&&!/^\d{4}-\d{2}-\d{2}$/.test(v.n))throw Error('Invalid review date');}
 s.day=record(s.day??{d:'',w:[],n:[]},'daily progress');if(!text(s.day.d))throw Error('Invalid day');for(const key of ['w','n']){s.day[key]=array(s.day[key]??[],key);if(!s.day[key].every(text))throw Error('Invalid words');}
 s.log=array(s.log??[],'activity');if(!s.log.every(x=>kObject(x)&&text(x.x)&&text(x.t)&&Number.isFinite(Date.parse(x.t))))throw Error('Invalid activity');
 for(const name of ['gl','rd','dl','listening','speaking','missionXP','zeliShop','zeliAppearance','knowlyPath','writing'])if(s[name]!=null)record(s[name],name);
 for(const name of ['gl','rd'])for(const v of Object.values(s[name]||{})){record(v,name);for(const key of ['best','last'])if(v[key]!=null)v[key]=number(v[key]);if(v.s!=null&&!['new','progress','done'].includes(v.s))throw Error('Invalid lesson status');}
 for(const v of Object.values(s.dl||{})){record(v,'daily totals');for(const key of ['w','l','q'])v[key]=number(v[key]);}
 for(const name of ['listening','speaking'])for(const entries of Object.values(s[name]||{})){record(entries,name);for(const v of Object.values(entries)){record(v,name);for(const key of ['best','last','attempts'])if(v[key]!=null)v[key]=number(v[key]);}}
 if(s.cv!=null){array(s.cv,'custom vocabulary');if(!s.cv.every(v=>Array.isArray(v)&&v.length>=8&&v.every(text)))throw Error('Invalid custom vocabulary');}
 if(s.qh!=null){array(s.qh,'quiz history');for(const q of s.qh){record(q,'quiz');if(!['vocab','grammar','reading','mixed'].includes(q.type)||!text(q.id)||!Number.isFinite(Date.parse(q.at)))throw Error('Invalid quiz');q.score=number(q.score);q.total=number(q.total);q.dur=number(q.dur);if(!q.total||q.score>q.total)throw Error('Invalid quiz score');array(q.items,'answers');if(!q.items.every(i=>kObject(i)&&['q','u','a','e'].every(key=>text(i[key]))))throw Error('Invalid answer');}}
 if(s.knowlyPath){const k=s.knowlyPath;k.passed=array(k.passed??[],'passed levels');if(!k.passed.every(l=>levels.includes(l))||(k.start!=null&&!levels.includes(k.start)))throw Error('Invalid learning path');k.exams=record(k.exams??{},'exams');for(const v of Object.values(k.exams)){record(v,'exam');v.score=number(v.score);v.best=number(v.best);if(v.breakdown){array(v.breakdown,'exam breakdown');for(const b of v.breakdown){record(b,'section');if(!text(b.name))throw Error('Invalid section');b.score=number(b.score);b.total=number(b.total)}}}}
 if(s.missionXP){const x=s.missionXP;x.total=number(x.total);x.events=record(x.events??{},'XP events');x.claimed=record(x.claimed??{},'claimed rewards');}
 if(s.zeliShop){const z=s.zeliShop;z.coins=Math.floor(number(z.coins));z.creditedXP=number(z.creditedXP);z.owned=array(z.owned??[],'inventory');if(!z.owned.every(text))throw Error('Invalid inventory');z.owned=[...new Set(z.owned)];z.equipped=record(z.equipped??{},'outfit');if(!Object.values(z.equipped).every(text))throw Error('Invalid outfit');}

{id:"b1-pp",tb:{t:"Present perfect vs past simple",h:["Aspek","Present perfect","Past simple"],r:[["Rumus","have/has + V3","V2 / did + V1"],["Waktu","tidak disebut atau masih berhubungan","waktu jelas dan selesai"],["Penanda","ever, never, already, yet, just, since, for","yesterday, last week, in 2019, ago"],["Contoh","I have visited Bali.","I visited Bali last year."],["Fokus","pengalaman atau hasil sekarang","kejadian di masa lalu"]]},det:[["Dua cara memandang masa lalu","Past simple bercerita tentang kejadian yang <b>sudah selesai dan terputus dari sekarang</b>, biasanya dengan waktu jelas: <i>I visited Bali in 2019.</i> Present perfect menghubungkan masa lalu dengan sekarang: <i>I have visited Bali</i> (pengalaman yang masih relevan) atau <i>I have lost my keys</i> (hasilnya masih terasa: kunci hilang sekarang)."],["For dan since","Present perfect sering dipakai untuk kegiatan yang <b>berlanjut sampai sekarang</b>. <b>For</b> menyebut lamanya: <i>for three years</i>. <b>Since</b> menyebut titik awalnya: <i>since 2021, since Monday</i>. Contoh: <i>I have lived here for three years / since 2021.</i> Dengan past simple, kegiatan itu sudah berakhir: <i>I lived there for three years</i> (sekarang sudah pindah)."],["Pertanyaan umum","Gunakan present perfect untuk menanyakan pengalaman tanpa waktu: <i>Have you ever eaten durian?</i> Begitu waktunya jelas, beralih ke past simple: <i>Yes, I have. I ate it last year.</i> Pola ini sangat umum: pertanyaan pengalaman (present perfect), jawaban detail (past simple)."]],dl:[["Arif:","Have you ever been to Japan?","Pernahkah kamu ke Jepang?"],["Sinta:","Yes, I have. I went there in 2022 with my family.","Ya, pernah. Saya ke sana tahun 2022 bersama keluarga."],["Arif:","Did you like it?","Apakah kamu suka?"],["Sinta:","Very much! I’ve wanted to go back ever since.","Sangat! Saya ingin kembali ke sana sejak saat itu."]],nu:["Jangan pakai present perfect dengan waktu yang jelas: <i>I have seen him yesterday</i> salah, pakai <i>I saw him yesterday</i>.","Jangan pakai V2 setelah have: <i>has went</i> salah, yang benar <i>has gone</i>.","Jangan pakai present perfect untuk kejadian yang sudah berakhir dengan waktu pasti: <i>I have finished it at 5</i> salah.","Dalam percakapan santai, past simple kadang dipakai untuk pengalaman, tetapi dalam tulisan baku pakai present perfect: <i>Have you ever eaten durian?</i>"],rec:["Present perfect: have/has + V3, tanpa waktu jelas atau masih berhubungan dengan sekarang.","Past simple: kejadian selesai dengan waktu jelas.","For = lamanya, since = titik awal.","Ever, never, already, yet, just: penanda present perfect.","Yesterday, last week, ago, in 2019: penanda past simple."],eg2:[["She has worked here for two years.","Dia sudah bekerja di sini selama dua tahun."],["We didn’t see the film last night.","Kami tidak menonton film itu tadi malam."],["I haven’t finished my homework yet.","Saya belum menyelesaikan PR saya."],["When did you buy that bag?","Kapan kamu membeli tas itu?"]],q2:[["He ___ here since 2020. (live)",null,"has lived","Since + titik awal: present perfect.",["'s lived"]],["I ___ him yesterday. (see)",null,"saw","Yesterday: past simple."],["___ you finished your homework yet?",["Did","Have","Do"],"Have","Yet di pertanyaan: present perfect."]],t:"Present Perfect vs Past Simple",o:"Memilih present perfect atau past simple dengan tepat.",ex:"Present perfect dipakai untuk pengalaman atau kejadian masa lalu yang waktunya tidak disebut, atau yang masih berhubungan dengan sekarang. Past simple dipakai untuk kejadian selesai di waktu yang jelas (yesterday, in 2020, last week). Kata seperti ever, never, already, yet, just, since, dan for biasanya menandakan present perfect.",f:"Present perfect: Subject + have/has + V3 | Past simple: Subject + V2",ok:"I have visited Bali twice. / I visited Bali last year.",no:"I have visited Bali last year.",mist:"Orang Indonesia sering memakai present perfect bersama waktu lampau yang jelas, karena bahasa Indonesia tidak membedakan tense. Kalau waktunya disebut (yesterday, last year, in 2019), pakai past simple.",eg:[["She has lived here since 2019.","Dia sudah tinggal di sini sejak 2019."],["We went to the beach yesterday.","Kami pergi ke pantai kemarin."],["Have you ever eaten durian?","Pernahkah kamu makan durian?"]],q:[["I ___ my keys. I can’t open the door.",["lost","have lost","was losing"],"have lost","Hasilnya masih terasa sekarang (tidak bisa membuka pintu), jadi present perfect."],["She ___ to Japan in 2018.",["has gone","went","has been"],"went","Ada waktu yang jelas (in 2018), jadi past simple."],["They ___ (live) here for ten years.",null,"have lived","For + durasi sampai sekarang memakai present perfect.",["'ve lived"]],["___ you ever tried sushi?",["Did","Have","Do"],"Have","Ever menanyakan pengalaman hidup, jadi memakai Have you ever...?"],["I ___ (see) that movie last night.",null,"saw","Last night adalah waktu yang jelas, jadi past simple. V2 dari see adalah saw."]]},
{id:"b1-pc",tb:{t:"Bentuk past continuous",h:["Bentuk","Rumus","Contoh"],r:[["Positif","was/were + V-ing","I was cooking."],["Negatif","was/were + not + V-ing","She wasn’t sleeping."],["Pertanyaan","Was/Were + subject + V-ing?","Were you studying?"],["Dengan when","past continuous + when + past simple","I was walking when it rained."]]},det:[["Latar belakang cerita","Past continuous melukiskan <b>kegiatan yang sedang berlangsung</b> pada waktu tertentu di masa lalu: <i>At eight last night, I was watching TV.</i> Bentuk ini sering menjadi latar belakang cerita, sementara past simple menyebut kejadian yang memotongnya."],["When dan while","<b>While</b> diikuti kegiatan panjang (past continuous): <i>While I was cooking, the phone rang.</i> <b>When</b> diikuti kejadian pendek (past simple): <i>I was cooking when the phone rang.</i> Dua kegiatan panjang yang berjalan bersamaan: <i>While I was cooking, he was washing the dishes.</i>"],["Past continuous vs past simple","<i>I was reading a book</i> (sedang membaca, belum tentu selesai) berbeda dari <i>I read a book</i> (membaca sampai selesai). Past continuous menekankan proses, past simple menekankan hasil atau kejadian lengkap."]],dl:[["Polisi:","What were you doing at nine last night?","Apa yang sedang kamu lakukan jam sembilan semalam?"],["Hana:","I was studying in my room. My sister was watching TV.","Saya sedang belajar di kamar. Saudara saya sedang menonton TV."],["Polisi:","Did you hear anything?","Apakah kamu mendengar sesuatu?"],["Hana:","Yes. While I was studying, I heard a loud noise outside.","Ya. Saat sedang belajar, saya mendengar suara keras di luar."]],nu:["Jangan pakai past continuous untuk kejadian singkat yang selesai: <i>I was opening the door and went in</i> kurang tepat.","Jangan lupa was atau were: <i>She cooking</i> salah.","Jangan pakai past continuous dengan kata kerja keadaan: <i>I was knowing</i> salah, pakai <i>I knew</i>.","Jangan pakai while dengan kejadian pendek: <i>while the phone rang</i> kurang tepat."],rec:["Past continuous: was/were + V-ing.","Untuk kegiatan yang sedang berlangsung di masa lalu.","While + kegiatan panjang; when + kejadian pendek.","Past continuous = proses; past simple = kejadian atau hasil.","Kata kerja keadaan (know, like) tidak memakai -ing."],eg2:[["I was walking home when it started to rain.","Saya sedang berjalan pulang ketika hujan mulai turun."],["They were playing football at five o’clock.","Mereka sedang bermain sepak bola jam lima."],["What were you doing when I called?","Apa yang sedang kamu lakukan saat saya menelepon?"],["She wasn’t listening to the teacher.","Dia tidak sedang mendengarkan guru."]],q2:[["I ___ TV when the phone rang. (watch)",null,"was watching","Kegiatan yang terpotong: was + V-ing."],["While she ___, he was cooking dinner. (study)",null,"was studying","Dua kegiatan bersamaan: was + V-ing."],["We ___ when the power went off.",["were having dinner","had dinner","have dinner"],"were having dinner","Kegiatan yang terpotong: past continuous."]],t:"Past Continuous",o:"Menceritakan kejadian yang sedang berlangsung di masa lalu.",ex:"Past continuous menggambarkan kegiatan yang sedang berlangsung pada waktu tertentu di masa lalu. Sering dipakai bersama past simple: past continuous untuk latar yang lebih panjang, past simple untuk kejadian pendek yang memotongnya. Pakai while untuk kegiatan panjang dan when untuk kejadian pendek.",f:"Subject + was/were + V-ing",ok:"I was cooking when the phone rang.",no:"I cooking when the phone rang.",mist:"Lupa memakai was/were. Dalam bahasa Indonesia cukup 'sedang memasak', tetapi dalam bahasa Inggris to be (was/were) wajib ada.",eg:[["At 8 p.m. yesterday, I was studying.","Jam 8 malam kemarin, saya sedang belajar."],["While she was walking, it started to rain.","Saat dia berjalan, hujan mulai turun."],["They weren’t listening to the teacher.","Mereka tidak sedang mendengarkan guru."]],q:[["At 9 p.m. last night, we ___ dinner.",["had","were having","have had"],"were having","Kegiatan yang sedang berlangsung pada jam tertentu di masa lalu."],["I ___ TV when the power went out.",["watched","was watching","were watching"],"was watching","Subjek I memakai was, dan kegiatan itu terpotong oleh kejadian lain."],["She ___ (read) when I came in.",null,"was reading","Kegiatan yang sedang berlangsung lalu terpotong: was + V-ing."],["While he ___, his phone rang.",["drove","was driving","driving"],"was driving","While diikuti kegiatan panjang dalam past continuous."],["They ___ (not/listen) to the teacher.",null,"weren't listening","Negatif jamak: were not / weren’t + V-ing.",["were not listening"]]]},
{id:"b1-c1",tb:{t:"Bentuk first conditional",h:["Bagian","Rumus","Contoh"],r:[["Klausa if","If + present simple","If it rains,"],["Klausa hasil","will + V1","we will stay home."],["Urutan dibalik","will + V1 + if + present simple","We will stay home if it rains."],["Negatif","If + don’t / won’t","If you don’t study, you won’t pass."],["Dengan unless","unless = if ... not","Unless you hurry, you’ll be late."]]},det:[["Kemungkinan nyata","First conditional menyatakan <b>kemungkinan nyata</b> di masa depan: sesuatu yang mungkin terjadi, beserta akibatnya. <i>If you study, you will pass.</i> Bandingkan dengan second conditional yang membayangkan hal yang tidak nyata (<i>If I were rich...</i>)."],["Tense di tiap klausa","Klausa <b>if</b> memakai present simple (bukan will), meskipun artinya masa depan: <i>If it rains tomorrow...</i> Klausa hasil memakai will + kata kerja dasar. Jika klausa if di awal, pakai koma; jika di akhir, tanpa koma."],["Variasi: unless dan modal","<b>Unless</b> berarti kecuali atau if ... not: <i>Unless you hurry, you will be late.</i> Klausa hasil juga bisa memakai modal: <i>If you are tired, you should rest.</i> atau <i>If it is sunny, we might go to the beach.</i>"]],dl:[["Ibu:","If you finish your homework, you can play outside.","Kalau kamu menyelesaikan PR, kamu boleh bermain di luar."],["Rio:","If I finish quickly, will you buy me ice cream?","Kalau saya cepat selesai, apakah Ibu akan membelikan es krim?"],["Ibu:","I will if you don’t make a mess. And if it rains, we’ll stay home.","Akan, kalau kamu tidak berantakan. Dan kalau hujan, kita tinggal di rumah."]],nu:["Jangan pakai will di klausa if: <i>If it will rain</i> salah.","Jangan pakai first conditional untuk hal yang tidak nyata: pakai second conditional.","Jangan pakai unless dengan negatif ganda: <i>unless you don’t hurry</i> salah.","Jangan lupa koma jika klausa if di awal kalimat."],rec:["If + present simple, will + kata kerja dasar.","Klausa if tidak memakai will.","Unless = if ... not.","Klausa hasil bisa memakai modal: can, should, might.","Untuk kemungkinan nyata di masa depan."],eg2:[["If I see him, I’ll tell him.","Kalau saya bertemu dia, saya akan memberitahunya."],["We’ll miss the train if we don’t hurry.","Kita akan ketinggalan kereta kalau tidak bergegas."],["Unless you study, you won’t pass the exam.","Kecuali kamu belajar, kamu tidak akan lulus ujian."],["If it is sunny, we might go to the beach.","Kalau cerah, mungkin kita pergi ke pantai."]],q2:[["If you ___ hard, you will pass. (study)",null,"study","Klausa if: present simple."],["___ you hurry, you will be late. (negative meaning)",["Unless","If","When"],"Unless","Unless = if ... not."],["If it rains, we ___ at home. (stay)",null,"will stay","Klausa hasil: will + kata kerja dasar.",["'ll stay"]]],t:"First Conditional",o:"Membicarakan kemungkinan nyata di masa depan.",ex:"First conditional dipakai untuk situasi yang mungkin terjadi di masa depan beserta hasilnya. Klausa if memakai present simple, klausa hasil memakai will + V1. Jangan memakai will setelah if.",f:"If + present simple, will + V1",ok:"If it rains, I will stay at home.",no:"If it will rain, I will stay at home.",mist:"Memakai will di klausa if karena menerjemahkan 'jika nanti hujan'. Setelah if, pakai present simple.",eg:[["If you study hard, you will pass the exam.","Jika kamu belajar giat, kamu akan lulus ujian."],["She will be late if she misses the bus.","Dia akan terlambat jika ketinggalan bus."],["If I have time, I’ll call you.","Jika saya punya waktu, saya akan meneleponmu."]],q:[["If it ___ tomorrow, we will cancel the picnic.",["will rain","rains","rained"],"rains","Setelah if memakai present simple, bukan will."],["If you hurry, you ___ the train.",["catch","will catch","caught"],"will catch","Klausa hasil memakai will + V1."],["If she ___ (study) hard, she will pass.",null,"studies","Subjek she memakai present simple dengan akhiran -s."],["I ___ (call) you if I have time.",null,"will call","Klausa hasil: will + V1.",["'ll call"]],["Which sentence is correct?",["If I will see him, I will tell him.","If I see him, I will tell him.","If I saw him, I will tell him."],"If I see him, I will tell him.","If + present simple, will + V1."]]},
{id:"b1-md",tb:{t:"Modal verbs dan artinya",h:["Modal","Artinya","Contoh"],r:[["should","saran","You should rest."],["must","kewajiban kuat / kesimpulan","You must wear a seatbelt."],["have to","kewajiban dari aturan","I have to wear a uniform."],["might","mungkin (kecil)","It might rain."],["can / could","kemampuan, izin","Can I help you?"],["mustn’t / don’t have to","dilarang / tidak perlu","You mustn’t smoke. You don’t have to come."]]},det:[["Apa itu modal verb?","Modal verb (should, must, might, can, could) adalah kata kerja bantu yang menambah makna. Bentuknya <b>tidak berubah</b> untuk semua subjek (tidak ada <i>musts</i>), dan setelahnya langsung kata kerja dasar tanpa to. Negatif dan tanya tidak memakai do atau does: <i>Should I go?</i>"],["Tingkat kepastian dan kewajiban","Untuk kewajiban: must (kuat) dan have to (aturan) lebih kuat daripada should (saran). Untuk kemungkinan: <b>must</b> hampir pasti, <b>might</b> atau <b>may</b> mungkin, <b>can’t</b> hampir pasti tidak. Contoh: <i>He must be tired</i> (pasti lelah), <i>He might be at home</i> (mungkin di rumah)."],["Mustn’t dan don’t have to","Ini jebakan umum. <i>You mustn’t park here</i> berarti dilarang parkir. <i>You don’t have to park here</i> berarti tidak perlu parkir di sini (boleh di tempat lain). Arti keduanya sangat berbeda, jadi pilih dengan hati-hati."]],dl:[["Pelatih:","You should drink more water. You look tired.","Sebaiknya kamu minum lebih banyak air. Kamu tampak lelah."],["Doni:","I know. I have to get up at five every day.","Saya tahu. Saya harus bangun jam lima setiap hari."],["Pelatih:","You mustn’t skip breakfast. And you might feel better if you sleep more.","Kamu tidak boleh melewatkan sarapan. Dan mungkin kamu akan lebih baik kalau tidur lebih banyak."]],nu:["Jangan tambah to setelah should, must, might: <i>should to go</i> salah (kecuali have to).","Jangan tambah -s: <i>she musts</i> salah, tetapi <i>she has to</i> benar.","Jangan pakai do atau does dengan modal: <i>Do you must go?</i> salah.","Jangan menukar mustn’t dengan don’t have to."],rec:["Should = saran; must dan have to = kewajiban.","Might = mungkin; must = hampir pasti.","Mustn’t = dilarang; don’t have to = tidak perlu.","Modal tidak berubah bentuk dan diikuti kata kerja dasar tanpa to.","Have to berubah mengikuti subjek: has to, had to."],eg2:[["You should see a doctor.","Sebaiknya kamu ke dokter."],["He must be at home. His car is outside.","Dia pasti di rumah. Mobilnya di luar."],["I might be late tonight.","Saya mungkin terlambat malam ini."],["You don’t have to bring food. We have plenty.","Kamu tidak perlu membawa makanan. Kami punya banyak."]],q2:[["You ___ park here. It is forbidden.",["mustn’t","don’t have to","might"],"mustn’t","Dilarang: mustn’t."],["It is Sunday. I ___ go to school. (not necessary)",null,"don't have to","Tidak perlu: don’t have to.",["do not have to"]],["She ___ be at the party, but I am not sure. (possible)",null,"might","Kemungkinan kecil: might.",["may","could"]]],t:"Modal Verbs: should, must, have to, might",o:"Memakai should, must, have to, dan might dengan tepat.",ex:"Should dipakai untuk saran. Must untuk kewajiban kuat dari si pembicara, sedangkan have to untuk kewajiban dari aturan atau keadaan. Might untuk kemungkinan kecil. Setelah modal selalu bentuk dasar (V1) tanpa to, kecuali have to. Mustn’t artinya dilarang, sedangkan don’t have to artinya tidak perlu.",f:"Subject + should/must/might + V1 | Subject + have/has to + V1",ok:"You should see a doctor. / She must wear a uniform.",no:"You should to see a doctor.",mist:"Menambah to setelah should, must, atau might, dan menukar mustn’t dengan don’t have to. Mustn’t berarti dilarang, don’t have to berarti tidak wajib.",eg:[["You should drink more water.","Kamu sebaiknya minum lebih banyak air."],["You mustn’t park here.","Kamu dilarang parkir di sini."],["I don’t have to work on Sunday.","Saya tidak harus bekerja hari Minggu."]],q:[["You look tired. You ___ get some rest.",["must to","should","might to"],"should","Should untuk saran, dan tanpa to."],["Smoking is not allowed here. You ___ smoke.",["don’t have to","mustn’t","might"],"mustn’t","Mustn’t berarti dilarang."],["Tomorrow is a holiday. I ___ go to school.",["don’t have to","mustn’t","should to"],"don’t have to","Don’t have to berarti tidak perlu atau tidak wajib."],["It ___ rain later, so take an umbrella. (small possibility)",null,"might","Might untuk kemungkinan kecil.",["may"]],["Students ___ wear a uniform. It’s a school rule. (have to)",null,"have to","Aturan sekolah memakai have to atau must.",["must"]]]},
{id:"b1-c2",tb:{t:"Bentuk second conditional",h:["Bagian","Rumus","Contoh"],r:[["Klausa if","If + past simple","If I had a car,"],["Klausa hasil","would + V1","I would drive to work."],["Urutan dibalik","would + V1 + if + past simple","I would drive to work if I had a car."],["Dengan to be","If I were...","If I were you, I would apologize."],["Negatif","wouldn’t / didn’t","If I didn’t work, I wouldn’t have money."]]},det:[["Situasi yang tidak nyata","Second conditional dipakai untuk membayangkan <b>situasi yang tidak nyata atau sangat kecil kemungkinannya</b> di masa kini atau masa depan: <i>If I won the lottery, I would travel the world.</i> Kenyataannya saya belum menang; ini hanya pengandaian."],["Past simple bukan berarti masa lalu","Dalam klausa if, past simple hanya menandai bahwa situasinya <b>tidak nyata</b>, bukan masa lalu. Artinya tetap sekarang atau nanti. Itu sebabnya <i>If I had more time</i> berarti 'andai saya punya lebih banyak waktu (sekarang)'."],["If I were you dan saran","Untuk to be, bentuk <b>were</b> boleh dipakai untuk semua subjek, terutama dalam <i>If I were you...</i> yang sering dipakai untuk memberi saran: <i>If I were you, I would study harder.</i> Dalam percakapan santai, <i>was</i> juga sering terdengar."]],dl:[["Lia:","What would you do if you won a million dollars?","Apa yang akan kamu lakukan kalau menang satu juta dolar?"],["Bimo:","I would buy a house and travel around the world.","Saya akan membeli rumah dan berkeliling dunia."],["Lia:","If I were you, I would save some money too.","Kalau saya jadi kamu, saya juga akan menabung."],["Bimo:","You’re right. If I had a lot of money, I would probably spend it all!","Benar. Kalau saya punya banyak uang, mungkin saya akan menghabiskan semuanya!"]],nu:["Jangan pakai would di klausa if: <i>If I would have time</i> salah.","Jangan pakai present simple untuk pengandaian: <i>If I have a car, I would drive</i> mencampur dua jenis kalimat.","Jangan pakai second conditional untuk kemungkinan nyata: pakai first conditional (<i>If it rains, I will stay home</i>).","Jangan pakai would di kedua klausa: <i>If I would know, I would tell</i> salah."],rec:["If + past simple, would + kata kerja dasar.","Untuk situasi tidak nyata di masa kini atau masa depan.","Klausa if tidak memakai would.","If I were you... untuk memberi saran.","Kemungkinan nyata: first conditional."],eg2:[["If I had a car, I would drive to work.","Kalau saya punya mobil, saya akan menyetir ke tempat kerja."],["She would travel more if she had more money.","Dia akan lebih banyak bepergian kalau punya lebih banyak uang."],["If I were you, I wouldn’t buy that phone.","Kalau saya jadi kamu, saya tidak akan membeli ponsel itu."],["What would you do if you lost your keys?","Apa yang akan kamu lakukan kalau kehilangan kuncimu?"]],q2:[["If I ___ more time, I would learn Spanish. (have)",null,"had","Klausa if: past simple."],["If I ___ you, I would apologize. (be)",null,"were","If I were you: saran."],["She ___ happier if she moved to the beach.",["would be","will be","is"],"would be","Klausa hasil second conditional: would + kata kerja dasar."]],t:"Second Conditional",o:"Mengandaikan situasi yang tidak nyata di masa kini atau masa depan.",ex:"Second conditional dipakai untuk situasi yang tidak nyata atau sangat kecil kemungkinannya, yaitu pengandaian. Klausa if memakai past simple, klausa hasil memakai would + V1. Untuk to be, bentuk were boleh dipakai untuk semua subjek (If I were you...).",f:"If + past simple, would + V1",ok:"If I won the lottery, I would travel the world.",no:"If I would win the lottery, I would travel the world.",mist:"Memakai would di klausa if, atau memakai present simple untuk pengandaian. Past simple di sini bukan berarti masa lalu, tetapi menandai situasi yang tidak nyata.",eg:[["If I had more time, I would learn French.","Jika saya punya lebih banyak waktu, saya akan belajar bahasa Prancis."],["If I were you, I would talk to her.","Jika saya jadi kamu, saya akan bicara dengannya."],["She would buy a car if she had enough money.","Dia akan membeli mobil jika uangnya cukup."]],q:[["If I ___ rich, I would buy a big house.",["am","were","will be"],"were","Pengandaian tidak nyata memakai past simple (were)."],["If she had more time, she ___ a course.",["will take","would take","takes"],"would take","Klausa hasil second conditional memakai would + V1."],["If I ___ (have) a car, I would drive to work.",null,"had","Klausa if memakai past simple."],["I ___ (help) you if I knew the answer.",null,"would help","Klausa hasil: would + V1.",["'d help"]],["Which sentence is an unreal situation?",["If it rains, I will stay home.","If I won a prize, I would share it.","If you heat ice, it melts."],"If I won a prize, I would share it.","Past simple + would menandakan pengandaian yang tidak nyata."]]},
{id:"b1-ps",tb:{t:"Bentuk pasif",h:["Tense","Rumus","Contoh"],r:[["Present simple","am/is/are + V3","English is spoken here."],["Past simple","was/were + V3","The window was broken."],["Will","will be + V3","It will be finished soon."],["Dengan pelaku","... + by + agent","The book was written by Rowling."],["Negatif","be + not + V3","It isn’t made in Japan."]]},det:[["Kapan memakai pasif?","Pasif dipakai ketika <b>pelakunya tidak penting, tidak diketahui, atau sudah jelas</b>, dan kita lebih fokus pada tindakan atau hasilnya: <i>My bike was stolen.</i> (tidak tahu siapa pencurinya). Dalam berita dan teks resmi, pasif sangat umum."],["Cara membuatnya","Ambil objek kalimat aktif menjadi subjek, lalu pakai <b>to be + V3</b> sesuai tense. Aktif: <i>Someone cleaned the room.</i> Pasif: <i>The room was cleaned.</i> Tambahkan <b>by + pelaku</b> hanya jika pelaku penting: <i>The room was cleaned by Rina.</i>"],["Aktif vs pasif","Aktif: <i>The chef cooked the meal.</i> (fokus pada chef). Pasif: <i>The meal was cooked by the chef.</i> (fokus pada hidangan). Pilihannya bergantung pada apa yang ingin ditekankan, bukan soal benar atau salah."]],dl:[["Wartawan:","When was this bridge built?","Kapan jembatan ini dibangun?"],["Warga:","It was built in 1995. It’s used by thousands of people every day.","Dibangun tahun 1995. Jembatan ini dipakai ribuan orang setiap hari."],["Wartawan:","Is it still in good condition?","Apakah masih dalam kondisi baik?"],["Warga:","Yes, but it will be repaired next month.","Ya, tetapi akan diperbaiki bulan depan."]],nu:["Jangan lupa to be: <i>The window broken</i> salah, yang benar <i>The window was broken</i>.","Jangan pakai V1 atau V2 setelah to be: <i>was break</i> salah, pakai <i>was broken</i>.","Jangan pasifkan kata kerja tanpa objek: <i>I was arrived</i> salah, karena <i>arrive</i> tidak bisa dipasifkan.","Jangan pakai by + pelaku jika pelakunya tidak penting atau tidak diketahui."],rec:["Pasif: to be + V3.","Subjek pasif adalah objek kalimat aktif.","By + pelaku hanya jika penting.","Present: am/is/are + V3; past: was/were + V3; future: will be + V3.","Kata kerja tanpa objek (arrive, happen) tidak punya bentuk pasif."],eg2:[["The cake was made by my mother.","Kue itu dibuat oleh ibu saya."],["Rice is grown in many countries.","Beras ditanam di banyak negara."],["This room is cleaned every day.","Ruangan ini dibersihkan setiap hari."],["The meeting will be held on Monday.","Rapat akan diadakan hari Senin."]],q2:[["This house ___ in 1990. (build)",null,"was built","Past simple pasif: was + V3."],["English ___ in many countries. (speak)",null,"is spoken","Present simple pasif: is + V3."],["The letter ___ by my teacher.",["was written","wrote","was write"],"was written","Past simple pasif: was + V3."]],t:"Passive Voice (Basic)",o:"Membuat kalimat pasif sederhana dengan to be + V3.",ex:"Passive voice dipakai ketika yang penting adalah objek atau hasil tindakan, bukan pelakunya. Objek kalimat aktif menjadi subjek, dan kata kerjanya memakai to be + V3. Pelaku bisa ditambahkan dengan by jika perlu. Tense ditentukan oleh bentuk to be.",f:"Subject + be (am/is/are/was/were) + V3 (+ by agent)",ok:"The cake was made by my mother.",no:"The cake was make by my mother.",mist:"Lupa memakai to be atau V3. Bahasa Indonesia memakai 'di-' (dibuat, dimakan), sedangkan bahasa Inggris butuh to be + V3.",eg:[["English is spoken in many countries.","Bahasa Inggris dipakai di banyak negara."],["The window was broken yesterday.","Jendela itu dipecahkan kemarin."],["These cars are made in Japan.","Mobil-mobil ini dibuat di Jepang."]],q:[["This house ___ in 1990.",["built","was built","is build"],"was built","Waktu lampau (1990) dan pasif: was + V3."],["Rice ___ in many Asian countries.",["is grown","grows by","is grow"],"is grown","Fakta umum dalam bentuk pasif: is + V3."],["The letter ___ (write) yesterday.",null,"was written","Yesterday memakai was + V3. V3 dari write adalah written."],["English ___ (speak) all over the world.",null,"is spoken","Fakta umum pasif: is + V3."],["Change to passive: They cleaned the room.",["The room was cleaned by them.","The room cleaned by them.","The room is cleaned them."],"The room was cleaned by them.","Past simple pasif: was/were + V3 + by."]]},
{id:"b1-rc",tb:{t:"Who, which, that, whose",h:["Kata","Untuk","Contoh"],r:[["who","orang","The man who called is my uncle."],["which","benda atau hewan","The book which I bought is good."],["that","orang atau benda","The phone that I bought is fast."],["whose","kepemilikan","The girl whose bag is red is Dina."],["(tanpa kata hubung)","objek, boleh dihilangkan","The book I bought is good."]]},det:[["Menjelaskan benda atau orang","Relative clause menjelaskan <b>kata benda yang mendahuluinya</b> sehingga kita tidak perlu membuat kalimat baru: <i>I know a man. He speaks five languages.</i> menjadi <i>I know a man who speaks five languages.</i> Who, which, dan that menggantikan subjek atau objek."],["Who, which, that","<b>Who</b> untuk orang, <b>which</b> untuk benda dan hewan, <b>that</b> bisa untuk keduanya (lebih umum dalam percakapan). <b>Whose</b> menunjukkan kepemilikan dan diikuti kata benda: <i>the girl whose bag is red.</i> Jangan ulangi subjek setelah who atau which."],["Kapan kata hubung boleh dihilangkan","Kalau kata hubung adalah <b>objek</b> dari klausa (bukan subjek), boleh dihilangkan: <i>The book that I bought</i> boleh menjadi <i>The book I bought</i>. Kalau kata hubung adalah <b>subjek</b>, tidak boleh: <i>The man who called</i> tidak boleh menjadi <i>The man called</i>."]],dl:[["Pelanggan:","I’m looking for a shirt which is blue and cheap.","Saya mencari kemeja yang berwarna biru dan murah."],["Penjual:","The one that is on the left is blue. The girl who works here can help you.","Yang di sebelah kiri berwarna biru. Gadis yang bekerja di sini bisa membantu Anda."],["Pelanggan:","Great. Is that the shop whose owner is very friendly?","Bagus. Apakah ini toko yang pemiliknya sangat ramah?"]],nu:["Jangan ulangi subjek: <i>The man who he called</i> salah.","Jangan pakai who untuk benda dan which untuk orang.","Jangan hilangkan kata hubung yang berfungsi sebagai subjek.","Jangan pakai what sebagai pengganti that: <i>the book what I bought</i> salah."],rec:["Who = orang; which = benda; that = keduanya.","Whose = kepemilikan.","Jangan ulangi subjek setelah who atau which.","Kata hubung objek boleh dihilangkan.","Kata hubung subjek tidak boleh dihilangkan."],eg2:[["The woman who lives next door is a nurse.","Wanita yang tinggal di sebelah adalah seorang perawat."],["The film that we watched was boring.","Film yang kami tonton membosankan."],["I have a friend whose father is a pilot.","Saya punya teman yang ayahnya seorang pilot."],["This is the restaurant I told you about.","Ini restoran yang saya ceritakan kepadamu."]],q2:[["The man ___ called you is my uncle.",["who","which","whose"],"who","Orang sebagai subjek: who."],["This is the book ___ I bought yesterday.",["which","who","whose"],"which","Benda sebagai objek: which atau that."],["I know a girl ___ father is a doctor.",null,"whose","Kepemilikan: whose."]],t:"Relative Clauses: who, which, that",o:"Memberi informasi tambahan tentang orang dan benda.",ex:"Relative clause memberi informasi tambahan tentang orang atau benda. Who untuk orang, which untuk benda, that untuk orang atau benda, dan whose untuk kepemilikan. Kata penghubung ini sudah menggantikan subjek, jadi subjeknya tidak disebut lagi.",f:"Noun + who/which/that + verb",ok:"The man who lives next door is a doctor.",no:"The man who he lives next door is a doctor.",mist:"Mengulang subjek setelah who atau which (who he, which it), padahal kata itu sudah menggantikannya. Juga sering tertukar antara who dan which.",eg:[["The girl who called you is my sister.","Gadis yang meneleponmu adalah adikku."],["This is the book which I told you about.","Ini buku yang kuceritakan kepadamu."],["The phone that I bought is very fast.","Ponsel yang saya beli sangat cepat."]],q:[["The woman ___ works here is my aunt.",["which","who","whose"],"who","Who untuk orang."],["This is the laptop ___ I bought last week.",["who","which","whose"],"which","Which untuk benda."],["The man ___ lives next door is a doctor. (who/that)",null,"who","Who atau that untuk orang.",["that"]],["I know a girl ___ father is a pilot.",["who","which","whose"],"whose","Whose menunjukkan kepemilikan."],["Which sentence is correct?",["The book which it is on the table is mine.","The book which is on the table is mine.","The book who is on the table is mine."],"The book which is on the table is mine.","Jangan mengulang subjek (it) setelah which."]]},
{id:"b1-rs",tb:{t:"Pergeseran tense",h:["Kalimat langsung","Kalimat tidak langsung"],r:[["present simple","past simple"],["present continuous","past continuous"],["present perfect","past perfect"],["past simple","past perfect"],["will","would"],["can","could"],["now / today / tomorrow","then / that day / the next day"]]},det:[["Menyampaikan ucapan orang lain","Reported speech dipakai untuk <b>menyampaikan apa yang dikatakan orang lain</b> tanpa mengutip persis. Kalimat langsung: <i>“I am tired,” she said.</i> Kalimat tidak langsung: <i>She said that she was tired.</i> Kata <i>that</i> boleh dihilangkan."],["Tense bergeser dan kata lain berubah","Kalau kata kerja pelaporan berbentuk lampau (said, told), tense biasanya <b>mundur satu langkah</b>. Pronoun menyesuaikan sudut pandang (I menjadi she atau he), dan kata waktu berubah: now menjadi then, today menjadi that day, tomorrow menjadi the next day, dan here menjadi there."],["Said dan told","<b>Said</b> tidak diikuti orang: <i>She said that she was tired.</i> <b>Told</b> harus diikuti orang: <i>She told me that she was tired.</i> Jadi <i>She said me</i> salah dan <i>She told that</i> juga salah."]],dl:[["Ibu:","What did the teacher say?","Gurumu bilang apa?"],["Putra:","She said that we had a test the next day.","Dia bilang besok kami ada tes."],["Ibu:","Did she tell you what to study?","Apakah dia memberi tahu apa yang harus dipelajari?"],["Putra:","Yes, she told us that we should review chapters four and five.","Ya, dia bilang kami sebaiknya mengulang bab empat dan lima."]],nu:["Jangan pakai said dengan orang: <i>She said me</i> salah, pakai <i>told me</i>.","Jangan lupa mengubah pronoun dan kata waktu: <i>He said that I am tired</i> perlu disesuaikan.","Jangan pertahankan urutan pertanyaan (<i>He asked where was I</i>) pada pertanyaan yang dilaporkan.","Jangan geser tense jika kenyataannya masih berlaku sekarang: <i>She said the earth is round</i> boleh tetap present."],rec:["Said + that; told + orang + that.","Tense mundur satu langkah setelah said atau told (lampau).","Now menjadi then; today menjadi that day; tomorrow menjadi the next day.","Pronoun menyesuaikan sudut pandang pelapor.","Fakta yang masih berlaku boleh tidak digeser."],eg2:[["He said that he was busy.","Dia bilang dia sedang sibuk."],["She told me that she would call me.","Dia memberi tahu saya bahwa dia akan menelepon saya."],["They said they had finished.","Mereka bilang mereka sudah selesai."],["Tom told us that he couldn’t come.","Tom memberi tahu kami bahwa dia tidak bisa datang."]],q2:[["“I like pizza,” he said. He said that he ___ pizza. (like)",null,"liked","Present simple menjadi past simple."],["“I will call you,” she said. She said she ___ call me.",["would","will","can"],"would","Will menjadi would."],["She ___ me that she was tired.",["told","said","say"],"told","Told harus diikuti orang."]],t:"Reported Speech (Basic)",o:"Menyampaikan ucapan orang lain dengan tense yang bergeser.",ex:"Reported speech dipakai untuk menyampaikan ucapan orang lain. Biasanya tense mundur satu langkah: present simple menjadi past simple, will menjadi would, am/is/are going to menjadi was/were going to. Kata waktu seperti now, today, dan tomorrow juga berubah (then, that day, the next day), dan pronoun menyesuaikan.",f:"Subject + said/told + (that) + clause (tense mundur satu langkah)",ok:"She told me that she was tired.",no:"She said me that she was tired.",mist:"Tertukar said dan told. Said tidak diikuti orang (said that...), sedangkan told harus diikuti orang (told me that...). Selain itu, sering lupa menggeser tense.",eg:[["He said he was busy.","Dia bilang dia sedang sibuk."],["She told me that she would call.","Dia memberi tahu saya bahwa dia akan menelepon."],["They said they were living in Bandung.","Mereka bilang mereka tinggal di Bandung."]],q:[["\u201cI am tired,\u201d she said. She said that she ___ tired.",["is","was","will be"],"was","Present simple (am) mundur menjadi past simple (was)."],["\u201cI will call you,\u201d he said. He said he ___ call me.",["will","would","can"],"would","Will mundur menjadi would."],["\u201cI like pizza,\u201d Tom said. Tom said he ___ pizza.",null,"liked","Present simple (like) mundur menjadi past simple (liked)."],["She ___ me that she was busy.",["said","told","say"],"told","Told harus diikuti orang (told me)."],["\u201cWe are going to leave,\u201d they said. They said they ___ going to leave.",null,"were","Are mundur menjadi were."]]},
{id:"b1-cs",t:"Comparatives & Superlatives",o:"Membandingkan dua hal dan menyatakan yang paling.",ex:"Comparative membandingkan dua hal, superlative menunjukkan yang paling di antara tiga hal atau lebih. Kata sifat pendek memakai -er dan the -est (taller, the tallest), kata sifat panjang memakai more dan the most (more expensive, the most expensive). Ada bentuk tidak beraturan: good, better, best dan bad, worse, worst. Pakai than setelah comparative dan the sebelum superlative.",f:"Short: adj + -er than / the + adj + -est | Long: more + adj + than / the most + adj",ok:"This bag is cheaper than that one.",no:"This bag is more cheap than that one.",mist:"Memakai more bersama kata sifat pendek (more cheap), atau lupa the pada superlative. Juga salah membentuk good dan bad (gooder, badder).",eg:[["My brother is taller than me.","Kakak saya lebih tinggi daripada saya."],["This is the most interesting book I have read.","Ini buku paling menarik yang pernah saya baca."],["Today is better than yesterday.","Hari ini lebih baik daripada kemarin."]],q:[["Jakarta is ___ than Bandung.",["big","bigger","more big"],"bigger","Kata sifat pendek + -er + than."],["This is ___ film I have ever seen.",["the most boring","more boring","the boringest"],"the most boring","Kata sifat panjang memakai the most untuk superlative."],["My phone is ___ (good) than yours.",null,"better","Bentuk tidak beraturan: good, better, best."],["She is the ___ (tall) girl in the class.",null,"tallest","Superlative kata sifat pendek: the + -est."],["Which is correct?",["It is more cheap than that one.","It is cheaper than that one.","It is cheapest than that one."],"It is cheaper than that one.","Cheap adalah kata sifat pendek, jadi cheaper than."]]},
{id:"b1-fu",t:"Future: will, going to, Present Continuous",o:"Memilih bentuk masa depan yang sesuai.",ex:"Will dipakai untuk keputusan spontan, prediksi, dan janji. Be going to dipakai untuk rencana atau niat yang sudah ada, dan untuk prediksi berdasarkan bukti yang terlihat. Present continuous dipakai untuk rencana yang sudah diatur, misalnya ada jadwal atau janji dengan orang lain.",f:"will + V1 | am/is/are going to + V1 | am/is/are + V-ing",ok:"I’m meeting my teacher at 5. / Look at the clouds! It’s going to rain.",no:"I will meeting my teacher at 5.",mist:"Memakai will untuk semua masa depan, padahal rencana yang sudah ada lebih tepat memakai be going to atau present continuous. Juga salah menyusun will + V-ing.",eg:[["I’ll help you with that bag.","Biar saya bantu dengan tas itu."],["We are going to visit Bali next month.","Kami akan mengunjungi Bali bulan depan."],["I’m meeting Sarah at 7 tonight.","Saya akan bertemu Sarah jam 7 malam ini."]],q:[["The phone is ringing. I ___ answer it.",["am going to","will","am answering"],"will","Keputusan spontan memakai will."],["Look at those black clouds! It ___ rain.",["will","is going to","is raining"],"is going to","Prediksi dengan bukti yang terlihat memakai be going to."],["I ___ (meet) my teacher at 5 p.m. tomorrow. (arranged)",null,"am meeting","Rencana yang sudah diatur memakai present continuous.",["'m meeting"]],["I have decided. I ___ study medicine.",["will","am going to","study"],"am going to","Niat yang sudah diputuskan memakai be going to."],["Don’t worry. I ___ (help) you with that.",null,"will help","Janji atau tawaran spontan memakai will.",["'ll help"]]]}
,
{id:"b1-ppc",tb:{t:"Present Perfect Continuous",h:["Bagian","Rumus","Contoh"],r:[["Positif","have/has + been + V-ing","She has been studying."],["Negatif","have/has + not + been + V-ing","I haven’t been sleeping well."],["Pertanyaan","Have/Has + subject + been + V-ing?","Have you been waiting?"],["Fokus","durasi atau proses yang masih berlangsung / baru saja berhenti","It has been raining for hours."]]},det:[["Menekankan proses dan durasi","Present perfect continuous dipakai untuk kegiatan yang dimulai di masa lalu dan masih berlangsung sekarang, atau baru saja berhenti tetapi efeknya masih terlihat. Fokusnya adalah <b>proses atau berapa lama kegiatan berlangsung</b>: <i>I have been studying for two hours.</i>"],["For dan since","Gunakan <b>for</b> untuk durasi (<i>for two hours</i>) dan <b>since</b> untuk titik awal (<i>since 8 a.m.</i>): <i>She has been working here for three years.</i>"],["Perbedaan dengan present perfect simple","Present perfect simple lebih menekankan hasil atau jumlah: <i>I have written three emails.</i> Present perfect continuous menekankan aktivitas atau durasi: <i>I have been writing emails all morning.</i> Kata kerja keadaan seperti know, own, dan believe biasanya tidak digunakan dalam bentuk continuous."]],dl:[["Mira:","You look tired. What have you been doing?","Kamu terlihat lelah. Apa yang sedang kamu lakukan?"],["Dani:","I have been preparing for my English exam all morning.","Saya sudah belajar untuk ujian bahasa Inggris sepanjang pagi."],["Mira:","How long have you been studying?","Sudah berapa lama kamu belajar?"],["Dani:","I have been studying since seven o’clock.","Saya sudah belajar sejak pukul tujuh."]],nu:["Jangan hilangkan been: <i>I have studying</i> salah; gunakan <i>I have been studying</i>.","Jangan gunakan V3 setelah been: <i>has been worked</i> salah untuk bentuk ini; gunakan V-ing.","Jangan otomatis memakai bentuk continuous dengan kata kerja keadaan seperti know, believe, atau own. Biasanya gunakan present perfect simple: <i>I have known her for years.</i>","Bedakan durasi dan hasil: <i>She has been reading for an hour</i> menekankan proses, sedangkan <i>She has read the book</i> menekankan hasil."],rec:["Rumus: have/has + been + V-ing.","Gunakan untuk proses atau durasi yang berhubungan dengan sekarang.","For = durasi; since = titik awal.","Present perfect simple sering menekankan hasil atau jumlah.","Kata kerja keadaan biasanya tidak dipakai dalam bentuk continuous."],eg2:[["They have been playing football for an hour.","Mereka sudah bermain sepak bola selama satu jam."],["It has been raining since this morning.","Hujan sudah turun sejak pagi ini."],["Have you been waiting long?","Apakah kamu sudah menunggu lama?"],["I have known him since primary school.","Saya sudah mengenalnya sejak sekolah dasar."]],q2:[["She ___ (study) for three hours.","","has been studying","Present perfect continuous: has + been + V-ing.",["'s been studying"]],["We have been waiting ___ 9 a.m.",["for","since","during"],"since","Since diikuti titik awal waktu."],["He ___ (not/sleep) well recently.","","has not been sleeping","Negatif: has not + been + V-ing.",["hasn't been sleeping"]]],t:"Present Perfect Continuous",o:"Menjelaskan aktivitas yang berlangsung sejak masa lalu dan masih berhubungan dengan sekarang.",ex:"Present perfect continuous menekankan proses atau durasi kegiatan yang dimulai di masa lalu dan masih berlangsung sekarang, atau baru saja berhenti dengan efek yang masih terlihat. Gunakan have/has + been + V-ing. For menyatakan durasi, sedangkan since menyatakan titik awal.",f:"Subject + have/has + been + V-ing",ok:"I have been learning English for two years.",no:"I have learning English for two years.",mist:"Sering lupa menambahkan been setelah have/has. Ingat urutannya: have/has + been + kata kerja -ing.",eg:[["I have been reading for an hour.","Saya sudah membaca selama satu jam."],["She has been working here since 2022.","Dia sudah bekerja di sini sejak 2022."],["Have they been practicing today?","Apakah mereka sudah berlatih hari ini?"]],q:[["I ___ English since this morning.",["have been studying","has been studying","am study"],"have been studying","Subjek I memakai have + been + V-ing."],["How long ___ she been working here?",["have","has","is"],"has","Subjek she memakai has."],["They ___ (play) football for two hours.","","have been playing","They + have been + V-ing."],["I ___ him for ten years.",["have been knowing","have known","am knowing"],"have known","Know adalah stative verb dan biasanya tidak dipakai dalam bentuk continuous."],["Which sentence emphasizes the activity's duration?",["I have finished my homework.","I have been doing my homework for two hours.","I did my homework yesterday."],"I have been doing my homework for two hours.","Present perfect continuous menekankan proses dan durasi."]]},
{id:"b1-pf",tb:{t:"Past Perfect",h:["Bagian","Rumus","Contoh"],r:[["Positif","had + V3","She had left."],["Negatif","had not + V3","They hadn’t eaten."],["Pertanyaan","Had + subject + V3?","Had you seen it?"],["Urutan kejadian","Past perfect (lebih dulu) + past simple (kemudian)","The train had left before we arrived."]]},det:[["Dua kejadian di masa lalu","Past perfect digunakan untuk menunjukkan bahwa satu kejadian <b>sudah terjadi lebih dahulu</b> sebelum kejadian lain di masa lalu. Kejadian yang lebih awal memakai past perfect; kejadian berikutnya biasanya memakai past simple: <i>When I arrived, the meeting had started.</i>"],["Before, after, dan by the time","Kata <b>before</b>, <b>after</b>, dan <b>by the time</b> sering membantu menunjukkan urutan. <i>She had finished dinner before her guests arrived.</i> Past perfect menegaskan bahwa makan malam selesai lebih dulu."],["Past perfect bukan untuk semua kejadian lampau","Jangan memakai past perfect hanya karena suatu kejadian terjadi di masa lalu. Jika urutan waktunya sudah jelas dan tidak perlu ditekankan, past simple sering cukup. Past perfect terutama berguna untuk memperjelas kejadian yang lebih dahulu terjadi."]],dl:[["Raka:","Why were you late for class?","Kenapa kamu terlambat masuk kelas?"],["Nina:","The bus had already left when I reached the stop.","Busnya sudah berangkat ketika saya sampai di halte."],["Raka:","Had you checked the schedule?","Apakah kamu sudah memeriksa jadwalnya?"],["Nina:","No, I hadn’t checked it the night before.","Belum, saya tidak memeriksanya malam sebelumnya."]],nu:["Jangan gunakan V2 setelah had: <i>had went</i> salah; bentuk yang benar <i>had gone</i>.","Jangan gunakan have/has untuk past perfect: gunakan had untuk semua subjek.","Jangan tertukar urutan: kejadian yang lebih dahulu memakai past perfect.","Jangan memakai past perfect untuk setiap kejadian lampau tanpa alasan; past simple tetap digunakan untuk urutan cerita biasa."],rec:["Rumus: had + V3 untuk semua subjek.","Past perfect menandai kejadian yang terjadi lebih dahulu daripada kejadian lampau lain.","Past simple biasanya menandai kejadian yang terjadi kemudian.","Before, after, dan by the time sering muncul dalam konteks ini.","Past perfect bukan pengganti past simple untuk semua cerita masa lalu."],eg2:[["The film had started before we entered the cinema.","Filmnya sudah dimulai sebelum kami masuk ke bioskop."],["She had never flown before she travelled to Japan.","Dia belum pernah naik pesawat sebelum bepergian ke Jepang."],["Had you finished the report when the manager called?","Apakah kamu sudah menyelesaikan laporan ketika manajer menelepon?"],["They hadn’t eaten, so they were very hungry.","Mereka belum makan, jadi sangat lapar."]],q2:[["When we arrived, the lesson ___ (already/start).","","had already started","Kegiatan mulai lebih dahulu: had + V3."],["She ___ (not/see) snow before she moved abroad.","","had not seen","Negatif past perfect: had not + V3.",["hadn't seen"]],["___ he left before you arrived?",["Had","Has","Did"],"Had","Pertanyaan past perfect dimulai dengan Had." ]],t:"Past Perfect",o:"Menjelaskan kejadian yang sudah selesai sebelum kejadian lain di masa lalu.",ex:"Past perfect menunjukkan kejadian yang terjadi lebih dahulu sebelum kejadian lain di masa lalu. Gunakan had + V3 untuk semua subjek. Kejadian yang terjadi kemudian biasanya menggunakan past simple.",f:"Subject + had + V3",ok:"The train had left before we arrived.",no:"The train has left before we arrived.",mist:"Menggunakan have/has karena menerjemahkan 'sudah'. Untuk kejadian yang lebih dahulu dari kejadian lampau lain, gunakan had + V3.",eg:[["I had finished my work before dinner.","Saya sudah menyelesaikan pekerjaan sebelum makan malam."],["They had gone home when I called.","Mereka sudah pulang ketika saya menelepon."],["Had you met her before the event?","Apakah kamu pernah bertemu dengannya sebelum acara itu?"]],q:[["By the time I arrived, the shop ___.",["had closed","has closed","closes"],"had closed","Toko tutup lebih dahulu sebelum saya tiba."],["He ___ the email before the meeting started.",["had sent","has sent","sends"],"had sent","Kejadian mengirim email terjadi lebih dahulu."],["We ___ (not/finish) dinner when the guests arrived.","","had not finished","Negatif past perfect: had not + V3.",["hadn't finished"]],["___ they left before the rain started?",["Have","Had","Did"],"Had","Pertanyaan past perfect: Had + subject + V3?"],["Which sentence shows the earlier past action?",["I arrived after the train had left.","I have arrived after the train leaves.","I arrive before the train had left."],"I arrived after the train had left.","Past perfect menandai kejadian yang terjadi lebih dahulu dalam konteks masa lalu."]]}

{id:"b1-used",t:"Used to, Would, and Be Used to",o:"Membicarakan kebiasaan masa lalu dan sesuatu yang sudah biasa dilakukan.",ex:"Used to + V1 menyatakan kebiasaan atau keadaan di masa lalu yang sekarang sudah berubah. Would + V1 dapat menyatakan tindakan berulang di masa lalu, tetapi biasanya tidak untuk keadaan. Be used to + noun/V-ing berarti sudah terbiasa, sedangkan get used to berarti sedang menjadi terbiasa.",f:"Kebiasaan lampau: used to + V1 | Terbiasa: be/get used to + noun atau V-ing",ok:"I used to play outside every afternoon. / I am used to waking up early.",no:"I am used to wake up early.",mist:"Jangan samakan used to dengan be used to. Setelah used to untuk kebiasaan lampau gunakan V1; setelah be/get used to gunakan kata benda atau V-ing.",eg:[["I used to live in a small village.","Dulu saya tinggal di desa kecil."],["When we were children, we would visit our grandparents every Sunday.","Saat masih kecil, kami biasa mengunjungi kakek-nenek setiap Minggu."],["She is used to speaking in public.","Dia sudah terbiasa berbicara di depan umum."],["I am getting used to my new school.","Saya sedang mulai terbiasa dengan sekolah baru."]],q:[["I ___ play football every day, but now I rarely do.",["use to","used to","am used to"],"used to","Kebiasaan masa lalu yang sekarang berubah: used to + V1."],["He is used to ___ up early.",["wake","waking","woke"],"waking","Be used to diikuti noun atau V-ing."],["We ___ visit our aunt every holiday when we were young.",["would","are used to","get used"],"would","Would dapat menyatakan tindakan berulang di masa lalu."],["It took me a month to get used to ___ alone.",["live","living","lived"],"living","Get used to diikuti noun atau V-ing."],["Which sentence describes a past state?",["I used to know him.","I would know him.","I am used to know him."],"I used to know him.","Used to dapat dipakai untuk keadaan di masa lalu."]]},
{id:"b1-ger",t:"Gerunds and Infinitives",o:"Memilih bentuk V-ing atau to + verb setelah kata kerja tertentu.",ex:"Beberapa kata kerja diikuti gerund (V-ing), seperti enjoy, avoid, finish, dan suggest. Kata kerja lain diikuti infinitive (to + V1), seperti want, decide, hope, dan plan. Ada juga kata kerja yang dapat diikuti keduanya dengan perubahan makna, seperti stop, remember, dan try.",f:"Verb + V-ing | Verb + to + V1 | Verb + object + to + V1",ok:"She enjoys reading. / They decided to leave.",no:"She enjoys to read.",mist:"Bentuk setelah kata kerja tidak selalu bisa diterjemahkan langsung dari bahasa Indonesia. Pelajari pola kata kerja bersama contohnya.",eg:[["I enjoy learning new languages.","Saya menikmati belajar bahasa baru."],["He decided to study abroad.","Dia memutuskan untuk kuliah di luar negeri."],["Please remember to lock the door.","Tolong ingat untuk mengunci pintu."],["I remember meeting her at the event.","Saya ingat pernah bertemu dengannya di acara itu."]],q:[["They avoid ___ late.",["to arrive","arriving","arrive"],"arriving","Avoid diikuti gerund (V-ing)."],["She hopes ___ a scholarship.",["getting","get","to get"],"to get","Hope diikuti infinitive (to + V1)."],["Please remember ___ your assignment tomorrow.",["to submit","submitting","submit"],"to submit","Remember to do = ingat untuk melakukan sesuatu."],["I remember ___ that film when I was young.",["to watch","watch","watching"],"watching","Remember doing = mengingat pengalaman yang sudah terjadi."],["He stopped ___ because he was tired.",["to work","working","work"],"working","Stop doing = berhenti melakukan kegiatan tersebut."]]},
{id:"b1-tag",t:"Question Tags",o:"Memastikan informasi atau meminta persetujuan dengan pertanyaan singkat.",ex:"Question tag adalah pertanyaan pendek di akhir kalimat. Kalimat positif biasanya diikuti tag negatif, sedangkan kalimat negatif diikuti tag positif. Gunakan auxiliary yang sama dengan kalimat utama: is/isn't, can/can't, have/haven't, atau do/don't.",f:"Kalimat positif + tag negatif | Kalimat negatif + tag positif",ok:"You are ready, aren't you? / She doesn't drive, does she?",no:"You are ready, don't you?",mist:"Pilih auxiliary berdasarkan kata kerja pada kalimat utama. Jika tidak ada auxiliary, gunakan do/does/did.",eg:[["He is your brother, isn't he?","Dia saudaramu, bukan?"],["They haven't finished, have they?","Mereka belum selesai, kan?"],["You like coffee, don't you?","Kamu suka kopi, bukan?"],["Let's start, shall we?","Mari kita mulai, ya?"]],q:[["You are from Indonesia, ___?",["are you","aren't you","don't you"],"aren't you","Kalimat positif dengan are memakai tag negatif aren't you."],["She doesn't eat meat, ___?",["does she","doesn't she","is she"],"does she","Kalimat negatif memakai tag positif."],["They went home, ___?",["didn't they","weren't they","don't they"],"didn't they","Past simple memakai did dalam question tag."],["He can swim, ___?",["can he","can't he","doesn't he"],"can't he","Modal can diulang dalam tag dengan bentuk negatif."],["Let's take a break, ___?",["will we","shall we","do we"],"shall we","Let's biasanya diikuti shall we."]]},
{id:"b1-mod2",t:"Modals of Possibility, Advice, and Obligation",o:"Menyatakan kemungkinan, saran, kewajiban, dan larangan dengan tingkat kekuatan yang berbeda.",ex:"May, might, dan could menyatakan kemungkinan. Should dan ought to memberi saran. Must dan have to menyatakan kewajiban, sedangkan mustn't berarti dilarang. Don't have to berarti tidak wajib, bukan dilarang.",f:"Possibility: may/might/could + V1 | Advice: should + V1 | Obligation: must/have to + V1",ok:"You should rest. / Visitors must wear an ID card.",no:"You mustn't come early (jika maksudnya tidak wajib).",mist:"Bedakan mustn't (tidak boleh) dan don't have to (tidak perlu/tidak wajib). Keduanya tidak memiliki arti yang sama.",eg:[["It might rain this afternoon.","Mungkin hujan sore ini."],["You should talk to your teacher.","Kamu sebaiknya berbicara dengan gurumu."],["All students have to attend the meeting.","Semua siswa harus menghadiri rapat."],["You don't have to bring food; it is provided.","Kamu tidak perlu membawa makanan; makanan sudah disediakan."]],q:[["You ___ see a doctor if you feel unwell.",["should","mightn't","mustn't"],"should","Should digunakan untuk memberi saran."],["It ___ be difficult, but we can try.",["mustn't","might","has to"],"might","Might menyatakan kemungkinan."],["You ___ use your phone during the exam. It is forbidden.",["don't have to","mustn't","might"],"mustn't","Mustn't berarti dilarang."],["We ___ wear uniforms on Fridays; it is optional.",["must","have to","don't have to"],"don't have to","Don't have to berarti tidak wajib."],["Employees ___ show their ID cards to enter the building.",["have to","might","shouldn't"],"have to","Have to menyatakan kewajiban atau aturan."]]}
],B2:[
{id:"b2-c3",t:"Third Conditional",o:"Membicarakan pengandaian tentang masa lalu yang tidak terjadi.",ex:"Third conditional dipakai untuk membayangkan hal yang berbeda di masa lalu beserta akibatnya. Situasinya sudah tidak bisa diubah, jadi biasanya berupa penyesalan atau pengandaian. Klausa if memakai past perfect (had + V3), klausa hasil memakai would have + V3.",f:"If + had + V3, would have + V3",ok:"If I had studied harder, I would have passed the exam.",no:"If I would have studied harder, I would have passed the exam.",mist:"Memakai would have di klausa if (If I would have...). Setelah if, pakai had + V3. Juga sering keliru memakai past simple untuk masa lalu yang tidak nyata.",eg:[["If she had left earlier, she wouldn’t have missed the train.","Seandainya dia berangkat lebih awal, dia tidak akan ketinggalan kereta."],["We would have won if we had played better.","Kami pasti menang kalau bermain lebih baik."],["If I had known, I would have told you.","Seandainya saya tahu, saya pasti sudah memberi tahumu."]],q:[["If I ___ the alarm, I wouldn’t have been late.",["heard","had heard","would hear"],"had heard","Klausa if pada third conditional memakai had + V3."],["She would have called you if she ___ your number.",["had had","has had","would have"],"had had","Past perfect dari have adalah had had."],["If they ___ (leave) earlier, they would have caught the bus.",null,"had left","Klausa if: had + V3 (left)."],["We ___ (win) the game if we had played better.",null,"would have won","Klausa hasil: would have + V3.",["'d have won"]],["Which sentence is correct?",["If I would have known, I would have helped.","If I had known, I would have helped.","If I knew, I would have helped."],"If I had known, I would have helped.","If + had + V3, would have + V3."]]},
{id:"b2-wi",t:"Wish and If only",o:"Menyatakan penyesalan dan keinginan yang berlawanan dengan kenyataan.",ex:"Wish dan if only dipakai untuk penyesalan atau keinginan yang berlawanan dengan kenyataan. Untuk situasi sekarang pakai past simple (I wish I had more time). Untuk penyesalan masa lalu pakai past perfect (I wish I had studied). Untuk keluhan tentang kebiasaan orang lain pakai would (I wish he would stop talking).",f:"Sekarang: wish + past simple | Masa lalu: wish + had + V3 | Keluhan: wish + would + V1",ok:"I wish I had a bigger house.",no:"I wish I have a bigger house.",mist:"Memakai present simple setelah wish karena menerjemahkan 'ingin sekali'. Untuk situasi yang tidak nyata, bentuk kata kerjanya bergeser satu langkah ke belakang (past).",eg:[["I wish I lived near the beach.","Andai saya tinggal dekat pantai."],["She wishes she had accepted the job.","Dia menyesal tidak menerima pekerjaan itu."],["I wish you would stop shouting.","Saya harap kamu berhenti berteriak."]],q:[["I wish I ___ more free time.",["have","had","will have"],"had","Keinginan untuk situasi sekarang: wish + past simple."],["He wishes he ___ harder when he was a student.",["studied","had studied","would study"],"had studied","Penyesalan masa lalu: wish + past perfect."],["I wish it ___ (not/rain) so much today.",null,"didn't rain","Situasi sekarang yang tidak diinginkan: wish + past simple.",["did not rain","wasn't raining"]],["I wish my neighbor ___ playing loud music at night.",["would stop","stops","stopped to"],"would stop","Keluhan tentang kebiasaan orang lain: wish + would."],["If only I ___ (know) the answer yesterday!",null,"had known","If only + past perfect untuk penyesalan masa lalu."]]},
{id:"b2-pf",t:"Past Perfect Continuous",o:"Menekankan durasi atau proses sebelum suatu kejadian di masa lalu.",ex:"Past perfect continuous digunakan untuk kegiatan yang telah berlangsung selama beberapa waktu sebelum kejadian lain di masa lalu. Bentuknya had been + V-ing. Bandingkan dengan past perfect simple yang menekankan hasil atau selesainya suatu tindakan.",f:"Subject + had been + V-ing",ok:"She had been studying for hours before the exam began.",no:"She had been study for hours before the exam began.",mist:"Setelah had been gunakan V-ing, bukan V1 atau V3. Gunakan bentuk ini saat ingin menekankan proses atau durasi.",eg:[["They had been waiting for an hour when the bus finally arrived.","Mereka sudah menunggu selama satu jam ketika bus akhirnya tiba."],["He was tired because he had been working all night.","Dia lelah karena sudah bekerja sepanjang malam."],["How long had you been living there before you moved?","Sudah berapa lama kamu tinggal di sana sebelum pindah?"],["It had been raining, so the roads were wet.","Hujan sudah turun sehingga jalanan basah."]],q:[["She was exhausted because she ___ all day.",["had worked","had been working","has been working"],"had been working","Past perfect continuous menekankan proses sebelum kondisi lelah di masa lalu."],["They ___ for 30 minutes before the teacher arrived.",["had been talking","have been talking","were talk"],"had been talking","Durasi sebelum kejadian lampau: had been + V-ing."],["How long ___ he been waiting when you saw him?",["has","had","was"],"had","Pertanyaan past perfect continuous menggunakan had + subject + been + V-ing."],["I ___ (study) for two hours before dinner.",null,"had been studying","Rumusnya had been + V-ing."],["Which sentence focuses on the duration of an activity?",["She had completed the report.","She had been writing the report for three hours.","She wrote the report yesterday."],"She had been writing the report for three hours.","Past perfect continuous menekankan durasi suatu proses."]]},
{id:"b2-pm",t:"Passive with Modals and Perfect",o:"Membuat kalimat pasif dengan modal dan present perfect.",ex:"Pasif tidak hanya dalam present dan past simple. Dengan modal verb: modal + be + V3 (The report must be finished today). Dengan present perfect: has/have been + V3 (The road has been closed). Bentuk ini sering muncul di berita dan teks resmi, ketika pelaku tidak penting.",f:"Modal: modal + be + V3 | Present perfect: have/has been + V3",ok:"The report must be finished by Friday.",no:"The report must finished by Friday.",mist:"Lupa be setelah modal (must finished) atau memakai been tanpa have/has. Ingat urutannya: modal + be + V3, dan have/has + been + V3.",eg:[["The tickets can be bought online.","Tiketnya bisa dibeli secara daring."],["The bridge has been repaired.","Jembatan itu sudah diperbaiki."],["Phones should be switched off during the exam.","Ponsel sebaiknya dimatikan selama ujian."]],q:[["Mobile phones must ___ off during the flight.",["switch","be switched","been switched"],"be switched","Modal + be + V3."],["The road ___ closed because of the flood.",["has been","have been","is been"],"has been","Subjek tunggal (the road) memakai has been + V3."],["These documents should ___ (keep) in a safe place.",null,"be kept","Modal + be + V3 (kept)."],["The problem ___ (solve) already.",null,"has been solved","Present perfect pasif: has been + V3."],["Choose the correct passive: They can fix the computer.",["The computer can fix.","The computer can be fixed.","The computer can been fixed."],"The computer can be fixed.","Modal + be + V3."]]},
{id:"b2-md",t:"Modals of Deduction",o:"Menebak sesuatu berdasarkan bukti dengan must, might, dan can’t.",ex:"Modals of deduction dipakai untuk menebak sesuatu berdasarkan bukti. Must menunjukkan hampir pasti benar, might/may/could menunjukkan kemungkinan, dan can’t menunjukkan hampir pasti tidak benar. Untuk keadaan sekarang pakai modal + V1 (He must be tired). Untuk kejadian lampau pakai modal + have + V3 (He must have forgotten).",f:"Sekarang: must/might/can’t + V1 | Lampau: must/might/can’t + have + V3",ok:"She must have left already. Her coat isn’t here.",no:"She must left already.",mist:"Memakai must untuk kewajiban padahal maksudnya tebakan, atau lupa have + V3 untuk kejadian lampau. Lawan must dalam tebakan adalah can’t, bukan mustn’t.",eg:[["He has been working all day. He must be exhausted.","Dia bekerja seharian. Dia pasti kelelahan."],["The lights are off. They might have gone out.","Lampunya mati. Mungkin mereka sudah pergi."],["That can’t be Sarah. She is on holiday.","Itu tidak mungkin Sarah. Dia sedang berlibur."]],q:[["The lights are on, so they ___ be at home.",["must","mustn’t","have to"],"must","Ada bukti (lampu menyala), jadi tebakan yang hampir pasti memakai must."],["He ___ have forgotten the meeting. He always writes everything down.",["can’t","must","mustn’t"],"can’t","Hampir pasti tidak benar, jadi can’t + have + V3."],["She isn’t answering her phone. She ___ be asleep. (possible)",null,"might","Kemungkinan memakai might, may, atau could.",["may","could"]],["The ground is wet. It ___ have rained last night. (almost certain)",null,"must","Hampir pasti benar: must + have + V3."],["Which sentence is correct for a past deduction?",["He must forget it.","He must have forgotten it.","He must has forgotten it."],"He must have forgotten it.","Tebakan masa lalu: must + have + V3."]]},
{id:"b2-nr",t:"Non-defining Relative Clauses",o:"Menambahkan informasi tambahan dengan koma dan who, which, whose.",ex:"Non-defining relative clause memberi informasi tambahan yang tidak dibutuhkan untuk mengenali orang atau bendanya. Klausa ini dipisah dengan koma dan memakai who, which, atau whose, tidak boleh memakai that. Kalau klausanya dihapus, kalimat tetap jelas. Contoh: My sister, who lives in Bali, is a nurse.",f:"Noun, who/which/whose + clause, ...",ok:"My brother, who lives in Medan, is a doctor.",no:"My brother, that lives in Medan, is a doctor.",mist:"Memakai that dan lupa koma. Untuk informasi tambahan, koma wajib ada dan that tidak boleh dipakai. Jangan juga mengulang subjek (which it).",eg:[["Jakarta, which is the capital, is very crowded.","Jakarta, yang merupakan ibu kota, sangat padat."],["Mr. Adi, whose son studies abroad, is our neighbor.","Pak Adi, yang putranya kuliah di luar negeri, adalah tetangga kami."],["I met Rina, who works at the bank.","Saya bertemu Rina, yang bekerja di bank."]],q:[["My uncle, ___ lives in Bali, is a chef.",["that","who","which"],"who","Orang dengan informasi tambahan memakai who."],["Borobudur, ___ is in Central Java, is a famous temple.",["that","who","which"],"which","Benda dengan informasi tambahan memakai which."],["Which sentence is correct?",["My car, that is red, is new.","My car, which is red, is new.","My car which is red, is new."],"My car, which is red, is new.","Informasi tambahan: koma dan which, bukan that."],["Mr. Adi, ___ son studies abroad, is our neighbor.",null,"whose","Whose menunjukkan kepemilikan."],["I met Rina, ___ works at the bank.",null,"who","Orang dalam informasi tambahan memakai who."]]},
{id:"b2-gi",t:"Gerund vs Infinitive",o:"Memilih V-ing atau to + V1 setelah kata kerja tertentu.",ex:"Beberapa kata kerja diikuti gerund (V-ing), beberapa diikuti to + V1. Gerund dipakai setelah enjoy, avoid, mind, finish, suggest, dan setelah preposisi. To-infinitive dipakai setelah want, decide, hope, plan, promise, dan manage. Ada pasangan yang artinya berbeda: stop doing (berhenti melakukan) dan stop to do (berhenti untuk melakukan), serta remember doing (ingat pernah) dan remember to do (ingat untuk).",f:"enjoy/avoid/finish + V-ing | want/decide/hope + to + V1",ok:"I enjoy reading. / I decided to study abroad.",no:"I enjoy to read. / I decided studying abroad.",mist:"Memakai to setelah enjoy atau avoid, dan memakai V-ing setelah decide atau want. Hafalkan kelompok kata kerjanya, dan bedakan stop doing dengan stop to do.",eg:[["She avoids eating sweets.","Dia menghindari makan makanan manis."],["We hope to visit Japan next year.","Kami berharap mengunjungi Jepang tahun depan."],["He stopped smoking last year.","Dia berhenti merokok tahun lalu."]],q:[["I enjoy ___ to music in the evening.",["to listen","listening","listen"],"listening","Enjoy diikuti gerund (V-ing)."],["They decided ___ a new house.",["buying","to buy","buy"],"to buy","Decide diikuti to + V1."],["She suggested ___ (go) to the beach.",null,"going","Suggest diikuti gerund (V-ing)."],["I forgot ___ (lock) the door, so I went back.",null,"to lock","Forget to do berarti lupa melakukan sesuatu yang seharusnya dilakukan."],["He stopped to drink water means he...",["stopped drinking water","stopped what he was doing in order to drink water","never drinks water"],"stopped what he was doing in order to drink water","Stop to do berarti berhenti untuk melakukan sesuatu."]]},
{id:"b2-rq",t:"Reported Questions",o:"Menyampaikan pertanyaan orang lain dengan urutan kalimat biasa.",ex:"Pertanyaan yang dilaporkan tidak memakai urutan pertanyaan. Susunannya kembali biasa (subjek lalu kata kerja), tanpa do/does/did dan tanpa tanda tanya. Tense bergeser satu langkah ke belakang seperti reported speech. Untuk pertanyaan ya/tidak pakai if atau whether, sedangkan untuk pertanyaan dengan kata tanya, pakai kata tanya itu.",f:"asked + (wh-word / if) + subject + verb (tense mundur)",ok:"She asked me where I lived.",no:"She asked me where did I live.",mist:"Mempertahankan urutan pertanyaan (where did I live) dan memakai did. Dalam kalimat tidak langsung, urutannya biasa: kata tanya + subjek + kata kerja, tanpa do/did.",eg:[["He asked me what time the film started.","Dia bertanya jam berapa film itu mulai."],["She asked if I was hungry.","Dia bertanya apakah saya lapar."],["They wanted to know where we had been.","Mereka ingin tahu di mana kami tadi berada."]],q:[["Where do you live? She asked me where I ___.",["live","lived","did live"],"lived","Tense mundur (live menjadi lived) dan tanpa did."],["Are you tired? He asked me ___ I was tired.",["that","if","what"],"if","Pertanyaan ya/tidak memakai if atau whether."],["What time does the film start? He asked what time the film ___.",null,"started","Tense mundur: start menjadi started."],["Which sentence is correct?",["She asked me where did I live.","She asked me where I lived.","She asked me where I live did."],"She asked me where I lived.","Urutan biasa: kata tanya + subjek + kata kerja."],["Have you finished? She asked if I ___ finished.",null,"had","Present perfect mundur menjadi past perfect (had finished)."]]}
